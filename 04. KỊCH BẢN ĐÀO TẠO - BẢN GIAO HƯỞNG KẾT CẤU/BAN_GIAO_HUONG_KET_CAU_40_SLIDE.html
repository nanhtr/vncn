a tốc trọng trường, là kết quả của sự chính xác tuyệt đối từ ván khuôn lõi cho đến từng con bu lông ray. Và trong ngày tồi tệ nhất, chiếc thang chữa cháy kia phải đưa lính cứu hỏa lên đỉnh tháp trong vòng sáu mươi giây.", "sw": ["#00E5FF", "#263238", "#B8BDC4", "#4675ED", "#61FC6C", "#F3C63A", "#FFC400", "#D32F2F"], "scene": "tower", "opts": {"mode": "elevator"}}, {"n": 28, "title": "Trạm biến áp trung thế, máy phát dự phòng và hệ Busway", "code": "EPC-SPEC-28-ELE", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>IEC 60364 (TCVN 7447)<\/td><td>Hệ thống lắp đặt điện hạ áp; IEC 60364-6 kiểm tra<\/td><\/tr><tr><td>IEC 61439-1/-2/-6<\/td><td>Tủ điện đóng cắt hạ áp; hệ thanh dẫn Busway<\/td><\/tr><tr><td>IEC 60076-11<\/td><td>Máy biến áp khô<\/td><\/tr><tr><td>IEC 62271-200<\/td><td>Tủ trung thế RMU/Switchgear<\/td><\/tr><tr><td>ISO 8528 / NFPA 110<\/td><td>Máy phát điện; nguồn khẩn cấp<\/td><\/tr><tr><td>TCVN 9206:2012 / TCVN 9207:2012<\/td><td>Lắp đặt thiết bị điện, dây dẫn trong nhà và công trình công cộng<\/td><\/tr><tr><td>TCVN 9385:2012<\/td><td>Chống sét cho công trình<\/td><\/tr><tr><td>IEEE 519-2022<\/td><td>Giới hạn sóng hài<\/td><\/tr><tr><td>QCVN 26:2010/BTNMT<\/td><td>Tiếng ồn<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Máy biến áp<\/td><td>4 × 2 500 kVA khô (cast resin) 22/0,4 kV, cấp cách điện F, tổn hao theo cấp hiệu suất cao<\/td><td>Thử xuất xưởng + thử hiện trường<\/td><td>W<\/td><\/tr><tr><td>Busway<\/td><td>Đồng/nhôm 2 500–4 000 A, IP54 trong trục, lực siết bu lông theo nhà sản xuất (cờ lê lực, đánh dấu)<\/td><td>100% mối nối<\/td><td>W<\/td><\/tr><tr><td>Điện trở cách điện<\/td><td>≥ 1 MΩ (mạch ≤ 500 V, thử 500 V DC — IEC 60364-6); Spec dự án busway ≥ 100 MΩ @ 1 000 V DC<\/td><td><\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Thử cao áp tủ trung thế<\/td><td>Theo IEC 62271 (tần số công nghiệp/VLF)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Máy phát<\/td><td>3 × 2 000 kVA chạy song song (N+1); khởi động – mang tải ≤ 10 s (NFPA 110 Type 10, Level 1)<\/td><td>Thử \"black building\"<\/td><td>H<\/td><\/tr><tr><td>Nhiên liệu dự trữ<\/td><td>≥ 8–24 h đầy tải (theo phân cấp tải khẩn cấp, PCCC tối thiểu theo QCVN 06)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Thử tải máy phát<\/td><td>Tải giả (load bank) 100% trong 4 h, 110% trong 1 h<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Điện trở nối đất<\/td><td>Hệ thống ≤ 1 Ω (Spec dự án); chống sét ≤ 10 Ω<\/td><td>Đo mùa khô<\/td><td>W<\/td><\/tr><tr><td>Sóng hài<\/td><td>THDv ≤ 5% tại điểm đấu nối chung (IEEE 519)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Nhiệt độ mối nối<\/td><td>Chụp nhiệt hồng ngoại khi mang tải ≥ 40%: chênh lệch ≥ 10 °C so với pha tương đương → xử lý<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Ồn máy phát<\/td><td>≤ 70 dB(A) tại ranh giới (giờ ban ngày khu dân cư theo QCVN 26)<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Trạm biến áp 22/0,4 kV 4 × 2 500 kVA khô, tủ MSB IEC 61439 tại tầng hầm kỹ thuật, phân phối qua Busway 4 000 A dọc trục điện.", "Máy phát N+1 khởi động – mang tải ≤ 10 s, thử tải giả 100%/4 h và thử \"tòa nhà mất điện\".", "Cách điện ≥ 100 MΩ cho Busway, nối đất ≤ 1 Ω, THDv ≤ 5%, chụp nhiệt hồng ngoại 100% mối nối khi mang tải."], "vis": "<ul><li><strong>Industrial Cinematic Room Shot:<\/strong> dolly dọc dãy tủ điện <code class=\"hex\"><i style=\"background:#9E9E9E\"><\/i>#9E9E9E<\/code> sơn tĩnh điện, ống kính 35 mm, f/2.8, ánh sáng lạnh 5 600 K, phản chiếu sàn epoxy <code class=\"hex\"><i style=\"background:#455A64\"><\/i>#455A64<\/code>.<\/li><li>Busway vỏ nhôm <code class=\"hex\"><i style=\"background:#BDBDBD\"><\/i>#BDBDBD<\/code> chạy lên trần rồi rẽ vào trục; dòng điện mô phỏng là xung sáng <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> chạy dọc thanh dẫn.<\/li><li>Cảnh camera nhiệt: mối nối busway hiển thị palette Ironbow.<\/li><\/ul>", "tl": [[0, 2000, "Máy phát 20 t được kéo trên con lăn vào phòng máy, giảm chấn lò xo dưới bệ"], [2000, 4500, "Thanh busway nối tiếp, cờ lê lực xoay đến <code>70 N·m<\/code> click, vạch sơn đánh dấu"], [4500, 6500, "Megger đo cách điện: <code>&gt; 2 000 MΩ<\/code> PASS"], [6500, 9000, "Đóng máy cắt chính: xung sáng xanh lan từ trạm lên 55 tầng trong 1,5 s"], [9000, 12000, "Mô phỏng mất điện lưới: màn đen 0,3 s → máy phát nổ máy → ATS chuyển → đèn bật lại ở <code>8,4 s<\/code> <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>"]], "bim": "<ul><li>Sơ đồ một sợi: trung thế <code class=\"hex\"><i style=\"background:#D32F2F\"><\/i>#D32F2F<\/code>, hạ thế thường <code class=\"hex\"><i style=\"background:#0057B8\"><\/i>#0057B8<\/code>, khẩn cấp <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, UPS <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>.<\/li><li>Camera nhiệt: &lt; 50 °C <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code>, 50–70 °C <code class=\"hex\"><i style=\"background:#F3C63A\"><\/i>#F3C63A<\/code>, &gt; 70 °C <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Biên bản thử nghiệm của tổ chức thí nghiệm điện độc lập + thỏa thuận đấu nối của điện lực trước khi đóng điện.<\/li><li><strong>Điểm mù 1:<\/strong> Phối hợp bảo vệ chọn lọc (selectivity) không được nghiên cứu → sự cố một tầng cắt cả tòa. Bắt buộc nghiên cứu ngắn mạch, phối hợp bảo vệ, arc-flash.<\/li><li><strong>Điểm mù 2:<\/strong> Thanh busway trong trục bị nước rò từ ống phía trên — không bố trí ống nước phía trên busway, hoặc dùng IP65 và máng chắn.<\/li><li><strong>Điểm mù 3:<\/strong> Ống khói và cửa lấy gió máy phát gây quẩn khí xả vào cửa lấy gió tươi của tòa nhà.<\/li><\/ul>", "quote": "Điện năng là nhịp tim của một tòa nhà thông minh — ngừng mười giây là thang máy dừng, quạt tăng áp tắt, máy chủ sập. Vì vậy chúng ta không chỉ lắp đặt, chúng ta mô phỏng chính khoảnh khắc tồi tệ nhất: cắt toàn bộ điện lưới và bấm giờ cho đến khi ánh sáng trở lại. Tám giây bốn — đó là con số chứng minh tòa nhà này không bao giờ ngừng thở.", "sw": ["#9E9E9E", "#455A64", "#BDBDBD", "#00E5FF", "#D32F2F", "#0057B8", "#FFAB00", "#7E57C2", "#4675ED", "#F3C63A", "#D23105"], "scene": "pipes", "opts": {"mode": "power"}}, {"n": 29, "title": "Phòng cháy chữa cháy thông minh: Sprinkler, màn nước ngăn cháy và tăng áp", "code": "EPC-SPEC-29-FPS", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>QCVN 06:2022/BXD + Sửa đổi 1:2023<\/td><td>An toàn cháy cho nhà và công trình<\/td><\/tr><tr><td>TCVN 7336:2021<\/td><td>Hệ thống sprinkler tự động — yêu cầu thiết kế và lắp đặt<\/td><\/tr><tr><td>TCVN 3890:2023<\/td><td>Phương tiện PCCC — trang bị, bố trí<\/td><\/tr><tr><td>TCVN 5738:2021<\/td><td>Hệ thống báo cháy tự động<\/td><\/tr><tr><td>NFPA 13 / NFPA 20 / NFPA 92 / NFPA 72<\/td><td>Sprinkler / Bơm chữa cháy / Kiểm soát khói / Báo cháy<\/td><\/tr><tr><td>EN 12101-6<\/td><td>Hệ thống chênh lệch áp suất (tăng áp)<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Phủ sprinkler<\/td><td>100% diện tích (trừ khu vực được phép miễn trừ)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Đầu phun<\/td><td>Bóng thủy tinh 68 °C (đỏ), phản ứng nhanh (RTI ≤ 50 (m·s)^½) cho khu dân dụng/văn phòng<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Cường độ phun<\/td><td>Nguy cơ thấp/trung bình OH: 5–8 mm/phút trên diện tích tính toán 144–216 m² (theo TCVN 7336)<\/td><td>Tính toán thủy lực<\/td><td>R<\/td><\/tr><tr><td>Bơm chữa cháy chính<\/td><td>Theo tính toán thủy lực, ví dụ Q ≈ 150–250 m³/h, H ≈ 100–140 m mỗi vùng (bơm điện + bơm diesel dự phòng + bơm bù áp)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Thử bơm (NFPA 20)<\/td><td>Tại 150% lưu lượng định mức, cột áp ≥ 65% định mức; áp lực đóng van (churn) ≤ 140% định mức<\/td><td><\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Áp lực dư đầu phun bất lợi nhất<\/td><td>≥ 0,5 bar (Spec dự án ≥ 1,0 bar)<\/td><td>Thử van kiểm tra cuối tuyến<\/td><td>H<\/td><\/tr><tr><td>Tăng áp buồng thang/khoang đệm<\/td><td>Chênh áp 20–50 Pa khi cửa đóng (QCVN 06)<\/td><td>Đo từng tầng<\/td><td>H<\/td><\/tr><tr><td>Lực mở cửa thoát nạn<\/td><td>≤ 100 N tại tay nắm (EN 12101-6) / ≤ 133 N (NFPA 101)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Vận tốc gió qua cửa mở (khoang đệm)<\/td><td>≥ 1,3 m/s (Spec theo EN 12101-6 cấp C/E)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Hút khói hành lang<\/td><td>Kích hoạt ≤ 60 s sau tín hiệu báo cháy; thông số theo tính toán QCVN 06<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Màn nước ngăn cháy (drencher)<\/td><td>Cường độ ≥ 0,5–1,0 l/s trên mỗi mét chiều dài màn (theo thiết kế được thẩm duyệt)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Thử áp đường ống<\/td><td>13,8 bar/2 h (xem Slide 26)<\/td><td><\/td><td>H<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Sprinkler phản ứng nhanh 68 °C phủ 100% sàn, tính toán thủy lực vùng bất lợi; bơm thử 150% lưu lượng còn ≥ 65% cột áp.", "Tăng áp buồng thang và khoang đệm 20–50 Pa, lực mở cửa ≤ 100 N; hút khói hành lang tự kích hoạt ≤ 60 s.", "Màn nước ngăn cháy tại sảnh thông tầng và ranh giới khoang cháy theo thiết kế được thẩm duyệt."], "vis": "<ul><li><strong>Emergency Simulation View:<\/strong> hành lang tầng 30, ống kính 21 mm, khói mô phỏng volumetric <code class=\"hex\"><i style=\"background:#424242\"><\/i>#424242<\/code> dâng dưới trần; đèn báo cháy đỏ nhấp nháy 1 Hz.<\/li><li>Bóng thủy tinh đỏ <code class=\"hex\"><i style=\"background:#D32F2F\"><\/i>#D32F2F<\/code> vỡ (slow-motion 1 000 fps quy đổi 40×), nước phun hình ô dạng sương <code class=\"hex\"><i style=\"background:#E1F5FE\"><\/i>#E1F5FE<\/code>.<\/li><li>Mũi tên luồng khí tăng áp <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code> đẩy khói khỏi buồng thang; cửa thoát nạn với đồng hồ chênh áp <code>38 Pa<\/code>.<\/li><\/ul>", "tl": [[0, 2000, "Đám cháy nhỏ phát triển (mô hình t² nhanh), khói lan dưới trần; đầu báo khói chớp đỏ ở 1 400 ms"], [2000, 3500, "Trung tâm báo cháy nhận tín hiệu, ma trận nhân – quả (cause &amp; effect) sáng các ô"], [3500, 5500, "Nhiệt độ trần đạt 68 °C: bóng sprinkler vỡ (slow-mo), nước phun; công tắc dòng chảy báo về"], [5500, 8500, "Quạt tăng áp và quạt hút khói khởi động; khói bị kéo về miệng hút, buồng thang sạch; đồng hồ <code>38 Pa<\/code>, lực mở cửa <code>86 N<\/code>"], [8500, 10500, "Bơm chữa cháy tự khởi động khi áp giảm; màn nước drencher hạ xuống tại sảnh thông tầng"], [10500, 12000, "Ngọn lửa bị khống chế; nhãn <code>FIRE CONTROLLED — 4 heads operated<\/code>"]], "bim": "<ul><li>Mô phỏng CFD khói (FDS — Fire Dynamics Simulator): lưới 0,1–0,2 m, HRR thiết kế 2,5–5 MW (văn phòng có sprinkler); tầm nhìn ≥ 10 m <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, 5–10 m <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, &lt; 5 m <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><li>Nhiệt độ lớp khói: thang Turbo 20 → 300 °C.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Nghiệm thu PCCC của cơ quan Cảnh sát PCCC &amp; CNCH là điều kiện tiên quyết để đưa công trình vào sử dụng (xem Slide 36).<\/li><li><strong>Điểm mù 1:<\/strong> Trần giả, ống gió, máng cáp che chắn đầu phun (obstruction) — kiểm tra quy tắc khoảng cách theo TCVN 7336/NFPA 13 trên BIM.<\/li><li><strong>Điểm mù 2:<\/strong> Tăng áp quá mức làm cửa không mở được — cần van xả áp (relief damper) điều khiển biến tần.<\/li><li><strong>Điểm mù 3:<\/strong> Hiệu ứng ống khói mùa lạnh/nóng làm thay đổi phân bố áp lực theo chiều cao — chia vùng tăng áp hoặc nhiều điểm cấp gió.<\/li><\/ul>", "quote": "Hệ thống phòng cháy chữa cháy là lời hứa duy nhất trong tòa nhà mà chúng ta mong không bao giờ phải thực hiện — nhưng nó phải hoạt động hoàn hảo ngay lần đầu tiên. Một bóng thủy tinh vỡ ở sáu mươi tám độ, bốn đầu phun mở, buồng thang được giữ ở ba mươi tám pascal để khói không thể len vào, và cánh cửa vẫn đủ nhẹ để một đứa trẻ đẩy ra. Đó là bản giao hưởng bảo vệ sự sống, và mỗi nốt nhạc đều phải được thử nghiệm.", "sw": ["#424242", "#D32F2F", "#E1F5FE", "#7E57C2", "#00C853", "#FFAB00", "#D50000"], "scene": "sprinkler", "opts": {}}, {"n": 30, "title": "Tường ngăn nhẹ bằng gạch bê tông khí chưng áp (AAC) và trát kỹ thuật cao", "code": "EPC-SPEC-30-AAC", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 7959:2017<\/td><td>Bloc bê tông khí chưng áp (AAC)<\/td><\/tr><tr><td>TCVN 9028:2011<\/td><td>Vữa cho bê tông nhẹ<\/td><\/tr><tr><td>TCVN 4085:2011<\/td><td>Kết cấu gạch đá — thi công và nghiệm thu<\/td><\/tr><tr><td>TCVN 9377-2:2012<\/td><td>Công tác hoàn thiện — trát<\/td><\/tr><tr><td>QCVN 06:2022/BXD<\/td><td>Giới hạn chịu lửa EI tường ngăn<\/td><\/tr><tr><td>ISO 717-1<\/td><td>Chỉ số cách âm Rw<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Khối lượng thể tích<\/td><td>D500–D700 (500–700 kg/m³)<\/td><td>±50 kg/m³<\/td><td>R<\/td><\/tr><tr><td>Cấp cường độ<\/td><td>B3 – B4 (≥ 3,5–5,0 MPa)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Cách âm tường 200 mm trát 2 mặt<\/td><td>Rw ≥ 45 dB (giữa căn hộ yêu cầu ≥ 50 dB → dùng tường kép/tăng khối lượng)<\/td><td>Thử hiện trường DnT,w<\/td><td>W<\/td><\/tr><tr><td>Chịu lửa<\/td><td>Tường 150–200 mm đạt EI 180–240 (theo chứng chỉ thử nghiệm)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Mạch keo (thin-bed)<\/td><td>2–3 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ thẳng đứng tường<\/td><td>≤ 5 mm/tầng (Spec dự án; TCVN 4085 ≤ 10 mm)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ phẳng mặt xây<\/td><td>≤ 5 mm/2 m<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Khe mềm đỉnh tường<\/td><td>15–20 mm dưới đáy sàn/dầm, chèn vật liệu đàn hồi chống cháy (đá khoáng + sealant chống cháy)<\/td><td>Hấp thụ võng sàn L/500<\/td><td>H<\/td><\/tr><tr><td>Lưới thủy tinh chống nứt<\/td><td>Phủ ≥ 150 mm mỗi bên vị trí tiếp giáp vật liệu khác<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ ẩm AAC trước trát<\/td><td>≤ 15–20%<\/td><td>Máy đo ẩm<\/td><td>W<\/td><\/tr><tr><td>Chiều dày trát<\/td><td>8–12 mm (vữa trộn sẵn)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ phẳng mặt trát<\/td><td>≤ 3 mm/2 m (hoàn thiện cao cấp, TCVN 9377-2)<\/td><td>Thước 2 m + laser<\/td><td>W<\/td><\/tr><tr><td>Lanh tô<\/td><td>Lanh tô AAC cốt thép hoặc BTCT, gối ≥ 200 mm mỗi bên<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Gạch AAC D600 nhẹ bằng 1/3 gạch đất sét, giảm tải tĩnh cho sàn PT; cách âm Rw ≥ 45 dB, chịu lửa EI 180–240.", "Xây bằng keo mạch mỏng 2–3 mm, khe mềm 15–20 mm đỉnh tường hấp thụ võng sàn; lưới thủy tinh tại mọi vị trí tiếp giáp.", "Trát vữa trộn sẵn 8–12 mm khi độ ẩm gạch ≤ 20%; độ phẳng ≤ 3 mm/2 m kiểm bằng thước laser."], "vis": "<ul><li><strong>Medium Close-up Masonry Shot:<\/strong> ống kính 50 mm, f/2.8, bay răng cưa phết keo xám <code class=\"hex\"><i style=\"background:#9E9E9E\"><\/i>#9E9E9E<\/code>; viên AAC trắng <code class=\"hex\"><i style=\"background:#ECEAE4\"><\/i>#ECEAE4<\/code> với cấu trúc rỗng macro nhìn rõ ở mặt cắt.<\/li><li>Đường laser <code class=\"hex\"><i style=\"background:#1DE9B6\"><\/i>#1DE9B6<\/code> trên sàn và trần làm mốc; thước thủy điện tử hiển thị <code>0,0°<\/code>.<\/li><\/ul>", "tl": [[0, 1500, "Máy laser tự cân bằng chiếu đường mực trên sàn và trần"], [1500, 5000, "Hàng gạch lần lượt đặt xuống, búa cao su gõ nhẹ — mỗi viên 250 ms; mạch keo 2 mm hiển thị macro"], [5000, 6500, "Khe mềm 20 mm ở đỉnh được chèn vật liệu chống cháy <code class=\"hex\"><i style=\"background:#E64A19\"><\/i>#E64A19<\/code>"], [6500, 9000, "Lưới thủy tinh <code class=\"hex\"><i style=\"background:#FFF59D\"><\/i>#FFF59D<\/code> dán tại tiếp giáp cột; mô phỏng sàn võng 8 mm — tường không nứt nhờ khe mềm"], [9000, 12000, "Vữa trát phủ, thước nhôm gạt phẳng; quét laser độ phẳng 2,1 mm/2 m PASS"]], "bim": "<ul><li>Phân loại tường trên BIM theo yêu cầu: tường chống cháy <code class=\"hex\"><i style=\"background:#D32F2F\"><\/i>#D32F2F<\/code> hatch chéo, tường cách âm <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>, tường thường <code class=\"hex\"><i style=\"background:#ECEAE4\"><\/i>#ECEAE4<\/code>.<\/li><li>Mô phỏng nứt: vết nứt xuất hiện màu đen nếu không có khe mềm (minh họa đối chứng, chia đôi khung).<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Nghiệm thu tường xây (bao gồm khe mềm và đường ống âm tường) trước khi trát.<\/li><li><strong>Điểm mù 1:<\/strong> Tường xây chèn cứng dưới sàn PT/sàn nhịp lớn → nứt chéo khi sàn võng từ biến. Khe mềm là bắt buộc.<\/li><li><strong>Điểm mù 2:<\/strong> Cắt rãnh đi ống điện nước sâu &gt; 1/3 chiều dày tường — làm mất khả năng chịu lửa và cách âm; cắt bằng máy cắt rãnh, không đục búa.<\/li><li><strong>Điểm mù 3:<\/strong> Tường AAC tại khu ẩm ướt không được chống thấm chân tường (cao ≥ 300 mm) gây hút ẩm mao dẫn.<\/li><\/ul>", "quote": "Một tòa tháp năm mươi lăm tầng có hàng chục nghìn mét vuông tường ngăn, và mỗi kilogram giảm được ở đây là một kilogram mà sàn, cột, móng không phải gánh. Gạch AAC cho chúng ta sự nhẹ nhàng đó, cùng với khả năng cách âm và chịu lửa vượt trội. Nhưng bí quyết nằm ở một khe hở hai centimet trên đỉnh tường — khoảng trống cho phép sàn được võng mà tường không nứt.", "sw": ["#9E9E9E", "#ECEAE4", "#1DE9B6", "#D32F2F", "#7E57C2"], "scene": "grid", "opts": {"mode": "brick"}}, {"n": 31, "title": "Chống thấm khu vực ẩm ướt (WC, ban công, mái) và thoát nước mưa", "code": "EPC-SPEC-31-WET", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ASTM D5957-98 (R2021)<\/td><td>Hướng dẫn thử ngâm nước chống thấm phương ngang<\/td><\/tr><tr><td>ASTM C836 / C1305<\/td><td>Màng chống thấm lỏng thi công nguội; đàn hồi bắc cầu vết nứt<\/td><\/tr><tr><td>ASTM D412<\/td><td>Độ giãn dài màng<\/td><\/tr><tr><td>TCVN 5718:1993<\/td><td>Mái và sàn BTCT — yêu cầu kỹ thuật chống thấm nước<\/td><\/tr><tr><td>TCVN 4474:1987<\/td><td>Thoát nước bên trong — tiêu chuẩn thiết kế<\/td><\/tr><tr><td>ASTM C1107<\/td><td>Vữa rót không co ngót<\/td><\/tr><tr><td>EN 12056-3<\/td><td>Thoát nước mưa mái<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Màng PU / polyurea<\/td><td>Chiều dày màng khô (DFT) ≥ 1,5 mm (mái lộ thiên ≥ 2,0 mm + lớp phủ UV)<\/td><td>Đo DFT 5 điểm/100 m²<\/td><td>W<\/td><\/tr><tr><td>Độ giãn dài<\/td><td>≥ 400% (ASTM D412)<\/td><td>Chứng chỉ<\/td><td>R<\/td><\/tr><tr><td>Bắc cầu vết nứt<\/td><td>≥ 2 mm (ASTM C1305)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Cổ ống xuyên sàn<\/td><td>Băng trương nở (swelling 200–400%) + vữa không co ngót + màng ôm cổ ống cao ≥ 100 mm<\/td><td>100% cổ ống<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Chiều cao lật màng lên tường<\/td><td>≥ 300 mm (khu tắm đứng ≥ 1 800 mm); ban công ≥ 150 mm trên cao độ hoàn thiện<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ dốc về phễu thu<\/td><td>1–2% (mái 1,5–2%), không đọng nước &gt; 3 mm sau 1 h<\/td><td>Thử đổ nước<\/td><td>W<\/td><\/tr><tr><td>Thử ngâm nước<\/td><td>Ngâm 25–50 mm (ASTM D5957: tối thiểu 25 mm, tối đa 100 mm), thời gian <strong>48 h<\/strong> (Spec dự án)<\/td><td>Không vết ẩm mặt dưới; mức nước giảm chỉ do bay hơi (đối chứng bằng khay chuẩn) — ngưỡng ≤ 2 mm<\/td><td>H<\/td><\/tr><tr><td>Thử lần 2<\/td><td>Sau khi lát gạch/hoàn thiện, ngâm lại 24 h<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Phễu thu mái<\/td><td>Tính theo cường độ mưa thiết kế địa phương (q₅ – chu kỳ 5 năm, thời gian 5 phút); phễu tràn khẩn cấp (overflow) độc lập<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Mái có ống thoát xi-phông (siphonic)<\/td><td>Kiểm tra mồi xi-phông và áp âm theo thiết kế<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Cổ ống xử lý bằng băng trương nở + vữa không co ngót + màng ôm cổ ống ≥ 100 mm — 100% điểm xuyên.", "Màng PU đàn hồi DFT ≥ 1,5 mm (mái ≥ 2,0 mm), giãn dài ≥ 400%, lật tường ≥ 300 mm; dốc 1–2% về phễu thu.", "Thử ngâm nước 48 h trước và 24 h sau hoàn thiện; hệ thoát mưa có phễu tràn khẩn cấp độc lập."], "vis": "<ul><li><strong>Close-up Waterproofing Inspection:<\/strong> camera thấp sát mặt nước, ống kính 35 mm, mặt nước tĩnh trong suốt (caustics trên đáy), kỹ sư rọi đèn pin vào lớp màng xám đậm <code class=\"hex\"><i style=\"background:#424242\"><\/i>#424242<\/code>.<\/li><li>Cảnh song song (split-screen) trần tầng dưới khô ráo, máy đo ẩm hiển thị <code>12% — DRY<\/code>.<\/li><\/ul>", "tl": [[0, 2500, "Băng trương nở quấn cổ ống; vữa rót lấp; mô phỏng nước thấm vào thì băng phồng lên bịt kín"], [2500, 5500, "Ba lớp màng PU quét chéo nhau (lớp 1 <code class=\"hex\"><i style=\"background:#757575\"><\/i>#757575<\/code>, lớp 2 <code class=\"hex\"><i style=\"background:#424242\"><\/i>#424242<\/code>, lớp 3 <code class=\"hex\"><i style=\"background:#212121\"><\/i>#212121<\/code>), lưới gia cường tại góc"], [5500, 7500, "Đo DFT bằng thước răng lược: <code>1,7 mm<\/code>"], [7500, 10500, "Đổ nước ngâm 50 mm; đồng hồ đếm <code>00:00 → 48:00<\/code>; thước đo mức nước không đổi (chỉ −1 mm do bay hơi bằng khay chuẩn)"], [10500, 12000, "Trần tầng dưới khô hoàn toàn; tem <code>FLOOD TEST PASSED<\/code> dán lên cửa WC"]], "bim": "<ul><li>Bản đồ dốc sàn: dốc đúng về phễu <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code> với mũi tên dòng chảy, vùng đọng nước <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><li>Nước: transmission 95%, IOR 1,33, caustics bật.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Thử ngâm nước có TVGS chứng kiến lúc bắt đầu và kết thúc; chụp ảnh có dấu thời gian.<\/li><li><strong>Điểm mù 1:<\/strong> Ngưỡng cửa WC — nước thấm qua lớp vữa lót sang sàn gỗ phòng ngủ. Màng phải lật lên/chạy dưới ngưỡng cửa ≥ 300 mm ra ngoài hoặc có gờ chặn.<\/li><li><strong>Điểm mù 2:<\/strong> Thợ lát gạch đục phá màng khi lắp phễu thu / vít thiết bị — bảo vệ màng bằng lớp vữa bảo vệ trước khi lát.<\/li><li><strong>Điểm mù 3:<\/strong> Phễu thu sàn không có cổ thu nước ở cả hai cao độ (màng và mặt gạch) → nước ngầm dưới gạch không thoát.<\/li><\/ul>", "quote": "Chống thấm là công việc của sự tỉ mỉ, nơi một mi-li-mét sơ suất ở cổ ống sẽ trở thành một vết ố loang lổ trên trần nhà của người khác. Bốn mươi tám giờ ngâm nước là lời cam kết đanh thép: chúng ta không tin vào lời hứa của vật liệu, chúng ta tin vào kết quả thử nghiệm. Và chúng ta thử hai lần — vì người thợ lát gạch đến sau người thợ chống thấm.", "sw": ["#424242", "#00C853", "#D50000"], "scene": "layers", "opts": {"mode": "wet"}}, {"n": 32, "title": "Hoàn thiện sảnh (Lobby), hành lang và chiếu sáng kiến trúc", "code": "EPC-SPEC-32-LBY", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 7114-1:2008 (ISO 8995-1)<\/td><td>Chiếu sáng nơi làm việc trong nhà<\/td><\/tr><tr><td>EN 1838 / TCVN 13456:2022<\/td><td>Chiếu sáng sự cố (khẩn cấp)<\/td><\/tr><tr><td>ANSI A108.02 / A137.1 / A326.3<\/td><td>Dung sai lát, độ lệch mép (lippage), hệ số ma sát DCOF<\/td><\/tr><tr><td>ASTM C503 / C615<\/td><td>Đá marble / granite<\/td><\/tr><tr><td>ASTM C1396<\/td><td>Tấm thạch cao<\/td><\/tr><tr><td>QCVN 06:2022/BXD<\/td><td>Cửa chống cháy, vật liệu hoàn thiện (nhóm nguy hiểm cháy)<\/td><\/tr><tr><td>TCVN 9377-1:2012<\/td><td>Công tác lát và láng<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Độ rọi sảnh chính<\/td><td>200–300 lux (khu quầy lễ tân 300–500 lux)<\/td><td>±10%<\/td><td>W (đo lưới 1 m)<\/td><\/tr><tr><td>Độ rọi hành lang / sảnh thang<\/td><td>100 / 150–200 lux<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ đồng đều Uo<\/td><td>≥ 0,4 (hành lang ≥ 0,4; khu làm việc ≥ 0,6)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Chất lượng ánh sáng<\/td><td>CRI Ra ≥ 90 (sảnh), ≥ 80 (hành lang); CCT 3 000–4 000 K; UGR ≤ 19–22<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Chiếu sáng sự cố lối thoát nạn<\/td><td>≥ 1 lux tại sàn trên đường tâm lối thoát; thời gian ≥ 1 h (theo QCVN 06 / EN 1838)<\/td><td>Thử cắt nguồn<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Đá lát<\/td><td>Dày 20–30 mm; hấp thụ nước marble ≤ 0,20%, granite ≤ 0,40%<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Độ lệch mép đá (lippage)<\/td><td>≤ 0,8 mm (mạch &lt; 6 mm); Spec sảnh ≤ 0,5 mm<\/td><td>Thước lá<\/td><td>W<\/td><\/tr><tr><td>Độ phẳng mặt lát<\/td><td>≤ 2 mm/2 m (Spec cao cấp)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>DCOF ướt<\/td><td>≥ 0,42 khu vực đi bộ trong nhà (ANSI A326.3); bậc thềm/lối vào ≥ 0,50<\/td><td>Thử BOT-3000E<\/td><td>W<\/td><\/tr><tr><td>Xử lý đá<\/td><td>Phủ chống thấm lưng (back-coat epoxy) + 6 mặt chống thấm thẩm thấu → chống ố vàng, vệt muối<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Trần thạch cao<\/td><td>Tấm chống ẩm cho khu ẩm; mặt phẳng ±3 mm/2 m; khe co giãn mỗi ≤ 12–15 m<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Cửa chống cháy<\/td><td>EI 60 / EI 45 theo QCVN 06, có tay co thủy lực tự đóng, thử đóng hoàn toàn ≤ 10 s<\/td><td><\/td><td>H<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Đá tự nhiên 20–30 mm xử lý chống thấm 6 mặt, lippage ≤ 0,5 mm, DCOF ướt ≥ 0,42 — sang trọng nhưng an toàn trượt.", "Chiếu sáng kiến trúc CRI ≥ 90, 3 000–4 000 K, UGR ≤ 19; chiếu sáng sự cố ≥ 1 lux trên lối thoát trong ≥ 1 h.", "Cửa chống cháy EI 60 tự đóng, biển chỉ dẫn thoát nạn, kiểm soát ra vào tích hợp BMS."], "vis": "<ul><li><strong>Cinematic Architectural Walkthrough:<\/strong> gimbal steadicam cao 1,5 m tiến chậm 0,8 m/s, ống kính 24 mm tilt-shift giữ đường thẳng đứng; ánh sáng: đèn hắt khe trần 3 000 K + ánh nắng xiên qua kính 5 500 K.<\/li><li>Sàn marble <code class=\"hex\"><i style=\"background:#EDE9E3\"><\/i>#EDE9E3<\/code> bóng gương phản chiếu đèn chùm; vân đá <code class=\"hex\"><i style=\"background:#9C9488\"><\/i>#9C9488<\/code> khớp liên tục (book-matched).<\/li><\/ul>", "tl": [[0, 2500, "Khung xương trần thép mạ kẽm <code class=\"hex\"><i style=\"background:#B0BEC5\"><\/i>#B0BEC5<\/code> lắp ghép, ty treo, hệ thống MEP trên trần lộ ra (X-ray)"], [2500, 5000, "Tấm trần đóng kín, đèn LED âm trần bật lần lượt theo hiệu ứng \"domino\" ánh sáng"], [5000, 8000, "Đá lát được đặt vào bằng giác hút, cân chỉnh nêm, vân đá liên tục khớp; thước lá kiểm <code>0,3 mm<\/code>"], [8000, 10500, "Bản đồ độ rọi phủ lên sàn (false color), Uo = 0,62"], [10500, 12000, "Camera bay lên toàn cảnh sảnh 3 tầng thông tầng hoàn thiện lộng lẫy"]], "bim": "<ul><li>Bản đồ độ rọi (DIALux/Relux): 0 lux <code class=\"hex\"><i style=\"background:#30123B\"><\/i>#30123B<\/code> → 150 lux <code class=\"hex\"><i style=\"background:#39A2FC\"><\/i>#39A2FC<\/code> → 300 lux <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code> → 500 lux <code class=\"hex\"><i style=\"background:#F3C63A\"><\/i>#F3C63A<\/code> → ≥ 750 lux <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code>.<\/li><li>Đường thoát nạn trên BIM: <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code> mũi tên, khoảng cách thoát nạn tối đa hiển thị bằng vòng <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Mẫu hoàn thiện (mock-up room) được Chủ đầu tư phê duyệt trước khi thi công đại trà.<\/li><li><strong>Điểm mù 1:<\/strong> Đá bị ố vàng/vệt nước do lát vữa ướt không xử lý lưng — bắt buộc back-coat và vữa/keo chuyên dụng.<\/li><li><strong>Điểm mù 2:<\/strong> Vật liệu hoàn thiện sảnh, hành lang thoát nạn không đạt nhóm nguy hiểm cháy cho phép theo QCVN 06 (ví dụ ốp gỗ, vải) — phải có chứng nhận thử nghiệm.<\/li><li><strong>Điểm mù 3:<\/strong> Cửa ra vào tự động và kiểm soát ra vào không mở khóa khi có báo cháy — kiểm tra trong thử nghiệm liên động (Slide 34).<\/li><\/ul>", "quote": "Sảnh chính là bộ mặt danh dự của tòa nhà — nơi một vị khách quyết định trong năm giây rằng đây là đẳng cấp năm sao hay không. Nhưng đằng sau vẻ lộng lẫy của đá cẩm thạch và ánh sáng là những con số không khoan nhượng: không một mép đá nào lệch quá nửa mi-li-mét, không một bề mặt nào trơn trượt khi ướt, và không một lối thoát nào tối hơn một lux khi mất điện. Sang trọng thực sự là khi vẻ đẹp và sự an toàn không bao giờ phải đánh đổi nhau.", "sw": ["#EDE9E3", "#9C9488", "#30123B", "#39A2FC", "#61FC6C", "#F3C63A", "#D23105", "#00C853", "#FFAB00"], "scene": "heat", "opts": {"mode": "lux"}}, {"n": 33, "title": "Hệ thống quản lý tòa nhà thông minh BMS & cảm biến IoT", "code": "EPC-SPEC-33-BMS", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ANSI/ASHRAE 135 (ISO 16484-5)<\/td><td>Giao thức BACnet<\/td><\/tr><tr><td>Modbus / KNX (ISO/IEC 14543-3) / LonWorks (ISO/IEC 14908)<\/td><td>Giao thức tích hợp<\/td><\/tr><tr><td>ISO 52120-1:2021 (thay EN 15232)<\/td><td>Phân loại hiệu quả hệ tự động hóa tòa nhà — Cấp A<\/td><\/tr><tr><td>IEC 62443<\/td><td>An ninh mạng hệ thống điều khiển công nghiệp<\/td><\/tr><tr><td>ASHRAE 62.1 / TCVN 5687<\/td><td>Chất lượng không khí trong nhà, thông số vi khí hậu<\/td><\/tr><tr><td>ISO 19650-3 / Brick Schema / Project Haystack<\/td><td>Mô hình dữ liệu digital twin<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Quy mô điểm điều khiển<\/td><td>25 000–40 000 điểm (vật lý + phần mềm)<\/td><td>100% điểm được kiểm tra point-to-point<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Độ trễ cảnh báo<\/td><td>≤ 2 s từ thiết bị đến màn hình vận hành<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Chu kỳ cập nhật dữ liệu<\/td><td>COV (change-of-value) hoặc ≤ 5 s cho điểm quan trọng; lưu trữ xu hướng 15 phút ≥ 3 năm<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Độ sẵn sàng hệ thống<\/td><td>≥ 99,9%; máy chủ dự phòng nóng (hot standby), UPS ≥ 30 phút<\/td><td><\/td><td>W<\/td><\/tr><tr><td>CO₂ trong nhà<\/td><td>≤ 1 000 ppm (mục tiêu ≤ 800 ppm) — điều khiển thông gió theo nhu cầu (DCV)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Nhiệt độ / độ ẩm<\/td><td>24–26 °C / 50–65% RH (vùng nhiệt đới, theo TCVN 5687)<\/td><td>±0,5 °C / ±5% RH<\/td><td>W<\/td><\/tr><tr><td>Độ chính xác cảm biến<\/td><td>Nhiệt độ ±0,3 °C; RH ±3%; CO₂ ±(30 ppm + 3%); lưu lượng ±2%<\/td><td>Hiệu chuẩn trước bàn giao<\/td><td>W<\/td><\/tr><tr><td>Công tơ điện phụ (sub-metering)<\/td><td>Theo từng hệ thống (HVAC, chiếu sáng, ổ cắm, thang máy) và từng khách thuê; cấp chính xác 0,5S/1<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Nhận diện khuôn mặt<\/td><td>FAR ≤ 0,001%, FRR ≤ 1%; tuân thủ quy định bảo vệ dữ liệu cá nhân (NĐ 13/2023/NĐ-CP / Luật hiện hành)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>An ninh mạng<\/td><td>Phân vùng mạng OT/IT, IEC 62443 SL2; không dùng mật khẩu mặc định; kiểm thử xâm nhập (pentest) trước bàn giao<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Cấp hiệu quả BACS<\/td><td>Cấp A theo ISO 52120-1<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Trung tâm BMS tích hợp HVAC, điện, cấp thoát nước, thang máy, PCCC (giám sát), an ninh qua BACnet/IP; 30 000+ điểm, cảnh báo ≤ 2 s.", "IoT đo CO₂, nhiệt độ, độ ẩm, độ rọi, hiện diện người — điều khiển theo nhu cầu, BACS cấp A (ISO 52120-1).", "Kiểm soát ra vào bằng khuôn mặt + thẻ phân tầng thang máy; an ninh mạng IEC 62443 và bảo vệ dữ liệu cá nhân."], "vis": "<ul><li><strong>Command Center Sci-Fi Shot:<\/strong> phòng điều khiển tối <code class=\"hex\"><i style=\"background:#05080D\"><\/i>#05080D<\/code>, video wall 8 × 3 màn hình, ống kính 35 mm, push-in chậm 0,2 m/s.<\/li><li>Digital twin tòa tháp xoay chậm giữa màn hình, các tầng phát sáng theo nhiệt độ/điện năng; luồng dữ liệu IoT như hạt sáng <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> bay từ cảm biến về lõi.<\/li><\/ul>", "tl": [[0, 2500, "Cảm biến IoT trong một văn phòng bật sáng (chấm <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>), gói dữ liệu bay về tủ DDC tầng, rồi về máy chủ"], [2500, 5000, "Digital twin hiện các lớp: HVAC <code class=\"hex\"><i style=\"background:#0057B8\"><\/i>#0057B8<\/code>, chiếu sáng <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>, điện <code class=\"hex\"><i style=\"background:#FBC02D\"><\/i>#FBC02D<\/code>, an ninh <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>"], [5000, 8000, "Tầng 38: số người giảm từ 120 → 15 lúc 18:30; BMS giảm lưu lượng gió (VAV) và tắt 70% đèn; biểu đồ công suất giảm 42%"], [8000, 10000, "CO₂ phòng họp tăng lên 950 ppm → DCV tăng gió tươi, CO₂ về 720 ppm"], [10000, 12000, "Bảng KPI: EUI <code>118 kWh/m²·năm<\/code>, tiện nghi nhiệt 96% giờ đạt"]], "bim": "<ul><li>Digital twin: nhiệt độ vùng 22 °C <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code> → 25 °C <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code> → 28 °C <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code>; CO₂ &lt; 800 <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, 800–1 000 <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, &gt; 1 000 <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><li>Gói dữ liệu: hạt Ø 4 px, đuôi sáng 200 ms, tốc độ tượng trưng.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Kiểm tra point-to-point 100% và kiểm thử chức năng chuỗi điều khiển (sequence of operations) trước Commissioning tổng thể.<\/li><li><strong>Điểm mù 1:<\/strong> Đặt tên điểm, gắn nhãn không theo chuẩn (Haystack/Brick) → không phân tích được dữ liệu, digital twin \"rỗng\".<\/li><li><strong>Điểm mù 2:<\/strong> BMS và PCCC tích hợp hai chiều điều khiển trái quy chuẩn — hệ báo cháy phải là hệ độc lập, BMS chỉ giám sát (trừ khi được thẩm duyệt).<\/li><li><strong>Điểm mù 3:<\/strong> Mạng OT để mở ra internet cho nhà cung cấp truy cập từ xa → lỗ hổng an ninh; dùng VPN có kiểm soát và nhật ký.<\/li><\/ul>", "quote": "Hệ thống BMS biến tòa nhà từ một khối bê tông thụ động thành một thực thể có giác quan: ba mươi nghìn điểm cảm nhận nhiệt độ, hơi thở, ánh sáng và sự hiện diện của con người. Khi văn phòng vắng người, tòa nhà tự biết hạ nhịp; khi phòng họp đông đúc, nó tự biết hít thêm không khí tươi. Nhưng một bộ não thông minh cũng cần một hệ miễn dịch — và an ninh mạng ở đây quan trọng không kém những bức tường bê tông.", "sw": ["#05080D", "#00E5FF", "#4675ED", "#61FC6C", "#D23105", "#00C853", "#FFAB00", "#D50000"], "scene": "network", "opts": {"mode": "bms"}}, {"n": 34, "title": "Vận hành thử liên động toàn hệ thống (Commissioning & Integrated Systems Testing)", "code": "EPC-SPEC-34-IST", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ASHRAE Guideline 0-2019 / ASHRAE Standard 202-2018<\/td><td>Quy trình commissioning<\/td><\/tr><tr><td>CIBSE Commissioning Code M / BSRIA BG 49<\/td><td>Quản lý commissioning<\/td><\/tr><tr><td>NEBB / AABC / SMACNA HVAC TAB<\/td><td>Cân chỉnh lưu lượng (TAB)<\/td><\/tr><tr><td>NFPA 4 (2024)<\/td><td>Thử nghiệm hệ thống phòng cháy tích hợp<\/td><\/tr><tr><td>NFPA 110<\/td><td>Thử nghiệm nguồn khẩn cấp<\/td><\/tr><tr><td>QCVN 06:2022/BXD<\/td><td>Kịch bản điều khiển PCCC<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Cấp độ commissioning<\/td><td>L1 Nghiệm thu xuất xưởng (FAT) → L2 Lắp đặt → L3 Khởi động → L4 Chức năng → <strong>L5 Liên động (IST)<\/strong><\/td><td>Mỗi cấp hoàn thành mới qua cấp sau<\/td><td>H<\/td><\/tr><tr><td>TAB lưu lượng gió<\/td><td>±10% thiết kế tại miệng gió; ±5% tại AHU<\/td><td>100% miệng gió<\/td><td>W<\/td><\/tr><tr><td>TAB lưu lượng nước<\/td><td>±10% thiết kế tại thiết bị cuối; ±5% tại bơm/chiller<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Ma trận nhân – quả PCCC<\/td><td>100% ô ma trận được kiểm tra (Cause &amp; Effect Matrix)<\/td><td>0 lỗi<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Thử \"Black Building\"<\/td><td>Cắt điện lưới toàn bộ: máy phát mang tải ≤ 10 s; tải ưu tiên khôi phục theo bậc; UPS duy trì hệ thống quan trọng không gián đoạn<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Thời gian đáp ứng khi báo cháy<\/td><td>Quạt tăng áp/hút khói chạy ≤ 60 s; thang máy về tầng thoát nạn và mở cửa; cửa từ nhả ≤ 10 s; damper đóng/mở đúng trạng thái<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Phục hồi điện lưới<\/td><td>Chuyển ngược ATS sau ổn định ≥ 5 phút (cài đặt), không gián đoạn cho tải UPS<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Thử theo mùa (seasonal)<\/td><td>Bổ sung trong 12 tháng đầu vận hành ở điều kiện cao điểm<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Hồ sơ<\/td><td>Báo cáo Cx cuối cùng, nhật ký vấn đề (Issues log) đóng 100% hạng mục nghiêm trọng<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Commissioning 5 cấp L1–L5; TAB lưu lượng gió/nước ±10%; kiểm tra 100% ma trận nhân – quả PCCC với sự chứng kiến của cơ quan có thẩm quyền.", "Kịch bản \"Black Building\": cắt điện lưới — máy phát mang tải ≤ 10 s, khôi phục tải theo bậc, UPS không gián đoạn.", "Kịch bản cháy giả lập: tăng áp, hút khói, thang máy về tầng, cửa từ nhả, damper — tất cả đồng bộ trong ≤ 60 s."], "vis": "<ul><li><strong>Dynamic Multi-screen Split View:<\/strong> màn hình chia 4 ô (2 × 2), mỗi ô một ống kính và tông màu riêng: (1) còi đèn báo cháy đỏ, (2) quạt tăng áp tăng tốc với blur cánh quạt, (3) thang máy đóng cửa và lao xuống, (4) cửa chống cháy sập lại.<\/li><li>Đồng hồ trung tâm đếm ngược kiểu JetBrains Mono <code>T+00.000 s<\/code>, độ chính xác mili-giây.<\/li><\/ul>", "tl": [[0, 1500, "Kỹ sư trưởng nhấn nút kích hoạt kịch bản trên bảng điều khiển; bộ đếm bắt đầu"], [1500, 3500, "Ô 1: đầu báo khói tầng hầm B2 kích hoạt, chuông/đèn toàn tòa; ma trận C&amp;E sáng hàng tương ứng"], [3500, 6500, "Ô 2: quạt tăng áp đạt tốc độ ở T+22 s (hiển thị tua); ô 4: cửa từ nhả T+3 s, cửa chống cháy đóng"], [6500, 9000, "Ô 3: thang máy hủy lệnh, về tầng 1, mở cửa, dừng phục vụ (thang chữa cháy chuyển chế độ lính cứu hỏa)"], [9000, 10500, "Kịch bản 2 chồng lên: cắt điện lưới — màn hình chớp đen, máy phát mang tải T+8,4 s"], [10500, 12000, "4 ô hợp nhất thành bảng tổng: 1 284/1 284 bước kiểm tra đạt, đèn trạng thái chuyển xanh lần lượt"]], "bim": "<ul><li>Ma trận C&amp;E: chưa thử <code class=\"hex\"><i style=\"background:#B0BEC5\"><\/i>#B0BEC5<\/code>, đạt <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, sai thời gian <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, sai chức năng <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><li>Thanh thời gian đáp ứng: mục tiêu <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> nét đứt, thực tế <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> IST chỉ được tiến hành khi toàn bộ L1–L4 đã đóng; báo cáo IST là hồ sơ bắt buộc cho nghiệm thu PCCC.<\/li><li><strong>Điểm mù 1:<\/strong> Thử từng hệ riêng lẻ đạt nhưng tương tác sai (ví dụ: quạt hút khói chạy khi đang nguồn máy phát nhưng tải máy phát không đủ khởi động đồng thời) — phải thử kết hợp mất điện + cháy.<\/li><li><strong>Điểm mù 2:<\/strong> Cài đặt BMS bị \"ghi đè tay\" (manual override) trong thi công không trả về tự động.<\/li><li><strong>Điểm mù 3:<\/strong> Không thử lại sau khi khách thuê cải tạo nội thất (fit-out) — quy định thử lại một phần trong quy trình vận hành.<\/li><\/ul>", "quote": "Vận hành thử liên động là bài sát hạch cuối cùng — nơi mọi hệ thống phải chứng minh rằng chúng có thể chơi chung một bản nhạc. Chúng ta cố tình gây ra tình huống tồi tệ nhất: cháy ở tầng hầm cùng lúc mất điện lưới, và bấm giờ đến từng mili-giây xem tòa nhà phản ứng thế nào. Một nghìn hai trăm tám mươi tư bước kiểm tra đều xanh — chỉ khi đó, chúng ta mới có quyền nói rằng tòa nhà đã sẵn sàng đón người.", "sw": ["#B0BEC5", "#00C853", "#FFAB00", "#D50000", "#FFC400", "#00B8D4"], "scene": "status", "opts": {"mode": "ist"}}, {"n": 35, "title": "Kiểm định khả năng chịu lực công trình: thử tải tĩnh, quan trắc và đối chiếu FEA", "code": "EPC-SPEC-35-SHM", "dur": "15 000 ms", "part": "V", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 9344:2012<\/td><td>Kết cấu BTCT — Đánh giá độ bền cấu kiện chịu uốn bằng thí nghiệm chất tải tĩnh<\/td><\/tr><tr><td>ACI 437.2-13 / ACI 318-19 Chương 27<\/td><td>Thử tải hiện trường kết cấu bê tông<\/td><\/tr><tr><td>TCVN 9360:2012 / TCVN 9400:2012<\/td><td>Quan trắc lún / nghiêng<\/td><\/tr><tr><td>ISO 4866 / ISO 18649<\/td><td>Đo dao động công trình<\/td><\/tr><tr><td>ISO 13822<\/td><td>Đánh giá kết cấu hiện hữu<\/td><\/tr><tr><td>Thông tư 10/2021/TT-BXD và văn bản hiện hành<\/td><td>Kiểm tra công tác nghiệm thu, quan trắc công trình<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng chấp nhận<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Tải thử (ACI 437.2 / ACI 318 Ch.27)<\/td><td>Lớn nhất của: 1,3(D+L); 1,0D + 1,1L + 1,6(Lr hoặc S hoặc R); 1,3D (đã tính tải bản thân hiện hữu)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Chất tải<\/td><td>≥ 4 cấp tăng dần, giữ ≥ 24 h ở cấp tối đa (ACI 318 Ch.27)<\/td><td>Không nứt bất thường, không vỡ<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Độ võng tối đa<\/td><td>Δ₁ ≤ ℓt² / (20 000 h) <strong>hoặc<\/strong> đạt tiêu chí phục hồi<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Phục hồi sau dỡ tải 24 h<\/td><td>Δr ≤ Δ₁/4 (phục hồi ≥ 75%)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Độ võng thực tế vs lý thuyết<\/td><td>Spec dự án: Δ_đo ≤ 1,0 × Δ_tính toán theo FEA với độ cứng nứt; tỷ lệ &gt; 1,2 → điều tra<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Cảm biến biến dạng<\/td><td>Dây rung (VW) độ phân giải 1 µε, gắn trên cốt thép trước khi đổ<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Lún móng tổng<\/td><td>Lún trung bình theo giới hạn thiết kế (dự án: dự báo 45 mm, giới hạn 80 mm); lún lệch ≤ 1/500 (ngưỡng thiết kế cho khung BTCT — đối chiếu TCVN 9362)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Độ nghiêng tổng thể tháp<\/td><td>≤ 1/1 000 do lún lệch (Spec dự án)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Tần số dao động riêng đo vs FEA<\/td><td>Sai lệch ≤ ±15% (f₁ đo bằng dao động môi trường — ambient vibration, phương pháp FDD/SSI)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Hệ quan trắc dài hạn (SHM)<\/td><td>≥ 120 cảm biến: biến dạng, nghiêng, gia tốc kế đỉnh tháp, trạm khí tượng, GNSS đỉnh tháp<\/td><td>Cảnh báo theo 3 cấp<\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Thử tải tĩnh sàn điển hình theo TCVN 9344 / ACI 437.2: ≥ 4 cấp tải, giữ 24 h, độ võng ≤ ℓt²/(20 000h) hoặc phục hồi ≥ 75%.", "Hiệu chỉnh mô hình FEA bằng số liệu thực: biến dạng VW, lún, nghiêng, tần số dao động riêng (sai lệch ≤ ±15%).", "Hệ quan trắc sức khỏe kết cấu (SHM) 120+ cảm biến chuyển giao cho vận hành; chứng nhận an toàn chịu lực bởi đơn vị kiểm định độc lập."], "vis": "<ul><li><strong>Wide Structural Stress Heatmap View:<\/strong> tòa tháp xoay chậm 4°/s trên nền <code class=\"hex\"><i style=\"background:#05080D\"><\/i>#05080D<\/code>, vỏ ngoài tan biến để lộ khung kết cấu với heatmap Turbo; ống kính 50 mm.<\/li><li>Cận cảnh: các bồn nước/bao cát chất tải trên ô sàn, dây cảm biến <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> chạy về bộ ghi dữ liệu, đồng hồ đo võng điện tử.<\/li><\/ul>", "tl": [[0, 2500, "Bồn nước xếp lên ô sàn thử theo 4 cấp tải (25 – 50 – 75 – 100%), mỗi cấp nước dâng trong bồn"], [2500, 5000, "Cảm biến VW truyền dữ liệu; sàn võng (phóng đại ×500) theo heatmap; đồ thị tải – độ võng tuyến tính"], [5000, 7000, "Giữ tải 24 h (tua) → dỡ tải; độ võng phục hồi 86% <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>"], [7000, 9500, "Toàn tháp: mô hình FEA chạy, đường dạng dao động 1 (uốn) với f₁ FEA 0,182 Hz và f₁ đo 0,191 Hz (+4,9%)"], [9500, 12000, "Heatmap toàn tháp ổn định trong vùng xanh lam – xanh lá (η ≤ 0,7), không điểm đỏ; con dấu <code>STRUCTURAL SAFETY CERTIFIED<\/code>"]], "bim": "<ul><li>Heatmap D/C toàn tháp: thang Turbo, η ≤ 0,6 xanh, 0,6–0,9 vàng – cam, ≥ 1,0 đỏ nhấp nháy (không được xuất hiện ở bản cuối).<\/li><li>Đồ thị tải – võng: đo <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>, FEA <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code> nét đứt, giới hạn <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Chứng nhận an toàn chịu lực / kết luận kiểm tra của cơ quan chuyên môn về xây dựng trước khi nghiệm thu hoàn thành.<\/li><li><strong>Điểm mù 1:<\/strong> Thử tải gây hại cho cấu kiện tốt (quá tải) — tải thử phải do kỹ sư kết cấu tính toán và giám sát, có hệ chống an toàn bên dưới.<\/li><li><strong>Điểm mù 2:<\/strong> Chỉ thử tải sàn mà bỏ qua kiểm chứng tổng thể (lún, nghiêng, tần số) — tổng thể mới phản ánh làm việc của hệ.<\/li><li><strong>Điểm mù 3:<\/strong> Hệ SHM bị bỏ quên sau bàn giao — phải đưa vào hợp đồng vận hành, có ngưỡng cảnh báo và người chịu trách nhiệm.<\/li><\/ul>", "quote": "Chúng ta đã tính toán bằng hàng triệu phần tử hữu hạn — nhưng một mô hình chỉ có giá trị khi thực tế xác nhận nó. Hôm nay, tòa tháp tự lên tiếng: sàn võng đúng như dự báo và phục hồi tám mươi sáu phần trăm, tần số dao động lệch chưa đến năm phần trăm so với mô hình. Những con số này nằm trọn trong giới hạn an toàn — và đó là lời khẳng định hùng hồn nhất cho chất lượng kết cấu.", "sw": ["#05080D", "#FFC400", "#00B8D4", "#7E57C2", "#D50000"], "scene": "tower", "opts": {"mode": "fea"}}, {"n": 36, "title": "Nghiệm thu phòng cháy chữa cháy và diễn tập cứu nạn cứu hộ", "code": "EPC-SPEC-36-FAC", "dur": "15 000 ms", "part": "V", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>Luật Phòng cháy, chữa cháy và Cứu nạn, cứu hộ số 55/2024/QH15 (hiệu lực 01/7/2025)<\/td><td>Khung pháp lý PCCC &amp; CNCH<\/td><\/tr><tr><td>Nghị định 105/2025/NĐ-CP (thay thế NĐ 136/2020/NĐ-CP) và văn bản hướng dẫn hiện hành<\/td><td>Thẩm duyệt, nghiệm thu PCCC<\/td><\/tr><tr><td>QCVN 06:2022/BXD + Sửa đổi 1:2023<\/td><td>An toàn cháy — đường cho xe chữa cháy, bãi đỗ xe thang<\/td><\/tr><tr><td>NFPA 14<\/td><td>Áp lực họng nước chữa cháy vách tường (đối chiếu)<\/td><\/tr><tr><td>NFPA 4<\/td><td>Thử nghiệm tích hợp<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">Ghi chú: Tổng thầu/TVGS phải rà soát lại số hiệu và hiệu lực Nghị định hướng dẫn tại thời điểm nghiệm thu.<\/p>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Hồ sơ nghiệm thu PCCC<\/td><td>Đủ 100% thành phần theo quy định (thẩm duyệt thiết kế, biên bản thử nghiệm, IST, chứng nhận kiểm định phương tiện PCCC)<\/td><td><\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Đường cho xe chữa cháy<\/td><td>Rộng ≥ 3,5 m thông thủy, cao ≥ 4,25 m, chịu tải xe chữa cháy; bãi đỗ xe thang theo QCVN 06 (khoảng cách mép bãi đến mặt nhà theo quy định)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Tầm với xe thang<\/td><td>Xe thang thông dụng ~ 32–55 m (một số đô thị có 70–100 m) — <strong>phần nhà cao hơn tầm xe thang phải dựa hoàn toàn vào hệ thống bên trong<\/strong> (thang chữa cháy, họng nước, sprinkler, tầng lánh nạn)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Áp lực họng nước vách tường<\/td><td>Lăng phun tạo cột nước đặc ≥ 6 m (Spec: thử tại họng bất lợi nhất); NFPA 14 đối chiếu: 6,9 bar tại họng 65 mm xa nhất<\/td><td>Thử thực tế<\/td><td>H<\/td><\/tr><tr><td>Họng tiếp nước xe chữa cháy (Siamese)<\/td><td>Đủ số lượng, có biển chỉ dẫn, thử bơm tiếp nước từ xe chữa cháy<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Tầng lánh nạn / gian lánh nạn<\/td><td>Theo QCVN 06 cho nhà &gt; 100 m (khoảng cách theo quy định)<\/td><td>Kiểm tra tăng áp, chiếu sáng, liên lạc<\/td><td>H<\/td><\/tr><tr><td>Thời gian thoát nạn diễn tập<\/td><td>Đối chiếu kết quả mô phỏng thoát nạn (Pathfinder/STEPS): RSET &lt; ASET với hệ số an toàn ≥ 1,5<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Hệ thông tin liên lạc<\/td><td>Âm thanh thông báo bằng giọng nói (EVAC) độ rõ STI ≥ 0,5<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Phối hợp Cảnh sát PCCC &amp; CNCH diễn tập thực chiến toàn tòa: báo cháy, thoát nạn, cứu nạn, tiếp nước từ xe chữa cháy.", "Thử họng nước vách tường bất lợi nhất, họng tiếp nước Siamese, tầng lánh nạn; xác nhận phần nhà vượt tầm xe thang được bảo vệ bằng hệ thống bên trong.", "Nghiệm thu PCCC theo Luật PCCC &amp; CNCH 2024 và nghị định hướng dẫn — điều kiện tiên quyết để đưa công trình vào sử dụng."], "vis": "<ul><li><strong>Epic Cinematic Rescue Drone Shot:<\/strong> chiều tà 17h30, drone quỹ đạo thấp quanh đội hình 6 xe chữa cháy đỏ <code class=\"hex\"><i style=\"background:#C62828\"><\/i>#C62828<\/code> đèn ưu tiên xanh đỏ nhấp nháy; xe thang vươn 54 m, vòi rồng phun cột nước trắng xóa với cầu vồng trong ánh nắng.<\/li><li>Cắt sang nội thất: lính cứu hỏa trong khoang đệm thang chữa cháy tầng 50 nối vòi vào họng nước vách tường.<\/li><\/ul>", "tl": [[0, 2000, "Còi báo động toàn tháp; bản đồ thoát nạn hiển thị dòng người <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code> di chuyển xuống thang bộ"], [2000, 4500, "Xe chữa cháy vào vị trí bãi đỗ; xe thang vươn lên — vạch giới hạn tầm với <code>54 m<\/code> hiện ngang tòa nhà <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>"], [4500, 7500, "Phía trên vạch giới hạn: hệ thống bên trong sáng lên (thang chữa cháy <code class=\"hex\"><i style=\"background:#D32F2F\"><\/i>#D32F2F<\/code>, họng nước, sprinkler, tầng lánh nạn <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>)"], [7500, 10000, "Xe chữa cháy bơm tiếp nước vào họng Siamese; áp lực truyền lên tầng 50; lăng phun tạo cột nước đặc 8 m"], [10000, 12000, "Cán bộ PCCC ký văn bản chấp thuận kết quả nghiệm thu dưới ánh đèn flash"]], "bim": "<ul><li>Mô phỏng thoát nạn: mật độ người &lt; 1 người/m² <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, 1–2 <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, &gt; 2 <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>; RSET/ASET dạng thanh so sánh.<\/li><li>Vạch tầm với xe thang: mặt phẳng ngang <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code> 25% xuyên tòa nhà.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Văn bản chấp thuận kết quả nghiệm thu PCCC của cơ quan có thẩm quyền.<\/li><li><strong>Điểm mù 1:<\/strong> Thay đổi thiết kế (layout, vật liệu) sau khi thẩm duyệt PCCC mà không thẩm duyệt điều chỉnh → không được nghiệm thu.<\/li><li><strong>Điểm mù 2:<\/strong> Bãi đỗ xe thang bị cây xanh, mái che, biển quảng cáo, đường dây điện lấn chiếm.<\/li><li><strong>Điểm mù 3:<\/strong> Diễn tập chỉ một lần khi nghiệm thu — kế hoạch vận hành phải có diễn tập định kỳ hằng năm.<\/li><\/ul>", "quote": "Hãy nhìn vạch ngang trên tòa tháp kia — đó là giới hạn với tới của chiếc xe thang dài nhất thành phố. Phía trên nó, không một lính cứu hỏa nào có thể tiếp cận từ bên ngoài; sự sống của hàng nghìn người phụ thuộc hoàn toàn vào những gì chúng ta đã xây bên trong. Vượt qua kỳ nghiệm thu phòng cháy chữa cháy không chỉ là một thủ tục pháp lý — đó là lời cam kết rằng mọi hệ thống đã sẵn sàng cho ngày mà chúng ta mong sẽ không bao giờ đến.", "sw": ["#C62828", "#00C853", "#FFAB00", "#D50000"], "scene": "tower", "opts": {"mode": "ladder"}}, {"n": 37, "title": "Hồ sơ pháp lý hoàn công, môi trường và hồ sơ số hóa", "code": "EPC-SPEC-37-DOC", "dur": "15 000 ms", "part": "V", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>Luật Xây dựng 2014 (sửa đổi, bổ sung bởi Luật 62/2020/QH14) và văn bản thay thế hiện hành<\/td><td>Khung pháp lý xây dựng<\/td><\/tr><tr><td>Nghị định 06/2021/NĐ-CP<\/td><td>Quản lý chất lượng, thi công và bảo trì — hồ sơ hoàn thành công trình (Phụ lục VIB)<\/td><\/tr><tr><td>Nghị định 175/2024/NĐ-CP<\/td><td>Quản lý hoạt động xây dựng<\/td><\/tr><tr><td>Luật Bảo vệ môi trường 2020 + Nghị định 08/2022/NĐ-CP<\/td><td>ĐTM, giấy phép môi trường<\/td><\/tr><tr><td>ISO 19650-2/-3, COBie<\/td><td>Bàn giao thông tin số<\/td><\/tr><tr><td>Luật Lưu trữ / quy định lưu trữ hồ sơ công trình<\/td><td>Thời hạn lưu trữ<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">Ghi chú: Văn bản pháp luật thay đổi thường xuyên; danh mục phải được cập nhật tại thời điểm lập hồ sơ.<\/p>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Bản vẽ hoàn công<\/td><td>100% hạng mục, ký đủ thành phần; khớp mô hình BIM LOD 500<\/td><td>0 hạng mục thiếu<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Chứng chỉ vật liệu (CO/CQ), kết quả thí nghiệm<\/td><td>100% lô vật liệu chính, truy vết được đến cấu kiện (GUID BIM)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Biên bản nghiệm thu công việc / giai đoạn<\/td><td>100% theo kế hoạch ITP<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Nhật ký thi công<\/td><td>Đầy đủ, liên tục, có chữ ký hằng ngày<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Hồ sơ môi trường<\/td><td>Quyết định phê duyệt ĐTM; giấy phép môi trường trước khi vận hành; kết quả quan trắc môi trường giai đoạn thi công<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Đấu nối hạ tầng<\/td><td>Văn bản thỏa thuận/nghiệm thu đấu nối điện, cấp nước, thoát nước, giao thông, viễn thông<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Định dạng số<\/td><td>PDF/A cho văn bản, IFC 4.x + RVT cho mô hình, COBie (xlsx) cho tài sản; đặt tên theo ISO 19650<\/td><td>100% tệp có metadata<\/td><td>R<\/td><\/tr><tr><td>Chữ ký số<\/td><td>Hồ sơ điện tử ký số hợp lệ theo quy định giao dịch điện tử<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Tổng hợp và số hóa 100% hồ sơ hoàn công trên CDE: bản vẽ As-built khớp BIM LOD 500, CO/CQ truy vết đến từng cấu kiện.", "Hoàn tất hồ sơ môi trường (ĐTM, giấy phép môi trường), đấu nối hạ tầng, chứng nhận PCCC và kết luận kiểm tra nghiệm thu của cơ quan nhà nước.", "Bàn giao bộ hồ sơ pháp lý giấy + số (PDF/A, IFC, COBie) cho Chủ đầu tư và Ban quản lý vận hành."], "vis": "<ul><li><strong>Close-up Cinematic Document Stamp Shot:<\/strong> ống kính macro 100 mm, f/2.8, đèn bàn 2 700 K ấm áp; bộ hồ sơ bìa da <code class=\"hex\"><i style=\"background:#3E2723\"><\/i>#3E2723<\/code> chữ nhũ vàng <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>.<\/li><li>Con dấu đỏ son <code class=\"hex\"><i style=\"background:#B71C1C\"><\/i>#B71C1C<\/code> đóng xuống chậm (slow-motion 4×), mực thấm vào giấy; cắt sang màn hình CDE với cây thư mục ISO 19650.<\/li><\/ul>", "tl": [[0, 3000, "Ma trận dữ liệu: hàng nghìn tệp (icon PDF, IFC, XLSX) bay vào thư mục CDE theo mã ISO 19650, bộ đếm <code>48 312 files<\/code>"], [3000, 5500, "Mô hình BIM LOD 500: chọn một cột → hiện CO/CQ thép, kết quả nén mẫu, biên bản nghiệm thu, ảnh 360°"], [5500, 8000, "Con dấu đóng xuống văn bản pháp lý, tiếng vang trầm; chữ ký số hiện chứng thư hợp lệ"], [8000, 10500, "Hồ sơ giấy xếp vào hộp lưu trữ chống ẩm; ổ cứng mã hóa + bản sao đám mây"], [10500, 12000, "Danh mục kiểm tra 100% tích xanh"]], "bim": "<ul><li>Trạng thái hồ sơ CDE theo ISO 19650: WIP <code class=\"hex\"><i style=\"background:#90A4AE\"><\/i>#90A4AE<\/code>, Shared <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>, Published <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, Archived <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Hồ sơ hoàn thành công trình đủ thành phần trước khi tổ chức nghiệm thu hoàn thành.<\/li><li><strong>Điểm mù 1:<\/strong> Bản vẽ hoàn công lập \"cho đủ\" bằng cách đổi tên bản vẽ thiết kế — không phản ánh thay đổi thực tế. Đối chiếu bắt buộc với quét laser.<\/li><li><strong>Điểm mù 2:<\/strong> Hồ sơ số không có metadata → không tìm kiếm được sau 5 năm.<\/li><li><strong>Điểm mù 3:<\/strong> Giấy phép môi trường (vận hành) bị quên vì chỉ chú ý ĐTM giai đoạn đầu tư.<\/li><\/ul>", "quote": "Một tòa nhà không có hồ sơ hoàn công chuẩn mực giống như một con người không có giấy khai sinh — nó tồn tại nhưng không được pháp luật và thị trường thừa nhận. Bốn mươi tám nghìn tệp tài liệu này, mỗi tệp gắn với một cấu kiện cụ thể trên mô hình số, là ký ức trọn vẹn của dự án. Hai mươi năm sau, khi một kỹ sư cần biết cây cột tầng mười hai được đổ bằng mẻ bê tông nào, câu trả lời sẽ chỉ cách họ một cú nhấp chuột.", "sw": ["#3E2723", "#FFC400", "#B71C1C", "#90A4AE", "#00B8D4", "#00C853", "#7E57C2"], "scene": "network", "opts": {"mode": "docs"}}, {"n": 38, "title": "Nghiệm thu ba bên (Chủ đầu tư – Tư vấn giám sát – Tổng thầu EPC)", "code": "EPC-SPEC-38-ACC", "dur": "15 000 ms", "part": "V", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>Nghị định 06/2021/NĐ-CP (Điều 23, 24, 28)<\/td><td>Nghiệm thu hoàn thành; kiểm tra của cơ quan nhà nước; bảo hành<\/td><\/tr><tr><td>TCVN 5637:1991<\/td><td>Quản lý chất lượng xây lắp — nguyên tắc cơ bản<\/td><\/tr><tr><td>FIDIC Silver Book 2017 (EPC/Turnkey) Clause 9–11<\/td><td>Thử nghiệm hoàn thành, nhận bàn giao, trách nhiệm sửa chữa sai sót<\/td><\/tr><tr><td>ISO 9001:2015<\/td><td>Hệ thống quản lý chất lượng<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Phân loại tồn tại (Punch List)<\/td><td><strong>Loại A<\/strong>: ảnh hưởng an toàn/công năng; <strong>Loại B<\/strong>: ảnh hưởng thẩm mỹ/vận hành nhỏ; <strong>Loại C<\/strong>: chi tiết hoàn thiện<\/td><td>Tại thời điểm ký nghiệm thu: <strong>0 lỗi loại A<\/strong><\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Lỗi loại B, C<\/td><td>Được phép tồn tại kèm kế hoạch khắc phục<\/td><td>Đóng 100% trong ≤ 30 ngày (Spec dự án)<\/td><td>R<\/td><\/tr><tr><td>Phủ kiểm tra<\/td><td>100% không gian công cộng, kỹ thuật; 100% căn hộ/văn phòng (đi kiểm theo phòng)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Thời gian bảo hành<\/td><td>≥ 24 tháng với công trình cấp đặc biệt và cấp I (NĐ 06/2021)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Mức bảo đảm bảo hành<\/td><td>≥ 3% giá trị hợp đồng với công trình cấp đặc biệt và cấp I (NĐ 06/2021)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Kết luận kiểm tra của cơ quan nhà nước<\/td><td>Văn bản chấp thuận kết quả nghiệm thu (đối với công trình thuộc diện kiểm tra)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Thiết bị kiểm tra<\/td><td>Máy đo ẩm, camera nhiệt, thước laser, máy đo độ rọi, đo ồn, đo lực mở cửa<\/td><td>Hiệu chuẩn còn hạn<\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Đoàn kiểm tra liên danh ba bên rà soát 100% không gian với thiết bị đo; mỗi tồn tại được ghi nhận số hóa có ảnh và vị trí BIM.", "Punch List phân loại A/B/C: 0 lỗi loại A khi ký; lỗi B/C đóng trong ≤ 30 ngày.", "Ký biên bản nghiệm thu hoàn thành; khởi động thời gian bảo hành ≥ 24 tháng, bảo đảm bảo hành ≥ 3% giá trị hợp đồng."], "vis": "<ul><li><strong>Medium Professional Conference Shot:<\/strong> sảnh chính, bàn gỗ óc chó <code class=\"hex\"><i style=\"background:#4E342E\"><\/i>#4E342E<\/code>, đại diện ba bên mặc vest, ống kính 50 mm, f/2, ánh sáng mềm từ vách kính.<\/li><li>Cảnh hành trình kiểm tra: máy tính bảng hiển thị BIM, chạm vào tường → tạo \"ghim\" tồn tại kèm ảnh; camera nhiệt quét trần tìm vết ẩm.<\/li><\/ul>", "tl": [[0, 3000, "Đoàn kiểm tra đi qua các phòng (montage 6 cảnh × 500 ms); ghim tồn tại hiện trên mô hình: A <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>, B <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, C <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>"], [3000, 6000, "Tua 30 ngày: ghim lần lượt chuyển <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code> khi được khắc phục; bộ đếm <code>Punch items: 1 846 → 0<\/code> (loại A: 0 ngay từ đầu ngày ký)"], [6000, 8500, "Ba chữ ký điện tử trên máy tính bảng, chứng thư số xác thực"], [8500, 10500, "Biên bản chuyển trạng thái <code>APPROVED<\/code> xanh lá rực sáng"], [10500, 12000, "Bắt tay ba bên, máy ảnh chớp"]], "bim": "<ul><li>Ghim tồn tại: hình giọt 3D, kích thước tỷ lệ mức độ; đã đóng mờ 30%.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Biên bản nghiệm thu hoàn thành chỉ ký khi 0 lỗi loại A và có văn bản chấp thuận của cơ quan nhà nước (nếu thuộc diện kiểm tra).<\/li><li><strong>Điểm mù 1:<\/strong> Ranh giới trách nhiệm giữa tổng thầu và nhà thầu fit-out khách thuê — lập biên bản hiện trạng (condition survey) khi bàn giao mặt bằng cho khách thuê.<\/li><li><strong>Điểm mù 2:<\/strong> Phụ tùng thay thế, dụng cụ đặc chủng, chìa khóa (key schedule) không được kiểm đếm khi bàn giao.<\/li><li><strong>Điểm mù 3:<\/strong> Thời điểm bắt đầu bảo hành từng hệ thống khác nhau (đưa vào sử dụng sớm) không được ghi rõ → tranh chấp.<\/li><\/ul>", "quote": "Nghiệm thu ba bên là khoảnh khắc mà Chủ đầu tư, Tư vấn và Tổng thầu cùng nhìn vào một sự thật duy nhất. Một nghìn tám trăm bốn mươi sáu tồn tại đã được tìm ra và khép lại — không phải vì chúng ta làm kém, mà vì chúng ta tìm kỹ. Quy tắc ở đây rất đơn giản: không một lỗi nào ảnh hưởng đến an toàn được phép đi qua cánh cửa này. Khi ba chữ ký cùng hiện lên, hành trình thi công khép lại và cuộc đời thương mại của tòa nhà bắt đầu.", "sw": ["#4E342E"], "scene": "status", "opts": {"mode": "punch"}}, {"n": 39, "title": "Sổ tay vận hành & bảo trì (O&M Manual) và đào tạo đội ngũ quản lý tòa nhà", "code": "EPC-SPEC-39-OAM", "dur": "15 000 ms", "part": "V", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ISO 41001:2018<\/td><td>Hệ thống quản lý cơ sở vật chất (Facility Management)<\/td><\/tr><tr><td>ISO 55001:2024<\/td><td>Quản lý tài sản<\/td><\/tr><tr><td>ISO 19650-3:2020 / COBie<\/td><td>Thông tin giai đoạn vận hành<\/td><\/tr><tr><td>BSRIA BG 54 (Soft Landings)<\/td><td>Chuyển tiếp mềm từ thi công sang vận hành<\/td><\/tr><tr><td>Nghị định 06/2021/NĐ-CP (Chương bảo trì)<\/td><td>Quy trình bảo trì công trình<\/td><\/tr><tr><td>SFG20 / NFPA 25<\/td><td>Lịch bảo dưỡng định kỳ chuẩn; kiểm tra bảo dưỡng hệ thống chữa cháy bằng nước<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Quy trình bảo trì công trình<\/td><td>Lập và phê duyệt trước khi nghiệm thu đưa vào sử dụng (NĐ 06/2021)<\/td><td><\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>O&amp;M Manual<\/td><td>100% hệ thống: mô tả, sơ đồ, chuỗi điều khiển, lịch PPM, danh mục phụ tùng, liên hệ bảo hành<\/td><td>Liên kết vào BIM/CAFM<\/td><td>H<\/td><\/tr><tr><td>Dữ liệu COBie<\/td><td>100% tài sản bảo trì được (≈ 25 000–40 000 tài sản): mã, nhà sản xuất, model, serial, ngày bảo hành<\/td><td>Kiểm tra tự động (COBie QC) không lỗi nghiêm trọng<\/td><td>H<\/td><\/tr><tr><td>Đào tạo<\/td><td>≥ 200 giờ tổng (Spec dự án), mỗi hệ thống chính ≥ 8–16 giờ lý thuyết + thực hành; quay video lưu trữ<\/td><td>Kiểm tra sát hạch đạt ≥ 80%<\/td><td>W<\/td><\/tr><tr><td>Phụ tùng dự phòng<\/td><td>Theo danh mục khuyến nghị nhà sản xuất cho 2 năm vận hành<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Soft Landings / hậu kiểm<\/td><td>Đội ngũ tổng thầu/thiết kế có mặt tại chỗ 4–12 tuần đầu; đánh giá sau sử dụng (POE) ở tháng 12 và 36<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Chỉ tiêu vận hành bàn giao<\/td><td>MTTR, tỷ lệ PPM hoàn thành ≥ 95%, thời gian phản hồi sự cố khẩn cấp ≤ 15 phút<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["O&amp;M Manual số hóa liên kết trực tiếp với mô hình BIM/CAFM và dữ liệu COBie cho 100% tài sản bảo trì được.", "Đào tạo thực chiến ≥ 200 giờ cho đội kỹ thuật vận hành (MEP, BMS, PCCC, thang máy), có sát hạch và video lưu trữ.", "Chuyển giao quyền kiểm soát kỹ thuật theo mô hình Soft Landings: tổng thầu đồng hành 4–12 tuần, đánh giá sau sử dụng ở tháng 12."], "vis": "<ul><li><strong>Over-the-shoulder Training Shot:<\/strong> ống kính 85 mm, f/2, qua vai kỹ thuật viên nhìn vào màn hình cảm ứng 86 inch hiển thị sơ đồ chiller plant động; ánh sáng màn hình phản chiếu lên khuôn mặt.<\/li><li>Cảnh phụ: kính thực tế tăng cường (AR) hiển thị thông tin bảo trì nổi trên một AHU thực tế.<\/li><\/ul>", "tl": [[0, 2500, "Máy tính bảng trao tay; giao diện O&amp;M mở — cây hệ thống → thiết bị → tài liệu"], [2500, 5000, "Chạm vào AHU-38-01 trên BIM: hiện thông số, lịch PPM, lịch sử, video hướng dẫn"], [5000, 8000, "Kỹ thuật viên thao tác tại tủ điều khiển chiller; AR hiển thị thứ tự van cần đóng"], [8000, 10500, "Bảng đào tạo: <code>Giờ đào tạo 236/200 — Sát hạch đạt 100%<\/code>"], [10500, 12000, "Biểu tượng chìa khóa vàng <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> xuất hiện xoay chậm, phát sáng"]], "bim": "<ul><li>Trạng thái tài sản trên CAFM: hoạt động <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, đến hạn bảo trì <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, quá hạn/hỏng <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>, ngừng <code class=\"hex\"><i style=\"background:#90A4AE\"><\/i>#90A4AE<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Quy trình bảo trì được phê duyệt + biên bản hoàn thành đào tạo được ký trước khi bàn giao.<\/li><li><strong>Điểm mù 1:<\/strong> O&amp;M Manual là bản \"copy catalogue\" không có thông số thực tế đã cân chỉnh (TAB, cài đặt BMS) — yêu cầu ghi giá trị as-commissioned.<\/li><li><strong>Điểm mù 2:<\/strong> Đội vận hành được tuyển quá muộn, không tham gia commissioning — Chủ đầu tư phải tuyển đội vận hành từ giai đoạn L3.<\/li><li><strong>Điểm mù 3:<\/strong> Bảo hành bị mất hiệu lực do vận hành sai quy định nhà sản xuất — đưa điều kiện bảo hành vào O&amp;M.<\/li><\/ul>", "quote": "Một công trình vĩ đại cần một đội ngũ vận hành xuất chúng — vì chi phí vận hành năm mươi năm lớn gấp nhiều lần chi phí xây dựng. Sổ tay O&amp;M này không phải là chồng catalogue; nó là bộ não số của tòa nhà, nơi mỗi thiết bị biết mình là ai, cần chăm sóc khi nào và ai chịu trách nhiệm. Khi chúng ta trao chiếc chìa khóa vàng, chúng ta không trao một tòa nhà — chúng ta trao một cơ thể sống cùng với tri thức để giữ nó khỏe mạnh.", "sw": ["#00C853", "#FFAB00", "#D50000", "#90A4AE"], "scene": "status", "opts": {"mode": "key"}}, {"n": 40, "title": "Lễ bàn giao chìa khóa vàng & kỷ nguyên vận hành công trình xanh (LEED / LOTUS / EDGE)", "code": "EPC-SPEC-40-GRN", "dur": "15 000 ms (+ 5 000 ms kết phim)", "part": "V", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>LEED v4.1 BD+C (hoặc LEED v5 khi áp dụng) — USGBC<\/td><td>Chứng nhận công trình xanh: Gold 60–79 điểm, Platinum ≥ 80 điểm<\/td><\/tr><tr><td>LOTUS (Hội đồng Công trình xanh Việt Nam — VGBC)<\/td><td>Chứng nhận công trình xanh Việt Nam<\/td><\/tr><tr><td>EDGE (IFC)<\/td><td>Tiết kiệm ≥ 20% năng lượng, nước, năng lượng hàm chứa<\/td><\/tr><tr><td>ANSI/ASHRAE/IES 90.1 Phụ lục G<\/td><td>Mô hình năng lượng cơ sở so sánh<\/td><\/tr><tr><td>QCVN 09:2017/BXD<\/td><td>Công trình sử dụng năng lượng hiệu quả (bắt buộc với công trình ≥ 2 500 m²)<\/td><\/tr><tr><td>ISO 50001:2018<\/td><td>Hệ thống quản lý năng lượng<\/td><\/tr><tr><td>ISO 14064 / GHG Protocol<\/td><td>Kiểm kê phát thải khí nhà kính<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị mục tiêu<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Hạng chứng nhận<\/td><td>LEED Gold (≥ 60 điểm), hướng Platinum (≥ 80 điểm)<\/td><td>Điều kiện tiên quyết đạt 100%<\/td><td>R<\/td><\/tr><tr><td>Tiết kiệm năng lượng (chi phí) so với ASHRAE 90.1 Phụ lục G<\/td><td>≥ 20–30% (Spec dự án)<\/td><td>Mô hình năng lượng được hiệu chỉnh bằng số liệu đo 12 tháng<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>EUI (cường độ sử dụng năng lượng)<\/td><td>Văn phòng nhiệt đới ≤ 120–150 kWh/m²·năm<\/td><td>Đo sub-metering<\/td><td>R<\/td><\/tr><tr><td>Hiệu suất chiller plant<\/td><td>≤ 0,65 kW/RT toàn nhà máy (Spec dự án)<\/td><td>Đo liên tục<\/td><td>W<\/td><\/tr><tr><td>Tiết kiệm nước<\/td><td>≥ 35–40% so với cơ sở (thiết bị lưu lượng thấp, thu nước mưa, tái sử dụng nước xám)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>QCVN 09:2017/BXD<\/td><td>Tuân thủ 100% chỉ tiêu bắt buộc: OTTV/SHGC mặt dựng, hiệu suất thiết bị, mật độ công suất chiếu sáng (LPD)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Chất lượng môi trường trong nhà<\/td><td>CO₂ ≤ 800 ppm; TVOC ≤ 500 µg/m³; PM2.5 ≤ 15 µg/m³ (đo trước khi sử dụng)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Giảm phát thải carbon vận hành<\/td><td>Kiểm kê hằng năm theo ISO 14064; lộ trình Net Zero vận hành<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Năng lượng hàm chứa (embodied carbon)<\/td><td>Báo cáo LCA toàn công trình, giảm ≥ 10% so với cơ sở (tro bay/xỉ trong bê tông, thép tái chế)<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Lễ bàn giao chìa khóa vàng và cắt băng khánh thành — tòa tháp chính thức bước vào kỷ nguyên vận hành thương mại.", "Chứng nhận LEED Gold/Platinum (hoặc LOTUS, EDGE): tiết kiệm ≥ 20–30% năng lượng so với ASHRAE 90.1, ≥ 35% nước, tuân thủ QCVN 09:2017/BXD.", "Vận hành theo ISO 50001 với EUI ≤ 150 kWh/m²·năm, kiểm kê carbon hằng năm — biểu tượng kỹ thuật và phát triển bền vững của đô thị."], "vis": "<ul><li><strong>Grand Cinematic Finale Shot:<\/strong> flycam bay xoắn ốc từ chân tháp lên đỉnh trong đêm, ống kính 24 mm, 3 vòng quanh tháp trong 10 s, tăng độ cao 0 → 260 m; thành phố lấp lánh <code class=\"hex\"><i style=\"background:#FFB300\"><\/i>#FFB300<\/code> bên dưới.<\/li><li>Mặt dựng kính phát sáng chiếu sáng kiến trúc (LED media facade) <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> → <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>; logo chứng nhận công trình xanh hiện trên mặt dựng sảnh chính.<\/li><li>Bầu trời đầy sao với đường chân trời mờ sương; nhạc nền orchestral crescendo.<\/li><\/ul>", "tl": [[0, 2500, "Chìa khóa vàng <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> (metallic 1.0, roughness 0.15) hiện lơ lửng, xoay chậm, tiếng vỗ tay vang dội"], [2500, 4500, "Kéo băng đỏ cắt, pháo giấy vàng; Chủ đầu tư nhận chìa khóa"], [4500, 7000, "Biểu tượng chứng nhận công trình xanh bay nhẹ nhàng gắn lên mặt tiền sảnh chính; dòng số <code>Energy −28% · Water −38% · CO₂ −3 400 t/năm<\/code>"], [7000, 12000, "Flycam xoắn ốc lên đỉnh; tòa tháp bừng sáng từng tầng từ dưới lên (mỗi tầng 90 ms)"], [12000, 15000, "Đỉnh tháp chạm bầu trời sao; toàn bộ mô hình chuyển thành wireframe BIM <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> rồi tái hiện vật liệu thực — tóm lược hành trình 40 slide trong 3 s"], [15000, 20000, "Kết phim: tiêu đề \"BẢN GIAO HƯỞNG KẾT CẤU\" Inter Tight Bold, fade to black 1 200 ms"]], "bim": "<ul><li>Bảng điểm LEED theo hạng mục: Năng lượng &amp; Khí quyển <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>, Nước <code class=\"hex\"><i style=\"background:#00ACC1\"><\/i>#00ACC1<\/code>, Vật liệu <code class=\"hex\"><i style=\"background:#8D6E63\"><\/i>#8D6E63<\/code>, Môi trường trong nhà <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>, Địa điểm &amp; Giao thông <code class=\"hex\"><i style=\"background:#43A047\"><\/i>#43A047<\/code>.<\/li><li>Chiếu sáng mặt dựng cuối phim: gradient dọc <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> (chân) → <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> (đỉnh), cường độ animate 0 → 100% trong 5 s.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Đo đạc &amp; kiểm chứng (M&amp;V) 12 tháng đầu vận hành để xác nhận hiệu quả năng lượng thực tế khớp mô hình — điều kiện để giải tỏa phần giữ lại liên quan đến cam kết hiệu suất (nếu hợp đồng có).<\/li><li><strong>Điểm mù 1:<\/strong> \"Khoảng cách hiệu suất\" (performance gap) — tòa nhà tiêu thụ nhiều hơn mô hình 30–50% do vận hành sai cài đặt. Seasonal commissioning + phân tích dữ liệu BMS liên tục.<\/li><li><strong>Điểm mù 2:<\/strong> Chứng nhận công trình xanh dừng ở giai đoạn thiết kế — cần chương trình chứng nhận vận hành (LEED O+M) để duy trì.<\/li><li><strong>Điểm mù 3:<\/strong> Fit-out của khách thuê phá vỡ chiến lược năng lượng — ban hành Sổ tay hướng dẫn thiết kế &amp; thi công cho khách thuê (Green Fit-out Guide).<\/li><\/ul>", "quote": "Từ một bản vẽ phác thảo trên giấy và một hố móng sâu giữa lòng đất, giờ đây tòa tháp đã hiện hữu kiêu hãnh bằng tất cả bản lĩnh, trí tuệ và kỷ luật của hàng nghìn con người. Nhưng thước đo cuối cùng của một công trình vĩ đại không phải là chiều cao — mà là nó tiêu thụ ít hơn bao nhiêu năng lượng, phục vụ con người tốt hơn bao nhiêu và tồn tại bền vững bao lâu. Bốn mươi bước trong bản giao hưởng này đã hoàn tất. Chào mừng các bạn đến với tương lai của kỷ nguyên xây dựng thông minh và bền vững!", "sw": ["#FFB300", "#00E5FF", "#FFC400", "#00ACC1", "#8D6E63", "#7E57C2", "#43A047"], "scene": "tower", "opts": {"mode": "lights"}}], "parts": [{"roman": "I", "name": "GIAI ĐOẠN TIỀN KHẢO SÁT, THIẾT KẾ VÀ BIM", "range": "1 – 5"}, {"roman": "II", "name": "GIAI ĐOẠN THI CÔNG PHẦN NGẦM & HỐ MÓNG SÂU", "range": "6 – 13"}, {"roman": "III", "name": "GIAI ĐOẠN THI CÔNG KẾT CẤU PHẦN THÂN THÁP", "range": "14 – 24"}, {"roman": "IV", "name": "GIAI ĐOẠN HOÀN THIỆN & CƠ ĐIỆN MEP", "range": "25 – 34"}, {"roman": "V", "name": "GIAI ĐOẠN KIỂM ĐỊNH, NGHIỆM THU VÀ BÀN GIAO VẬN HÀNH", "range": "35 – 40"}], "itp": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>Hold Point<\/th><th>Slide<\/th><th>Người ký<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Báo cáo khảo sát địa kỹ thuật + lõi đá mũi cọc<\/td><td>1<\/td><td>TVGS + Thiết kế<\/td><\/tr><tr><td>2<\/td><td>0 clash trước phát hành bản vẽ thi công<\/td><td>2<\/td><td>BIM Manager + TVGS<\/td><\/tr><tr><td>3<\/td><td>Báo cáo hầm gió đối chiếu tiêu chuẩn<\/td><td>3<\/td><td>Thẩm tra kết cấu<\/td><\/tr><tr><td>4<\/td><td>Baseline tiến độ đạt ≥ 12/14 chỉ số DCMA<\/td><td>4<\/td><td>Chủ đầu tư<\/td><\/tr><tr><td>5<\/td><td>Biên bản chuyển trục/cao độ từng tầng<\/td><td>5<\/td><td>TVGS trắc địa<\/td><\/tr><tr><td>6<\/td><td>Bentonite đáy hố + độ thẳng đứng panel/cọc<\/td><td>6, 7<\/td><td>TVGS<\/td><\/tr><tr><td>7<\/td><td>Cặn lắng đáy cọc ≤ 50 mm<\/td><td>7<\/td><td>TVGS<\/td><\/tr><tr><td>8<\/td><td>Thử neo 100% / gia tải trước thanh chống<\/td><td>8<\/td><td>TVGS + Địa kỹ thuật<\/td><\/tr><tr><td>9<\/td><td>Quan trắc Xanh trước mỗi lớp đào<\/td><td>9<\/td><td>Chỉ huy trưởng + TVGS<\/td><\/tr><tr><td>10<\/td><td>Màng chống thấm đáy 100%<\/td><td>10<\/td><td>TVGS<\/td><\/tr><tr><td>11<\/td><td>Cốt thép móng bè + giá đỡ có bản tính<\/td><td>11<\/td><td>TVGS + Kết cấu<\/td><\/tr><tr><td>12<\/td><td>Pour Permit đổ bê tông khối lớn<\/td><td>12<\/td><td>Chỉ huy trưởng + TVGS + CĐT<\/td><\/tr><tr><td>13<\/td><td>Nghiệm thu hoàn thành phần ngầm<\/td><td>13<\/td><td>3 bên<\/td><\/tr><tr><td>14<\/td><td>Kiểm định cẩu/vận thăng; Climb Permit<\/td><td>14, 15<\/td><td>Kiểm định viên + An toàn<\/td><\/tr><tr><td>15<\/td><td>Cường độ trước tháo chống / căng cáp<\/td><td>16, 17, 19<\/td><td>TVGS<\/td><\/tr><tr><td>16<\/td><td>UT mối hàn CFT; NDT từng tầng<\/td><td>18, 22<\/td><td>Phòng thí nghiệm độc lập<\/td><\/tr><tr><td>17<\/td><td>Giàn chống dầm chuyển — thẩm tra độc lập<\/td><td>20<\/td><td>Kết cấu độc lập<\/td><\/tr><tr><td>18<\/td><td>Hình học tổng thể sau cất nóc<\/td><td>23<\/td><td>TVGS trắc địa<\/td><\/tr><tr><td>19<\/td><td>PMU mặt dựng đạt toàn bộ thử nghiệm<\/td><td>25<\/td><td>Tư vấn mặt dựng<\/td><\/tr><tr><td>20<\/td><td>Thử áp/kín MEP trước khi che khuất<\/td><td>26, 31<\/td><td>TVGS MEP<\/td><\/tr><tr><td>21<\/td><td>Kiểm định thang máy<\/td><td>27<\/td><td>Tổ chức kiểm định<\/td><\/tr><tr><td>22<\/td><td>Thử nghiệm điện độc lập + đấu nối<\/td><td>28<\/td><td>Điện lực + TVGS<\/td><\/tr><tr><td>23<\/td><td>Point-to-point BMS 100%<\/td><td>33<\/td><td>Cx Authority<\/td><\/tr><tr><td>24<\/td><td>IST — ma trận C&amp;E 100%<\/td><td>34<\/td><td>Cx Authority + PCCC<\/td><\/tr><tr><td>25<\/td><td>Thử tải / chứng nhận an toàn chịu lực<\/td><td>35<\/td><td>Đơn vị kiểm định<\/td><\/tr><tr><td>26<\/td><td>Văn bản chấp thuận nghiệm thu PCCC<\/td><td>36<\/td><td>Cảnh sát PCCC &amp; CNCH<\/td><\/tr><tr><td>27<\/td><td>Hồ sơ hoàn thành công trình<\/td><td>37<\/td><td>TVGS + CĐT<\/td><\/tr><tr><td>28<\/td><td>Nghiệm thu hoàn thành — 0 lỗi loại A<\/td><td>38<\/td><td>3 bên + Cơ quan nhà nước<\/td><\/tr><tr><td>29<\/td><td>Quy trình bảo trì + đào tạo<\/td><td>39<\/td><td>CĐT + Đơn vị vận hành<\/td><\/tr><tr><td>30<\/td><td>M&amp;V năng lượng 12 tháng<\/td><td>40<\/td><td>CĐT + Tư vấn công trình xanh<\/td><\/tr><\/tbody><\/table><\/div>", "corr": "<div class=\"tw\"><table><thead><tr><th>Slide<\/th><th>Bản nháp<\/th><th>Hiệu chỉnh<\/th><th>Lý do<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>TCVN 9436<\/td><td><strong>TCVN 9437:2012<\/strong> (Khoan thăm dò ĐCCT) + TCVN 9363:2012<\/td><td>TCVN 9436 là tiêu chuẩn nền đường ô tô<\/td><\/tr><tr><td>2<\/td><td>LOD 500 cho phối hợp thiết kế<\/td><td><strong>LOD 350/400<\/strong> cho phối hợp &amp; chế tạo; <strong>LOD 500<\/strong> chỉ cho mô hình hoàn công đã kiểm chứng hiện trường<\/td><td>Theo định nghĩa BIMForum LOD Specification<\/td><\/tr><tr><td>3<\/td><td>ASCE 7-16<\/td><td><strong>ASCE 7-22<\/strong> (bản hiện hành) + TCVN 2737:2023 + TCVN 9386:2012 cho động đất<\/td><td>Cập nhật phiên bản<\/td><\/tr><tr><td>6<\/td><td>TCVN 9396:2012 cho tường vây<\/td><td><strong>EN 1538:2010+A1:2015<\/strong> + TCVN 9395:2012 (thông số bentonite)<\/td><td>TCVN 9396 là tiêu chuẩn siêu âm cọc<\/td><\/tr><tr><td>7<\/td><td>—<\/td><td>Bổ sung <strong>TCVN 9396:2012 / ASTM D6760<\/strong> cho siêu âm, <strong>TCVN 9393:2012<\/strong> cho nén tĩnh<\/td><td><\/td><\/tr><tr><td>8<\/td><td>TCVN 11821:2017<\/td><td><strong>TCVN 8870:2011<\/strong> + EN 1537:2013 + PTI DC35.1<\/td><td>Đúng phạm vi neo trong đất<\/td><\/tr><tr><td>9<\/td><td>TCVN 9362 cho hạ nước ngầm<\/td><td>TCVN 9362:2012 giữ cho kiểm tra nền; bổ sung <strong>CIRIA C750<\/strong> và EN 1997-1 (trạng thái UPL/HYD)<\/td><td>TCVN 9362 là tiêu chuẩn thiết kế nền<\/td><\/tr><tr><td>10<\/td><td>M150 (B10)<\/td><td><strong>B7.5–B12.5<\/strong> (tương đương M100–M150)<\/td><td>Đối chiếu bảng tương quan TCVN 5574<\/td><\/tr><tr><td>15<\/td><td>ACI 347.3R cho tốc độ leo<\/td><td><strong>ACI 347R-14<\/strong> (ván khuôn) ; ACI 347.3R chỉ dùng cho chất lượng bề mặt<\/td><td><\/td><\/tr><tr><td>22<\/td><td>ASTM E165 cho UT/MT<\/td><td><strong>ASTM E165<\/strong> = thẩm thấu chất lỏng (PT); UT: <strong>AWS D1.1 / ISO 17640<\/strong>; MT: <strong>ASTM E709<\/strong><\/td><td><\/td><\/tr><tr><td>26<\/td><td>TCVN 2622:1995<\/td><td><strong>QCVN 06:2022/BXD + Sửa đổi 1:2023<\/strong><\/td><td>TCVN 2622 đã được thay thế<\/td><\/tr><tr><td>27<\/td><td>TCVN 6395:2008<\/td><td><strong>TCVN 6396-20:2017 / -50<\/strong> (EN 81-20/50) + EN 81-72 thang chữa cháy<\/td><td><\/td><\/tr><tr><td>29<\/td><td>—<\/td><td>Bổ sung <strong>TCVN 7336:2021<\/strong> (sprinkler), NFPA 20, N
