FPA 92<\/td><td><\/td><\/tr><tr><td>30<\/td><td>TCVN 7959:2011<\/td><td><strong>TCVN 7959:2017<\/strong><\/td><td>Bản thay thế<\/td><\/tr><tr><td>35<\/td><td>TCVN 9343:2012<\/td><td><strong>TCVN 9344:2012<\/strong> (thử tải tĩnh cấu kiện chịu uốn) + ACI 437.2-13<\/td><td>TCVN 9343 là hướng dẫn bảo trì<\/td><\/tr><tr><td>36<\/td><td>NĐ 136/2020<\/td><td><strong>Luật PCCC &amp; CNCH 2024 (55/2024/QH15)<\/strong> + NĐ 105/2025/NĐ-CP<\/td><td>Văn bản thay thế, hiệu lực từ 01/7/2025<\/td><\/tr><tr><td>40<\/td><td>LOTES<\/td><td><strong>LOTUS<\/strong> (VGBC) / EDGE / LEED v4.1<\/td><td>Sửa tên chứng chỉ<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\"><strong>Lưu ý pháp lý:<\/strong> Văn bản quy phạm pháp luật Việt Nam thay đổi nhanh. Trước khi dùng tài liệu cho một dự án cụ thể, Tư vấn giám sát trưởng phải rà soát hiệu lực của mọi Luật, Nghị định, QCVN, TCVN được viện dẫn tại thời điểm ký hợp đồng và thời điểm nghiệm thu. Các giá trị dung sai ghi \"Spec dự án\" là ngưỡng khuyến nghị khắt khe hơn tiêu chuẩn tối thiểu, cần được đưa vào Chỉ dẫn kỹ thuật (Technical Specification) của hợp đồng mới có giá trị ràng buộc.<\/p>"}</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const S=D.slides, TOTAL=S.length;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const main=$('#main');
let cur=0, anim=null;  // 0 = bìa, 1..40 = slide, 41 = phụ lục

/* ---------- Bảng màu canvas ---------- */
const C={wire:'#00E5FF',dim:'rgba(0,229,255,.22)',pass:'#00C853',warn:'#FFAB00',fail:'#FF3B3B',info:'#00B8D4',gold:'#FFC400',
  laser:'#1DE9B6',steel:'#8A9099',conc:'#8E8B86',text:'#D5E6EC',mute:'#6E8792',pink:'#B5838D',purple:'#9575CD',orange:'#FF6D00',yellow:'#F2B705'};
const TURBO=['#30123B','#4145AB','#4675ED','#39A2FC','#1BCFD4','#24ECA6','#61FC6C','#A4FC3B','#D1E834','#F3C63A','#FE9B2D','#D23105','#7A0403'];
const turbo=v=>TURBO[Math.round(Math.max(0,Math.min(1,v))*(TURBO.length-1))];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(p,a,b)=>cl((p-a)/(b-a));
const ez=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ln(g,a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function tx(g,s,x,y,col=C.text,sz=11,al='left',w=400){g.fillStyle=col;g.font=`${w} ${sz}px "JetBrains Mono",monospace`;g.textAlign=al;g.textBaseline='middle';g.fillText(s,x,y)}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}

/* ---------- Tháp dạng wireframe ---------- */
function geo(w,h,cx,tw){return{cx:cx??w*.5,by:h*.9,ty:h*.08,tw:tw??Math.min(w*.2,h*.3),n:28}}
const fy=(G,i)=>G.by-(G.by-G.ty)*i/G.n;
function tower(g,G,upto,o={}){
  const k=Math.min(G.n,Math.floor(upto)),off=o.off||(()=>0);
  if(o.fill)for(let i=0;i<k;i++){const of=off(i/G.n);g.fillStyle=o.fill(i);g.fillRect(G.cx-G.tw/2+of,fy(G,i+1),G.tw,fy(G,i)-fy(G,i+1)-1)}
  g.lineWidth=1;
  for(let i=0;i<=k;i++){const y=fy(G,i),of=off(i/G.n);g.strokeStyle=o.floor?o.floor(i):C.dim;ln(g,G.cx-G.tw/2+of,y,G.cx+G.tw/2+of,y)}
  for(let c=0;c<=5;c++){g.strokeStyle=o.col||C.wire;g.globalAlpha=c==0||c==5?.95:.35;g.beginPath();
    for(let i=0;i<=k;i++){const x=G.cx-G.tw/2+G.tw*c/5+off(i/G.n);i?g.lineTo(x,fy(G,i)):g.moveTo(x,fy(G,i))}g.stroke()}
  g.globalAlpha=1;
}
function ground(g,w,G){g.strokeStyle=C.wire;g.globalAlpha=.6;ln(g,0,G.by,w,G.by);g.globalAlpha=1}

/* ---------- Các cảnh mô phỏng ---------- */
const SC={};
SC.strata=(g,w,h,t,Dm,o)=>{
  const p=t/Dm,gy=h*.14,dep=d=>gy+(h-gy)*d;
  const L=[[.08,'#8D6E63','Đất lấp'],[.28,'#5D6D7E','Sét yếu N=0–3'],[.46,'#D4B483','Cát mịn N=12–25'],[.62,'#A1887F','Sét cứng N=25–40'],[.8,'#BCAAA4','Cuội sỏi N>50'],[1,'#37474F','Đá gốc']];
  let y0=gy;for(const[d,c,n]of L){const y1=dep(d);g.fillStyle=c;g.globalAlpha=.42;g.fillRect(0,y0,w,y1-y0);g.globalAlpha=1;tx(g,n,8,y0+11,'#E8F0F2',10);y0=y1}
  g.strokeStyle=C.wire;g.lineWidth=1.5;ln(g,0,gy,w,gy);g.lineWidth=1;
  if(o.drill){
    const x=w*.5,a=ez(seg(p,.23,.5)),yb=dep(.97*a);
    g.strokeStyle='#CFD8DC';g.lineWidth=4;ln(g,x,gy-26,x,yb);g.lineWidth=1;
    for(let y=gy;y<yb;y+=12){g.strokeStyle='rgba(255,255,255,.35)';ln(g,x-3,y+(t/8)%12,x+3,y+6+(t/8)%12)}

    tx(g,p>.75?(black?'MẤT ĐIỆN LƯỚI…':'MÁY PHÁT MANG TẢI 8,4 s ✓'):p>.37?'Megger > 2 000 MΩ · THDv 3,1%':'Busway 4 000 A · 70 N·m',w*.06,h*.03+6,black?C.warn:C.pass,11,'left',600)}};
SC.sprinkler=(g,w,h,t,Dm)=>{const p=t/Dm,ceil=h*.14,fl=h*.88;g.strokeStyle=C.wire;ln(g,0,ceil,w,ceil);ln(g,0,fl,w,fl);
  const smoke=seg(p,.05,.46)*(1-seg(p,.46,.75));const gr=g.createLinearGradient(0,ceil,0,ceil+h*.45);gr.addColorStop(0,`rgba(90,90,90,${.85*smoke})`);gr.addColorStop(1,'rgba(90,90,90,0)');g.fillStyle=gr;g.fillRect(0,ceil,w*.7,h*.45);
  const fire=1-seg(p,.7,.9);if(fire>0){for(let i=0;i<10;i++){const r=rng(Math.floor(t/60)+i);g.fillStyle=i%2?'rgba(255,109,0,.8)':'rgba(255,196,0,.8)';const fh=(20+r()*28)*fire*seg(p,0,.15);g.beginPath();g.moveTo(w*.3+i*5-12,fl);g.lineTo(w*.3+i*5+(r()-.5)*8,fl-fh);g.lineTo(w*.3+i*5+12,fl);g.fill()}}
  [.18,.36,.54].forEach((a,i)=>{const x=w*a;g.fillStyle=p>.29&&i<2?'#90A4AE':'#D32F2F';g.fillRect(x-3,ceil,6,8);if(p>.29&&i<2&&p<.92){for(let k=0;k<26;k++){const r=rng(k*7+i);const q=((t/700)+r())%1;g.fillStyle='rgba(225,245,254,.8)';g.fillRect(x+(r()-.5)*q*w*.18,ceil+10+q*(fl-ceil-10),1.6,4)}}});
  if(p>.46){g.fillStyle='rgba(149,117,205,.18)';g.fillRect(w*.74,ceil,w*.26,fl-ceil);for(let i=0;i<4;i++){const x=w*.95-((t/8+i*40)%(w*.24));g.strokeStyle=C.purple;ln(g,x,h*.3+i*h*.12,x-16,h*.3+i*h*.12);ln(g,x-16,h*.3+i*h*.12,x-10,h*.3+i*h*.12-5)}tx(g,'ΔP 38 Pa · lực cửa 86 N',w*.98,h*.06,C.purple,11,'right',600)}
  if(p>.06&&p<.2&&Math.floor(t/160)%2){g.fillStyle=C.fail;g.beginPath();g.arc(w*.62,ceil+6,5,0,7);g.fill()}
  tx(g,p>.87?'FIRE CONTROLLED — 4 heads operated':p>.29?'Bóng 68 °C vỡ · bơm tự khởi động':'Đầu báo khói kích hoạt…',8,h*.06,p>.87?C.pass:C.warn,11,'left',600)};
SC.network=(g,w,h,t,Dm,o)=>{const p=t/Dm;
  if(o.mode==='bms'){const cx=w*.5,cy=h*.5,R=Math.min(w,h)*.38;const N=18;g.strokeStyle=C.wire;g.lineWidth=2;g.beginPath();g.arc(cx,cy,14,0,7);g.stroke();g.lineWidth=1;tx(g,'BMS',cx,cy,C.wire,10,'center',600);
    const sys=['#0057B8','#FFC400','#FBC02D','#9575CD'];for(let i=0;i<N;i++){const a=i/N*6.28,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R*.8;g.strokeStyle='rgba(0,229,255,.15)';ln(g,cx,cy,x,y);
      const col=p>.2?sys[i%4]:C.info;g.fillStyle=col;g.beginPath();g.arc(x,y,4,0,7);g.fill();const q=((t/1400)+i*.137)%1;g.fillStyle='#E0F7FA';g.beginPath();g.arc(x+(cx-x)*q,y+(cy-y)*q,1.8,0,7);g.fill()}
    const pw=1-.42*seg(p,.42,.66);g.fillStyle='rgba(0,229,255,.12)';g.fillRect(w*.04,h*.92-h*.18*pw,w*.06,h*.18*pw);tx(g,`P ${Math.round(pw*100)}%`,w*.04,h*.95,C.wire,10);
    tx(g,p>.83?'EUI 118 kWh/m²·năm · tiện nghi 96%':p>.66?`CO₂ ${Math.round(950-230*seg(p,.66,.83))} ppm`:'Cảnh báo ≤ 2 s · 30 000 điểm',8,h*.06,C.pass,11,'left',600)}
  else{const cnt=Math.floor(seg(p,0,.25)*48312);const cols=6,rows=5;for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=w*.1+i*w*.13,y=h*.16+j*h*.13;g.strokeStyle='rgba(0,229,255,.35)';g.strokeRect(x,y,w*.11,h*.1);
      const k=(j*cols+i)/(cols*rows),f=seg(p,k*.25,k*.25+.05);if(f>0){g.fillStyle=['#D32F2F','#00ACC1','#43A047'][(i+j)%3];g.globalAlpha=.7;g.fillRect(x+3,y+3,(w*.11-6)*f,h*.1-6);g.globalAlpha=1}}
    if(p>.46&&p<.67){const s=ez(seg(p,.46,.56));g.fillStyle='rgba(183,28,28,.85)';g.beginPath();g.arc(w*.5,h*.5-(1-s)*h*.4,30,0,7);g.fill();tx(g,'ĐÃ NGHIỆM THU',w*.5,h*.5-(1-s)*h*.4,'#fff',9,'center',600)}
    tx(g,`${cnt.toLocaleString('vi-VN')} tệp · PDF/A · IFC · COBie`,8,h*.06,C.wire,11,'left',600);if(p>.87)tx(g,'Danh mục hồ sơ 100% ✓',w*.92,h*.94,C.pass,11,'right',600)}};
SC.status=(g,w,h,t,Dm,o)=>{const p=t/Dm;
  if(o.mode==='ist'){const pw=w/2,ph=h*.38;const P=[[0,0,'BÁO CHÁY'],[1,0,'QUẠT TĂNG ÁP'],[0,1,'THANG MÁY'],[1,1,'CỬA CHỐNG CHÁY']];
    P.forEach(([i,j,n])=>{const x=i*pw+6,y=h*.06+j*(ph+6);g.strokeStyle='rgba(0,229,255,.3)';g.strokeRect(x,y,pw-12,ph);tx(g,n,x+8,y+12,C.mute,10);const cx=x+pw/2-6,cy=y+ph/2+6;
      if(n==='BÁO CHÁY'){const on=p>.12&&Math.floor(t/250)%2;g.fillStyle=on?C.fail:'#4a1a1a';g.beginPath();g.arc(cx,cy,ph*.22,0,7);g.fill()}
      if(n==='QUẠT TĂNG ÁP'){const sp=seg(p,.3,.55);g.save();g.translate(cx,cy);g.rotate(t/1000*sp*30);g.fillStyle=C.purple;for(let k=0;k<4;k++){g.rotate(Math.PI/2);g.beginPath();g.ellipse(ph*.12,0,ph*.13,ph*.05,0,0,7);g.fill()}g.restore()}
      if(n==='THANG MÁY'){g.strokeStyle=C.wire;g.strokeRect(cx-14,y+20,28,ph-28);const q=ez(seg(p,.54,.75));g.fillStyle=C.gold;g.fillRect(cx-11,y+24+(ph-50)*q,22,18)}
      if(n==='CỬA CHỐNG CHÁY'){const q=ez(seg(p,.3,.4));g.fillStyle='#8D6E63';g.fillRect(cx-40,cy-ph*.3,40*q,ph*.6);g.fillRect(cx+40-40*q,cy-ph*.3,40*q,ph*.6);g.strokeStyle=C.wire;g.strokeRect(cx-40,cy-ph*.3,80,ph*.6)}});
    const k=seg(p,.87,1);g.fillStyle='rgba(0,200,83,.2)';g.fillRect(6,h*.86,(w-12),6);g.fillStyle=C.pass;g.fillRect(6,h*.86,(w-12)*k,6);tx(g,`T+${(t/1000).toFixed(3)} s · ${Math.round(k*1284)}/1 284 bước đạt`,w-8,h*.83,C.pass,10,'right')}
  if(o.mode==='punch'){const x0=w*.08,y0=h*.12,W=w*.84,H=h*.7;g.strokeStyle='rgba(0,229,255,.4)';g.strokeRect(x0,y0,W,H);for(let i=1;i<6;i++)ln(g,x0+W*i/6,y0,x0+W*i/6,y0+H*.4);for(let i=1;i<6;i++)ln(g,x0+W*i/6,y0+H*.6,x0+W*i/6,y0+H);ln(g,x0,y0+H*.4,x0+W,y0+H*.4);ln(g,x0,y0+H*.6,x0+W,y0+H*.6);
    const r=rng(9),N=60,shown=seg(p,0,.25)*N,fixed=seg(p,.25,.5)*N;for(let i=0;i<shown;i++){const x=x0+r()*W,y=y0+r()*H,ty=r();const c=i<fixed?C.pass:ty<.15?C.fail:ty<.55?C.warn:C.info;g.fillStyle=c;g.globalAlpha=i<fixed?.5:1;g.beginPath();g.arc(x,y,4,0,7);g.fill();g.globalAlpha=1}
    tx(g,`Punch items: ${Math.round(1846*(1-seg(p,.25,.5)))} · loại A: 0`,x0,y0-14,C.text,11,'left',600);if(p>.7)tx(g,'APPROVED — 3/3 chữ ký số',w*.5,y0+H+h*.08,C.pass,14,'center',600)}
  if(o.mode==='key'){const cx=w*.5,cy=h*.48,s=Math.min(w,h)/180;const sh=seg(p,.87,1);g.save();g.translate(cx,cy);g.scale(Math.cos(t/700)*s,s);g.strokeStyle=C.gold;g.lineWidth=8;g.shadowColor=C.gold;g.shadowBlur=20*sh;
    g.beginPath();g.arc(-30,0,18,0,7);g.stroke();ln(g,-12,0,50,0);ln(g,40,0,40,14);ln(g,30,0,30,10);g.restore();g.shadowBlur=0;
    const items=['O&M Manual','COBie 32 418 tài sản','Đào tạo 236 / 200 h','Quy trình bảo trì ✓'];items.forEach((n,i)=>{if(p>.1+i*.12)tx(g,'▸ '+n,w*.06,h*.12+i*h*.08,i===2&&p>.66?C.pass:C.text,11)});
    if(p>.87)tx(g,'BÀN GIAO QUYỀN VẬN HÀNH',cx,h*.9,C.gold,14,'center',600)}};

/* ---------- Bộ điều khiển animation ---------- */
function Player(cv,sl,ui){
  const g=cv.getContext('2d');const Dm=Math.max(...sl.tl.map(r=>r[1]),12000);let t=RM?Dm*.92:0,playing=!RM,last=0,raf=0;
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);g.setTransform(d,0,0,d,0,0);draw()}
  function draw(){const r=cv.getBoundingClientRect();g.clearRect(0,0,r.width,r.height);try{SC[sl.scene](g,r.width,r.height,t,Dm,sl.opts)}catch(e){console.error(e)}
    ui.tick(t,Dm)}
  function loop(ts){if(!last)last=ts;t+=ts-last;last=ts;if(t>Dm+1500)t=0;draw();raf=playing?requestAnimationFrame(loop):0}
  const ro=new ResizeObserver(size);ro.observe(cv);
  const api={play(){if(playing)return;playing=true;last=0;raf=requestAnimationFrame(loop);ui.state(true)},pause(){playing=false;cancelAnimationFrame(raf);ui.state(false)},
    toggle(){playing?api.pause():api.play()},seek(ms){t=cl(ms,0,Dm);last=0;draw()},destroy(){playing=false;cancelAnimationFrame(raf);ro.disconnect()},Dm};
  size();if(playing)raf=requestAnimationFrame(loop);ui.state(playing);return api;
}

/* ---------- Dựng giao diện ---------- */
const partOf=r=>D.parts.find(p=>p.roman===r);
const fmt=ms=>(ms/1000).toFixed(1).replace('.',',')+' s';
let TAB='tol';try{TAB=localStorage.getItem('bghkc-tab')||'tol'}catch(e){}
const TABS=[['tol','Dung sai'],['std','Tiêu chuẩn'],['vis','Visual & camera'],['bim','Mã màu BIM'],['hold','Điểm dừng & điểm mù']];

function renderSlide(sl){
  const pt=partOf(sl.part);
  main.innerHTML=`<article class="slide">
  <div class="col">
    <div class="stage"><canvas aria-label="Mô phỏng animation slide ${sl.n}" role="img"></canvas><div class="hud">${sl.code}</div><div class="hud2" id="hudT">0,0 s</div></div>
    <div class="player"><button class="btn" id="pp" type="button">Tạm dừng</button><button class="btn" id="rs" type="button">Phát lại</button>
      <div class="track" id="trk" role="slider" aria-label="Tua timeline" tabindex="0"><i id="trkI"></i></div><span class="tc" id="tc"></span></div>
    <ul class="tl" id="tl">${sl.tl.map(r=>`<li data-t="${r[0]}"><span>${r[0].toLocaleString('vi-VN')}–${r[1].toLocaleString('vi-VN')} ms</span><div>${r[2]}</div></li>`).join('')}</ul>
    ${sl.sw.length?`<div class="sw" aria-label="Bảng màu slide">${sl.sw.map(c=>`<i title="${c}" style="background:${c}"></i>`).join('')}</div>`:''}
  </div>
  <div class="col">
    <div class="eyebrow"><span class="tag">Phần ${sl.part} · ${pt.name}</span><span>${sl.dur}</span></div>
    <div><div class="num">SLIDE ${String(sl.n).padStart(2,'0')} / 40</div><h2>${sl.title}</h2></div>
    <ul class="bul">${sl.bul.map(b=>`<li>${b}</li>`).join('')}</ul>
    <blockquote class="quote"><small>Lời thoại giảng viên</small>“${sl.quote}”</blockquote>
    <div class="tabs" role="tablist">${TABS.map(([k,n])=>`<button class="tab" role="tab" type="button" id="tab-${k}" data-k="${k}" aria-selected="${k===TAB}">${n}</button>`).join('')}</div>
    <div class="pane" id="pane" role="tabpanel"></div>
  </div></article>`;
  const pane=$('#pane'),setTab=k=>{TAB=k;try{localStorage.setItem('bghkc-tab',k)}catch(e){}document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));pane.innerHTML=sl[k];pane.setAttribute('aria-labelledby','tab-'+k)};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.k));setTab(TAB);
  const lis=[...document.querySelectorAll('#tl li')];
  const ui={tick(t,Dm){$('#trkI').style.width=(cl(t/Dm)*100)+'%';$('#tc').textContent=fmt(Math.min(t,Dm))+' / '+fmt(Dm);$('#hudT').textContent=`T+${Math.floor(Math.min(t,Dm)).toLocaleString('vi-VN')} ms`;
      sl.tl.forEach((r,i)=>{const on=t>=r[0]&&t<r[1];lis[i].classList.toggle('on',on);lis[i].classList.toggle('done',t>=r[1])})},
    state(pl){$('#pp').textContent=pl?'Tạm dừng':'Phát'}};
  anim=Player(main.querySelector('canvas'),sl,ui);
  $('#pp').onclick=()=>anim.toggle();$('#rs').onclick=()=>{anim.seek(0);anim.play()};
  lis.forEach(li=>li.onclick=()=>{anim.seek(+li.dataset.t+1)});
  const trk=$('#trk');trk.onclick=e=>{const r=trk.getBoundingClientRect();anim.seek((e.clientX-r.left)/r.width*anim.Dm)};
}
function renderCover(){
  main.innerHTML=`<section class="cover"><div class="col" style="gap:20px">
    <div class="eyebrow"><span class="tag">Khóa học chuyên đề cấp cao · 40 slide</span><span>Rev.02</span></div>
    <h1>Bản giao hưởng <b>kết cấu</b></h1>
    <p class="lede">Quy trình tổng thầu thi công toàn diện tòa nhà cao tầng từ A đến Z — từ móng cọc nhồi sâu đến nghiệm thu vận hành Smart Building. Mỗi slide là một hồ sơ đặc tả EPC: tiêu chuẩn, dung sai đến mi-li-mét, timeline animation đến mili-giây, mã màu BIM và điểm dừng kiểm soát.</p>
    <div class="meta"><span class="chip">Chủ đầu tư</span><span class="chip">TVGS trưởng</span><span class="chip">Tổng thầu EPC</span><span class="chip">Nghiên cứu sinh</span></div>
    <div class="meta"><span class="chip">Tháp 55 tầng · 220 m</span><span class="chip">5 tầng hầm</span><span class="chip">Móng bè 4,0 m</span><span class="chip">420 cọc D1500–D2000</span></div>
    <div class="nav"><button class="btn pri" id="go1" type="button">Bắt đầu trình chiếu →</button><span class="tc">Phím ← → để chuyển slide · Space để phát/dừng</span></div>
  </div><div class="col"><div class="stage"><canvas aria-hidden="true"></canvas></div>
    <ul class="parts">${D.parts.map(p=>{const a=+p.range.split('–')[0].trim();return `<li><button type="button" data-go="${a}"><span class="r">${p.roman}</span><span>${p.name}</span><span class="s">Slide ${p.range}</span></button></li>`}).join('')}
    <li><button type="button" data-go="41"><span class="r">PL</span><span>Phụ lục: 30 Hold Point &amp; danh mục hiệu chỉnh</span><span class="s">ITP</span></button></li></ul></div></section>`;
  $('#go1').onclick=()=>go(1);main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  anim=Player(main.querySelector('canvas'),{scene:'tower',opts:{mode:'lights'},tl:[[0,0,''],[0,12000,'']]},{tick(){},state(){}});
}
function renderAppx(){main.innerHTML=`<section class="col" style="gap:18px"><div class="eyebrow"><span class="tag">Phụ lục</span></div><h2>Bảng Hold Point toàn dự án &amp; danh mục hiệu chỉnh tiêu chuẩn</h2>
  <div class="appx"><div class="pane">${D.itp}</div><div class="pane"><p><strong>Hiệu chỉnh so với bản nháp Rev.01</strong></p>${D.corr}</div></div></section>`;anim=null}

function go(i){i=cl(i,0,TOTAL+1);if(anim)anim.destroy();anim=null;cur=i;
  if(i===0)renderCover();else if(i>TOTAL)renderAppx();else renderSlide(S[i-1]);
  $('#count').textContent=i===0?'BÌA':i>TOTAL?'PL':`${String(i).padStart(2,'0')}/${TOTAL}`;
  $('#crumb').textContent=i>=1&&i<=TOTAL?`Phần ${S[i-1].part} — ${partOf(S[i-1].part).name}`:'Quy trình tổng thầu thi công nhà cao tầng A–Z';
  $('#prog').style.width=(i/(TOTAL+1)*100)+'%';$('#bPrev').disabled=i===0;$('#bNext').disabled=i>TOTAL;
  try{history.replaceState(null,'',i?'#s'+i:'#')}catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
  document.querySelectorAll('#idx button').forEach(b=>b.classList.toggle('cur',+b.dataset.go===i));
}
$('#bPrev').onclick=()=>go(cur-1);$('#bNext').onclick=()=>go(cur+1);
const dlg=$('#dlg');$('#bIdx').onclick=()=>dlg.showModal();$('#dClose').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
$('#idx').innerHTML=D.parts.map(p=>`<h3>Phần ${p.roman} · ${p.name}</h3>`+S.filter(s=>s.part===p.roman).map(s=>`<button type="button" data-go="${s.n}"><span>${String(s.n).padStart(2,'0')}</span>${s.title}</button>`).join('')).join('')
  +`<h3>Phụ lục</h3><button type="button" data-go="41"><span>PL</span>Hold Point &amp; hiệu chỉnh</button>`;
$('#idx').querySelectorAll('button').forEach(b=>b.onclick=()=>{dlg.close();go(+b.dataset.go)});
addEventListener('keydown',e=>{if(dlg.open||e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key===' '&&anim&&cur>=1&&cur<=TOTAL&&!e.target.closest('button')){e.preventDefault();anim.toggle()}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(TOTAL)});
const fromHash=()=>{const m=/^#s(\d+)$/.exec(location.hash);return m?+m[1]:0};
addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)go(i)});
go(fromHash());
})();
</script>
