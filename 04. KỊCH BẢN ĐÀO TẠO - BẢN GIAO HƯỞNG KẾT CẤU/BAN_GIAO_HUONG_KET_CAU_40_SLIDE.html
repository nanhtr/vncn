óng phủ bạt cách nhiệt bạc bóng, mịn"]], "bim": "<ul><li>Mô phỏng nhiệt FEA (Midas Civil Heat of Hydration / ConcreteWorks): đoạn nhiệt K∞ = 45–50 °C, hệ số α = 0,9–1,2; lưới 0,25 m; khả năng nứt (crack index) I_cr = f_t/σ_t ≥ 1,2 hiển thị <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>; &lt; 1,0 <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><li>Bê tông tươi roughness animate 0.25 → 0.85 trong 6 h thực.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Tổng duyệt (dry-run) logistics 48 h trước đổ: trạm trộn, bơm, giao thông, điện, nước, đá lạnh, đèn, nhân lực 3 ca; chỉ huy trưởng ký \"Pour Permit\".<\/li><li><strong>Điểm mù 1:<\/strong> Một trạm trộn ngừng → khe lạnh. Hợp đồng 2 nhà cung cấp độc lập + kế hoạch khe thi công khẩn cấp đã được thiết kế duyệt trước.<\/li><li><strong>Điểm mù 2:<\/strong> Tháo bạt cách nhiệt quá sớm (gió đêm) gây sốc nhiệt bề mặt.<\/li><li><strong>Điểm mù 3:<\/strong> Ống làm mát không được bơm vữa lấp sau khi hết sử dụng → trở thành đường thấm.<\/li><\/ul>", "quote": "Đổ bảy nghìn khối bê tông trong ba mươi hai giờ không dừng là một cuộc đua với hai đối thủ: thời gian ninh kết và nhiệt thủy hóa. Lõi khối móng sẽ tự nóng lên như một lò phản ứng, và nếu mặt ngoài nguội quá nhanh, chênh lệch hai mươi độ đó sẽ xé toạc bê tông thành những vết nứt xuyên suốt. Hệ ống làm mát và mười tám cảm biến nhiệt này giúp chúng ta điều khiển phản ứng hóa học bên trong — như điều khiển một cỗ máy, chứ không phó mặc cho may rủi.", "sw": ["#30123B", "#39A2FC", "#61FC6C", "#FE9B2D", "#7A0403", "#00B8D4", "#00C853", "#D50000"], "scene": "heat", "opts": {"mode": "thermal"}}, {"n": 13, "title": "Tháo hệ chống tạm, nghiệm thu kết cấu ngầm và chuyển giai đoạn thân tháp", "code": "EPC-SPEC-13-SUB", "dur": "15 000 ms", "part": "II", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 4453:1995 / TCVN 5574:2018<\/td><td>Nghiệm thu kết cấu BTCT<\/td><\/tr><tr><td>ACI 318-19 §26.12 / ASTM C42 / TCVN 12252:2020<\/td><td>Khoan lõi đánh giá cường độ<\/td><\/tr><tr><td>TCVN 9357:2012 / ASTM C597<\/td><td>Siêu âm bê tông<\/td><\/tr><tr><td>Nghị định 06/2021/NĐ-CP<\/td><td>Nghiệm thu giai đoạn chuyển bước thi công<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Cường độ bê tông móng tối thiểu trước khi tháo chống<\/td><td>≥ 70% f'c thiết kế <strong>và<\/strong> theo trình tự tháo chống thiết kế duyệt<\/td><td>Nén mẫu bảo dưỡng hiện trường<\/td><td>H<\/td><\/tr><tr><td>Đánh giá cường độ mẫu tiêu chuẩn<\/td><td>Trung bình 3 tổ liên tiếp ≥ f'c; không tổ nào &lt; f'c − 3,5 MPa (ACI 318) / theo TCVN 5574<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Khoan lõi khi có nghi ngờ<\/td><td>Trung bình 3 lõi ≥ 0,85 f'c, không lõi nào &lt; 0,75 f'c<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Kích thước mặt bằng móng<\/td><td>±20 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Cao độ mặt móng<\/td><td>±10 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Vết nứt bề mặt<\/td><td>w ≤ 0,2 mm (môi trường ngầm ẩm); w &gt; 0,2 mm phải bơm epoxy/PU<\/td><td>Kính đo vết nứt<\/td><td>W<\/td><\/tr><tr><td>Siêu âm UPV<\/td><td>≥ 4,0 km/s (chất lượng tốt)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Thấm nước tường vây<\/td><td>Cấp BS 8102: không vệt ướt chảy nước ở tầng kỹ thuật (Grade 3); vết ẩm ≤ 0,1 m² mỗi 100 m² cho tầng đỗ xe (Grade 1–2)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Trình tự tháo chống<\/td><td>Đối xứng, giảm tải 25% – 50% – 100% mỗi bước, quan trắc lực/chuyển vị sau mỗi bước<\/td><td>Chuyển vị tăng thêm ≤ 5 mm<\/td><td>H<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Nén mẫu, siêu âm và khoan lõi xác nhận cường độ; tháo chống khi bê tông đạt ≥ 70% f'c và sàn hầm thay thế đã đủ cường độ.", "Tháo thanh chống đối xứng theo 3 bước giảm tải, quan trắc chuyển vị tường vây tăng thêm ≤ 5 mm.", "Hồ sơ hoàn công phần ngầm (As-built, BIM LOD 500 phần ngầm) — nghiệm thu chuyển giai đoạn sang phần thân."], "vis": "<ul><li><strong>Cinematic Crane Shot:<\/strong> camera bắt đầu sát mặt móng (ống kính 21 mm), bay ngược thẳng lên qua 5 tầng hầm và ra khỏi miệng hố, ánh nắng sáng sớm 7h xiên 25° chiếu vào mặt bê tông.<\/li><li>Thanh chống <code class=\"hex\"><i style=\"background:#F2B705\"><\/i>#F2B705<\/code> được cẩu ra; tia lửa máy cắt plasma cam trắng <code class=\"hex\"><i style=\"background:#FFE0B2\"><\/i>#FFE0B2<\/code> bắn ra hình nón 60°.<\/li><\/ul>", "tl": [[0, 2000, "Máy nén mẫu ép vỡ mẫu trụ, đồng hồ <code>62,4 MPa ≥ 0,7 f'c<\/code>"], [2000, 4500, "Thợ kích xả tải thanh chống (đồng hồ 100% → 50% → 0%), cắt plasma chốt liên kết"], [4500, 7000, "Cẩu nhấc thanh chống bay lên khỏi hố, xếp bãi; inclinometer cập nhật <code>+3 mm<\/code>"], [7000, 10000, "Camera bay lên, lộ toàn bộ khung kết cấu ngầm sạch sẽ; đường viền BIM As-built khớp"], [10000, 12000, "Con dấu kỹ thuật số \"SUBSTRUCTURE ACCEPTED\" <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>; chuyển cảnh match-cut sang thân lõi đầu tiên mọc lên"]], "bim": "<ul><li>Lớp so sánh As-built vs Design (point cloud deviation): ±5 mm <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, ±5–15 mm <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, &gt; ±15 mm <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Biên bản nghiệm thu hoàn thành phần ngầm + kế hoạch quan trắc dài hạn được ký trước khi bắt đầu tầng 1.<\/li><li><strong>Điểm mù 1:<\/strong> Tháo chống trước khi sàn hầm (đóng vai trò thanh chống vĩnh cửu) đạt cường độ → tường vây dịch chuyển đột ngột.<\/li><li><strong>Điểm mù 2:<\/strong> Kiểm tra đẩy nổi tầng hầm khi đã dừng bơm nước mà tải trọng phần thân chưa đủ — giữ hạ nước hoạt động đến khi trọng lượng công trình ≥ 1,1 × lực đẩy nổi.<\/li><li><strong>Điểm mù 3:<\/strong> Lỗ cột chống tạm (king post) xuyên sàn đáy chưa được bịt chống thấm.<\/li><\/ul>", "quote": "Phần ngầm đã khép lại — một khối kiến trúc mà sau hôm nay không ai còn nhìn thấy nữa, nhưng nó sẽ gánh tòa tháp suốt một thế kỷ. Chúng ta tháo từng thanh chống theo đúng trình tự đã tính, đối xứng, từng nấc tải, và nhìn chằm chằm vào số liệu quan trắc sau mỗi bước. Và xin nhớ: đừng tắt máy bơm hạ nước chỉ vì móng đã xong — chừng nào tòa nhà chưa đủ nặng, nước ngầm vẫn muốn đẩy nó lên.", "sw": ["#F2B705", "#FFE0B2", "#00C853", "#FFAB00", "#D50000"], "scene": "strata", "opts": {"excav": 1, "unstrut": 1}}, {"n": 14, "title": "Tháp cẩu tự leo (Tower Crane) và vận thăng lồng (Construction Hoist)", "code": "EPC-SPEC-14-CRN", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 4244:2005<\/td><td>Thiết bị nâng — thiết kế, chế tạo và kiểm tra kỹ thuật<\/td><\/tr><tr><td>QCVN 7:2012/BLĐTBXH<\/td><td>An toàn lao động thiết bị nâng<\/td><\/tr><tr><td>EN 14439:2006+A2:2009 / ISO 4301-1<\/td><td>Cẩu tháp; phân nhóm chế độ làm việc<\/td><\/tr><tr><td>EN 12159:2012<\/td><td>Vận thăng lồng chở người và vật liệu<\/td><\/tr><tr><td>ISO 12480-1<\/td><td>Sử dụng an toàn cần trục<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Cẩu tháp chính (luffing/flat-top tự leo trong lõi)<\/td><td>Tầm với 60–70 m; sức nâng đầu cần 3,5–5 t; sức nâng max 16–24 t<\/td><td>Biểu đồ tải không vượt 100%<\/td><td>R<\/td><\/tr><tr><td>Thử tải tĩnh / động<\/td><td>125% / 110% sức nâng định mức (TCVN 4244)<\/td><td>Không biến dạng dư<\/td><td><strong>H<\/strong> — Kiểm định viên độc lập<\/td><\/tr><tr><td>Độ thẳng đứng thân cẩu<\/td><td>≤ 1/1 000 dưới điểm neo; ≤ 2/1 000 phần tự do<\/td><td>Đo kinh vĩ 2 phương<\/td><td>W<\/td><\/tr><tr><td>Khoảng cách neo thân cẩu vào kết cấu<\/td><td>Mỗi 3–4 tầng (≈ 12–16 m) theo nhà sản xuất<\/td><td>Neo vào sàn ≥ 70% f'c<\/td><td>H<\/td><\/tr><tr><td>Chiều cao tự do trên neo cuối<\/td><td>≤ giá trị nhà sản xuất (thường 40–60 m)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Gió dừng làm việc<\/td><td>≥ 20 m/s (72 km/h) giật; dừng leo/tháo lắp ≥ 12,5 m/s<\/td><td>Phong kế trên đỉnh cần, báo động 2 cấp<\/td><td>W<\/td><\/tr><tr><td>Vận thăng lồng đôi<\/td><td>Tải 2 × 2 000 kg; tốc độ 60–100 m/min<\/td><td>Bộ hãm dù (safety device) kích hoạt ở ≤ 1,4 × tốc độ định mức; thử rơi 3 tháng/lần<\/td><td>H<\/td><\/tr><tr><td>Neo vận thăng<\/td><td>Mỗi 6–9 m chiều cao<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Hệ chống va chạm nhiều cẩu (anti-collision)<\/td><td>Bắt buộc khi vùng quay chồng lấn; giảm tốc ở 10 m, dừng ở 5 m<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Công tắc giới hạn (Limit switches)<\/td><td>Chiều cao móc, tầm với, quay, mômen tải ở 90% cảnh báo, 105% ngắt<\/td><td>Kiểm tra hằng ngày<\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Cẩu tháp tự leo trong lõi, tầm với 65 m, thử tải tĩnh 125% / động 110% bởi kiểm định viên độc lập trước vận hành.", "Vận thăng lồng đôi 2 × 2 t, 100 m/min, bộ hãm dù tự động kích hoạt ở ≤ 1,4 × tốc độ định mức, thử rơi định kỳ 3 tháng.", "Phong kế, hệ chống va chạm và công tắc giới hạn mômen 90%/105% — dừng cẩu khi gió giật ≥ 20 m/s."], "vis": "<ul><li><strong>Low-angle Hero Shot:<\/strong> camera đặt sát mặt đất, ống kính 12 mm, ngước thẳng lên; thân cẩu <code class=\"hex\"><i style=\"background:#F2B705\"><\/i>#F2B705<\/code> vươn vào mây cumulus, mặt trời sau cần tạo lens flare.<\/li><li><strong>Close-up Climbing Cage:<\/strong> ống kính 50 mm, f/2.8, ty thủy lực chrome <code class=\"hex\"><i style=\"background:#B8BDC4\"><\/i>#B8BDC4<\/code> đẩy lên 40 mm/s; chốt an toàn bập vào \"cách\" — đồng bộ âm thanh tại frame chính xác.<\/li><\/ul>", "tl": [[0, 2000, "Tilt-up từ chân cẩu đến đỉnh, cần quay chậm 0,6 vòng/phút"], [2000, 4500, "Kích thủy lực đẩy cụm quay lên 1 đốt (3 m), đồng hồ áp lực <code>28 MPa<\/code>"], [4500, 6500, "Đốt thân mới 3 m trượt vào khung leo trên ray đẩy; 8 bu lông chốt siết — mỗi bu lông sáng xanh trễ 120 ms"], [6500, 8500, "Khung neo ôm thân cẩu, kẹp vào vách lõi BTCT; nhãn <code>TIE-IN #07 @ L24<\/code>"], [8500, 10500, "Vận thăng lồng chạy song song lên 100 m/min; thử bộ hãm dù — lồng dừng trong 0,9 m"], [10500, 12000, "Màn hình cabin: biểu đồ tải 74% <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, gió 9,2 m/s"]], "bim": "<ul><li>Vùng quét cần: bán kính 65 m <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code> 12%; vùng cấm quay (no-fly zone qua trường học, đường sắt) <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> 25%.<\/li><li>Biểu đồ tải: tải hiện tại <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>, đường cong giới hạn <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Giấy chứng nhận kiểm định + giấy phép người vận hành + kế hoạch nâng cho mỗi lần leo cẩu.<\/li><li><strong>Điểm mù 1:<\/strong> Tải trọng do cẩu tác dụng lên lõi và sàn tại điểm neo/khung leo không có trong thiết kế kết cấu — phải được kỹ sư kết cấu kiểm tra.<\/li><li><strong>Điểm mù 2:<\/strong> Cẩu tự quay tự do (weathervaning) khi hết ca bị cản bởi cẩu khác/công trình lân cận.<\/li><li><strong>Điểm mù 3:<\/strong> Tín hiệu viên không có liên lạc vô tuyến kênh riêng khi nâng mù (blind lift).<\/li><\/ul>", "quote": "Tháp cẩu và vận thăng là đôi cánh tay và mạch máu của công trường cao tầng — mỗi ngày chúng nâng hai trăm tấn vật liệu và năm trăm con người lên bầu trời. Mỗi lần cẩu tự leo là một ca phẫu thuật được lên kịch bản chính xác đến từng chốt. Và quy tắc ở đây không có ngoại lệ: gió giật chạm hai mươi mét mỗi giây, mọi móc cẩu đều phải dừng, dù tiến độ có gấp đến đâu.", "sw": ["#F2B705", "#B8BDC4", "#FFAB00", "#D50000", "#00B8D4"], "scene": "tower", "opts": {"mode": "crane"}}, {"n": 15, "title": "Lõi cứng trung tâm (Core-Wall) bằng ván khuôn leo thủy lực tự động", "code": "EPC-SPEC-15-COR", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ACI 347R-14<\/td><td>Hướng dẫn ván khuôn bê tông<\/td><\/tr><tr><td>ACI 347.3R-13<\/td><td>Bề mặt bê tông tạo hình (phân loại CSC)<\/td><\/tr><tr><td>TCVN 4453:1995<\/td><td>Ván khuôn, cốt thép, bê tông toàn khối<\/td><\/tr><tr><td>EN 12812 / EN 12811<\/td><td>Giàn chống và sàn công tác tạm<\/td><\/tr><tr><td>EN 81-20 §5.2<\/td><td>Dung sai giếng thang máy<\/td><\/tr><tr><td>ACI 117-10<\/td><td>Dung sai thi công<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Chu kỳ leo lõi (jump-form)<\/td><td>1 tầng (3,6 m) / 3–4 ngày, đi trước sàn 3–5 tầng<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Phương án trượt liên tục (slipform)<\/td><td>150–300 mm/h (≈ 4–6 m/ngày)<\/td><td>Bê tông ra khuôn đạt 0,1–0,3 MPa<\/td><td>R<\/td><\/tr><tr><td>Cường độ bê tông tại côn neo trước khi leo<\/td><td>≥ 10–15 MPa (theo nhà sản xuất hệ leo)<\/td><td>Mẫu bảo dưỡng cạnh khuôn<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Độ lệch trục đứng mỗi tầng<\/td><td>≤ ±5 mm<\/td><td>Plumb laser 4 điểm<\/td><td>W<\/td><\/tr><tr><td>Độ lệch đứng tích lũy lõi<\/td><td>≤ H/2 000, tối đa 50 mm qua 55 tầng<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Giếng thang máy (EN 81-20)<\/td><td>Kích thước thông thủy dung sai 0 / +25 mm (H ≤ 30 m); 0 / +35 mm (30–60 m); 0 / +50 mm (60–90 m) — đo theo từng đoạn<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Chiều dày vách<\/td><td>−5 / +10 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Vị trí lỗ mở cửa<\/td><td>±10 mm; hộp chờ / bản mã chờ ±10 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Gió dừng leo<\/td><td>≥ 72 km/h (20 m/s)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Bề mặt bê tông lõi<\/td><td>CSC2 (ACI 347.3R) — cho phép sơn trực tiếp<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Ván khuôn leo thủy lực tự động (ACS) 4 sàn công tác, leo không cần cẩu, chu kỳ 3–4 ngày/tầng, đi trước sàn 3–5 tầng.", "Cuốn chiếu cốt thép vách, hộp chờ dầm/sàn, bản mã chờ; leo chỉ khi bê tông tại côn neo ≥ 10–15 MPa.", "Kiểm soát thẳng đứng bằng plumb laser: ±5 mm/tầng, tích lũy ≤ H/2 000; giếng thang đạt dung sai EN 81-20."], "vis": "<ul><li><strong>Cinematic Cross-section Interior:<\/strong> mặt cắt ngang xuyên lõi, camera đặt trong giếng thang rỗng, ống kính 16 mm nhìn lên 45°.<\/li><li>Giàn leo <code class=\"hex\"><i style=\"background:#FF6D00\"><\/i>#FF6D00<\/code> 4 tầng, sàn lưới thép, ty thủy lực chrome; ván khuôn phủ film <code class=\"hex\"><i style=\"background:#5D4037\"><\/i>#5D4037<\/code>. Ánh sáng: LED dây trên giàn 4 000 K + tia nắng xuyên qua từ đỉnh.<\/li><li>Ô cửa quan sát: thợ đầm dùi, rung lan truyền như sóng trên mặt bê tông.<\/li><\/ul>", "tl": [[0, 1500, "Ván khuôn tách khỏi vách (lùi 600 mm trên ray)"], [1500, 4500, "12 xi lanh đồng bộ đẩy toàn hệ lên 3,6 m (sai lệch đồng bộ ≤ 5 mm hiển thị); thanh leo bám côn neo mới"], [4500, 7000, "Lưới thép vách tiền chế được cẩu hạ, coupler nối; hộp chờ <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> gắn đúng cao độ"], [7000, 10000, "Ván khuôn đóng lại, bơm bê tông lấp đầy theo lớp 500 mm"], [10000, 12000, "Plumb laser chiếu bia: <code>Δ = +2 mm<\/code> PASS; bộ đếm <code>CORE L28 — CYCLE 3.5 DAYS<\/code>"]], "bim": "<ul><li>Độ lệch lõi theo chiều cao (BIM vs đo): đường đo <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>, ống dung sai ±H/2 000 <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, ống EN 81-20 <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>.<\/li><li>Tải gió lên giàn leo: mũi tên <code class=\"hex\"><i style=\"background:#90A4AE\"><\/i>#90A4AE<\/code>, áp lực thiết kế khi leo ≤ 0,2 kPa (≈ 72 km/h).<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Mỗi lần leo: kiểm tra côn neo, cường độ bê tông, dọn vật rơi, phong kế; trưởng ca ký \"Climb Permit\".<\/li><li><strong>Điểm mù 1:<\/strong> Hộp chờ thép dầm/sàn bị bê tông lấp hoặc lệch → phải khoan cấy thép hàng loạt. Dùng hộp chờ có nắp và đối chiếu BIM trước khi đóng khuôn.<\/li><li><strong>Điểm mù 2:<\/strong> Lõi đi trước sàn quá xa làm lõi đứng tự do chịu gió vượt thiết kế (kiểm tra ổn định tạm thời).<\/li><li><strong>Điểm mù 3:<\/strong> Co ngắn khác biệt lõi – cột (xem Slide 5) không được bù khi định vị bản mã chờ.<\/li><\/ul>", "quote": "Lõi cứng là cột sống của tòa tháp, và hệ ván khuôn leo thủy lực là trái tim đập đều đặn cứ ba ngày rưỡi một nhịp, đẩy cột sống đó lên thêm một tầng mà không cần một móc cẩu. Nó đi trước, độc lập, kéo cả công trường theo sau. Nhưng mỗi mi-li-mét nghiêng ở đây là một mi-li-mét mà thang máy mười mét mỗi giây phải chịu đựng — vì thế chúng ta leo theo laser, không leo theo cảm giác.", "sw": ["#FF6D00", "#5D4037", "#00B8D4", "#00C853", "#7E57C2", "#90A4AE"], "scene": "tower", "opts": {"mode": "core"}}, {"n": 16, "title": "Hệ dầm cột sàn bê tông cốt thép toàn khối (Cast-in-place RC System)", "code": "EPC-SPEC-16-SLB", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 5574:2018<\/td><td>Thiết kế kết cấu BTCT<\/td><\/tr><tr><td>TCVN 4453:1995<\/td><td>Thi công và nghiệm thu BTCT toàn khối<\/td><\/tr><tr><td>ACI 117-10 / ASTM E1155<\/td><td>Dung sai, độ phẳng sàn F-number<\/td><\/tr><tr><td>ACI 347.2R<\/td><td>Chống và chống lại (shoring/reshoring) nhà nhiều tầng<\/td><\/tr><tr><td>TCVN 3105 / 3118<\/td><td>Lấy mẫu, nén mẫu<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Cấp độ bền<\/td><td>Sàn B30–B35; cột tầng dưới B50–B60<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Chiều dày sàn điển hình<\/td><td>200–250 mm<\/td><td>−5 / +10 mm<\/td><td>W<\/td><\/tr><tr><td>Cao độ mặt sàn<\/td><td>±10 mm so với cao độ thiết kế (đã cộng bù co ngắn)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ phẳng sàn<\/td><td>≤ 5 mm/3 m (thước nhôm) hoặc FF 35 / FL 25 tổng thể<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Kích thước tiết diện cột/dầm<\/td><td>−5 / +10 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ thẳng đứng cột mỗi tầng<\/td><td>≤ ±8 mm (Spec dự án)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Lớp bảo vệ sàn (REI 120)<\/td><td>25–35 mm<\/td><td>−5 / +10 mm<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Lấy mẫu bê tông<\/td><td>1 tổ / 20 m³ cho kết cấu khung, dầm, sàn (TCVN 4453); tối thiểu 1 tổ/ngày/mỗi cấp bê tông<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Tháo ván khuôn đáy sàn (TCVN 4453 Bảng 3)<\/td><td>Nhịp ≤ 2 m: ≥ 50% R28; 2–8 m: ≥ 70%; &gt; 8 m: ≥ 90%<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Chống lại (reshore)<\/td><td>Duy trì 2–3 tầng dưới tầng đang đổ<\/td><td>Tải mỗi tầng ≤ khả năng sàn tại tuổi tương ứng<\/td><td>R<\/td><\/tr><tr><td>Độ sụt bơm cao<\/td><td>160–200 mm; dùng bơm tĩnh áp lực cao ≥ 20 MPa cho cao độ &gt; 150 m<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Giàn chống định hình + xà gồ nhôm; chống lại 2–3 tầng dưới theo tính toán ACI 347.2R.", "Cốt thép dầm sàn hai lớp theo shop drawing LOD 400; lớp bảo vệ 25–35 mm đạt chịu lửa REI 120.", "Đổ bằng cần phân phối thủy lực (placing boom), đầm dùi, xoa máy; cao độ ±10 mm, độ phẳng ≤ 5 mm/3 m."], "vis": "<ul><li><strong>Wide Aerial Panorama:<\/strong> drone quỹ đạo 120° quanh tầng đang thi công, ống kính 24 mm, giờ xanh (blue hour) với ánh đèn công trường ấm 3 200 K.<\/li><li>Cần phân phối 32 m đỏ <code class=\"hex\"><i style=\"background:#C62828\"><\/i>#C62828<\/code> xoay, dòng bê tông <code class=\"hex\"><i style=\"background:#6E6A64\"><\/i>#6E6A64<\/code> chảy; máy xoa bàn tạo vân vòng cung bóng loáng (roughness 0.2).<\/li><\/ul>", "tl": [[0, 2000, "Giàn chống và ván khuôn sàn lắp kín ô sàn theo kiểu \"lát gạch\" mỗi tấm trễ 15 ms"], [2000, 4500, "Lưới thép dưới, con kê, ống điện âm sàn <code class=\"hex\"><i style=\"background:#FBC02D\"><\/i>#FBC02D<\/code>, lưới thép trên lần lượt hiện"], [4500, 8500, "Bê tông lan theo dải 6 m, đầm dùi rung, thước laser tự động cân mặt (laser screed)"], [8500, 10500, "Máy xoa chạy, mặt sàn chuyển từ xám ướt sang mờ"], [10500, 12000, "Bản đồ cao độ quét laser: 96% điểm trong ±5 mm <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>"]], "bim": "<ul><li>Bản đồ độ phẳng sàn: ±3 mm <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, ±3–8 mm <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, &gt; ±8 mm <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><li>Tải thi công phân bố qua các tầng chống lại: thanh màu theo η (Turbo).<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Nghiệm thu cốt thép + ống chờ MEP + lỗ mở sàn trước khi đổ (có ảnh 360° lưu CDE).<\/li><li><strong>Điểm mù 1:<\/strong> Lỗ mở sàn cho MEP bị bỏ sót → khoan cắt sau làm đứt thép chịu lực. Dùng bản vẽ lỗ mở tổng hợp (combined builders work drawing).<\/li><li><strong>Điểm mù 2:<\/strong> Sàn tuổi non chịu tải chồng tầng (stacking loads) vượt khả năng — phải có bản tính chống lại.<\/li><li><strong>Điểm mù 3:<\/strong> Bê tông cột cường độ cao giao với sàn cường độ thấp — đổ \"puddling\" vùng nút cột bằng bê tông cột (ACI 318 §15.5) khi f'c cột &gt; 1,4 f'c sàn.<\/li><\/ul>", "quote": "Mỗi tầng nhà mọc lên là một vòng tuần hoàn khép kín của kỷ luật: chống, khuôn, thép, MEP chờ, bê tông, bảo dưỡng, tháo, luân chuyển. Không một bước nào được nhảy cóc, vì sai sót ở tầng mười sẽ lặp lại bốn mươi lăm lần nữa ở các tầng trên. Và hãy để ý vùng nút cột — nơi bê tông sáu mươi MPa gặp bê tông ba mươi lăm MPa — đó là chỗ một kỹ sư giỏi luôn dừng lại kiểm tra.", "sw": ["#C62828", "#6E6A64", "#00C853", "#FFAB00", "#D50000"], "scene": "tower", "opts": {"mode": "build"}}, {"n": 17, "title": "Sàn căng cáp dự ứng lực (Post-Tensioned Slab) vượt nhịp lớn không dầm", "code": "EPC-SPEC-17-PTS", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ACI 318-19 Ch. 8, §20.3, §25.8–25.9<\/td><td>Sàn hai phương ứng suất trước, giới hạn ứng suất cáp, vùng neo<\/td><\/tr><tr><td>PTI M10.3 / PTI TAB.1<\/td><td>Hướng dẫn thiết kế và thi công sàn PT<\/td><\/tr><tr><td>PTI M55.1-19<\/td><td>Vữa bơm cho cáp dính kết<\/td><\/tr><tr><td>ASTM A416/A416M<\/td><td>Cáp 7 sợi cấp 270 (1 860 MPa)<\/td><\/tr><tr><td>EN 13391 / ETAG 013<\/td><td>Hệ neo cáp ứng suất trước<\/td><\/tr><tr><td>ACI 117-10 §2.2<\/td><td>Dung sai vị trí cáp<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Cáp<\/td><td>7 sợi Ø 15,2 mm, low-relaxation, f_pu = 1 860 MPa, F_pu = 260,7 kN<\/td><td>Chứng chỉ mỗi lô<\/td><td>R<\/td><\/tr><tr><td>Ứng suất kích<\/td><td>≤ 0,80 f_pu và ≤ 0,94 f_py (ACI 318); thực tế 0,75–0,78 f_pu<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Ứng suất ngay sau neo<\/td><td>≤ 0,70 f_pu<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Cường độ bê tông khi căng<\/td><td>≥ 75% f'c (Spec: ≥ 25 MPa) — căng sơ bộ 25% lực ở 12–24 h chống nứt co ngót<\/td><td>Mẫu bảo dưỡng hiện trường<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Độ giãn dài đo vs tính toán<\/td><td>±7% (PTI); vượt ±7% phải dừng và điều tra<\/td><td>Đo từng cáp<\/td><td>H<\/td><\/tr><tr><td>Tụt neo (wedge draw-in)<\/td><td>6 ± 2 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Dung sai cao độ cáp<\/td><td>±6 mm với tiết diện ≤ 200 mm; ±10 mm với 200–600 mm (ACI 117)<\/td><td>Đo ghế đỡ cáp mỗi 1 m<\/td><td>W<\/td><\/tr><tr><td>Ứng suất nén trước trung bình<\/td><td>≥ 0,9 MPa (ACI 318), khuyến nghị 1,0–2,5 MPa<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Nhịp / chiều dày<\/td><td>12–15 m / 250–300 mm (L/45–L/50)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Vữa bơm<\/td><td>Tách nước 0% (PTI M55.1), cường độ ≥ 30 MPa @ 7 ngày (Spec), thời gian chảy côn 5–30 s<\/td><td>Bơm trong ≤ 7 ngày sau căng<\/td><td>H<\/td><\/tr><tr><td>Độ vồng sau căng<\/td><td>Theo tính toán ±5 mm<\/td><td>Đo cao độ trước/sau<\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Cáp 7 sợi Ø15,2 mm trong ống gen dẹt, profile parabol theo biểu đồ mômen; dung sai cao độ ±6 mm.", "Căng khi bê tông ≥ 75% f'c (≥ 25 MPa), kích ≤ 0,80 f_pu, độ giãn dài sai lệch ≤ ±7% so với tính toán.", "Bơm vữa không tách nước (PTI M55.1) trong vòng 7 ngày, bảo vệ cáp chống ăn mòn suốt tuổi thọ công trình."], "vis": "<ul><li><strong>Macro Close-up X-Ray Slab:<\/strong> cắt lớp sàn bằng mặt phẳng phát sáng, camera 65 mm, f/4, dolly dọc theo cáp.<\/li><li>Bó cáp <code class=\"hex\"><i style=\"background:#B8BDC4\"><\/i>#B8BDC4<\/code> uốn parabol trong ống gen tôn <code class=\"hex\"><i style=\"background:#F2B705\"><\/i>#F2B705<\/code> mờ 40%; đầu neo đúc <code class=\"hex\"><i style=\"background:#455A64\"><\/i>#455A64<\/code> với nêm 3 mảnh.<\/li><li>Kích căng tâm rỗng với tia laser đo hành trình <code class=\"hex\"><i style=\"background:#1DE9B6\"><\/i>#1DE9B6<\/code> và màn hình số độ giãn dài.<\/li><\/ul>", "tl": [[0, 2000, "Ghế đỡ cáp nhiều cao độ (20–230 mm) cắm xuống; cáp luồn theo đường parabol, nhãn cao độ"], [2000, 4000, "Bê tông bao phủ (dissolve sang X-ray)"], [4000, 7500, "Kích kéo căng: lực 0 → 195 kN; độ giãn dài 0 → 98 mm (tính toán 102 mm, sai lệch −3,9% PASS); dải ứng suất đỏ <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code> chạy dọc cáp"], [7500, 10000, "Sàn vồng lên (phóng đại ×300) và đường ứng suất nén màu xanh <code class=\"hex\"><i style=\"background:#2166AC\"><\/i>#2166AC<\/code> lan ra toàn bản; nêm cắn vào cáp — tụt neo 6 mm"], [10000, 12000, "Vữa bơm <code class=\"hex\"><i style=\"background:#E0E0E0\"><\/i>#E0E0E0<\/code> chảy lấp ống gen từ đầu thấp lên đầu cao, ống xả khí phun vữa đặc"]], "bim": "<ul><li>Ứng suất bê tông sàn sau căng (thang phân kỳ): nén −3 MPa <code class=\"hex\"><i style=\"background:#2166AC\"><\/i>#2166AC<\/code> → 0 <code class=\"hex\"><i style=\"background:#F7F7F7\"><\/i>#F7F7F7<\/code> → kéo +2 MPa <code class=\"hex\"><i style=\"background:#B2182B\"><\/i>#B2182B<\/code> (giới hạn kéo 0,5√f'c).<\/li><li>Profile cáp: đường thiết kế <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> nét đứt, đường thực đo <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Biên bản căng từng cáp (lực, độ giãn dài, tụt neo) phải được kỹ sư PT ký trước khi cắt đuôi cáp.<\/li><li><strong>Điểm mù 1:<\/strong> Khoan cấy bu lông/khoan lỗ MEP sau này cắt đứt cáp — đánh dấu vĩnh viễn vị trí cáp trên trần, cấm khoan &gt; 50 mm khi chưa quét GPR.<\/li><li><strong>Điểm mù 2:<\/strong> Sàn PT bị ràng buộc bởi vách cứng làm mất lực nén trước và nứt (restraint cracking) — bố trí khe trượt/dải đổ sau (pour strip).<\/li><li><strong>Điểm mù 3:<\/strong> Rỗ bê tông sau vùng neo dẫn đến vỡ khi căng — đầm kỹ vùng neo, thép xoắn chống bửa (bursting).<\/li><\/ul>", "quote": "Công nghệ dự ứng lực là nghệ thuật đặt lực vào đúng nơi bê tông cần nó: dây cáp uốn theo đường parabol để đẩy ngược mômen uốn của chính trọng lượng sàn. Nhờ đó chúng ta có những nhịp mười lăm mét không dầm, không cột — tự do tuyệt đối cho kiến trúc nội thất. Nhưng đổi lại, mỗi sợi cáp mang hai trăm kilonewton chỉ cách mặt trần vài centimet; nên quy tắc vàng cho mọi người vận hành sau này là: không khoan khi chưa quét.", "sw": ["#B8BDC4", "#F2B705", "#455A64", "#1DE9B6", "#2166AC", "#F7F7F7", "#B2182B", "#FFC400", "#00E5FF"], "scene": "cable", "opts": {}}, {"n": 18, "title": "Cột ống thép nhồi bê tông (CFT — Concrete Filled Steel Tube) cho khối đế", "code": "EPC-SPEC-18-CFT", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>AISC 360-22 Chương I<\/td><td>Thiết kế cấu kiện liên hợp (composite)<\/td><\/tr><tr><td>AISC 303-22<\/td><td>Quy tắc thực hành — dung sai lắp dựng thép<\/td><\/tr><tr><td>AWS D1.1/D1.1M:2020<\/td><td>Hàn kết cấu thép, kiểm tra UT<\/td><\/tr><tr><td>EN 1994-1-1 (Eurocode 4)<\/td><td>Kết cấu liên hợp thép – bê tông (đối chiếu)<\/td><\/tr><tr><td>GB/T 1591 (Q355B) / JIS G3106 (SM490)<\/td><td>Mác thép<\/td><\/tr><tr><td>EN 206 / EN 12350-8, -10, -12 / ASTM C1611<\/td><td>Bê tông tự đầm SCC<\/td><\/tr><tr><td>TCVN 5575:2024<\/td><td>Thiết kế kết cấu thép<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Ống thép<\/td><td>Ø 1 200 × 30 mm hoặc hộp 1 000 × 1 000 × 32, Q355B / SM490<\/td><td>Tỷ lệ thép ρ_s ≥ 1% (AISC I2.2)<\/td><td>R<\/td><\/tr><tr><td>Độ mảnh thành ống<\/td><td>Tròn: D/t ≤ 0,15 E/F_y (compact); Hộp: b/t ≤ 2,26 √(E/F_y)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Bê tông lõi<\/td><td>SCC B50 (≈ M650–700)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Slump-flow SCC<\/td><td>650–750 mm (SF2), T500 = 2–5 s, J-ring chênh ≤ 50 mm, chỉ số phân tầng VSI ≤ 1<\/td><td>Mỗi xe<\/td><td>W<\/td><\/tr><tr><td>Bơm từ chân cột<\/td><td>Van một chiều tại cổng bơm, áp lực theo dõi ≤ thiết kế ống (kiểm tra phình ống)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Lỗ thoát hơi<\/td><td>Ø 20 mm, 2 lỗ/tầng tại đầu và chân cột (thoát hơi nước khi cháy)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Mối hàn nối cột<\/td><td>CJP, kiểm tra UT 100% (AWS D1.1), MT 10%<\/td><td>Không khuyết tật vượt chuẩn chấp nhận Bảng 8.2 / 8.3<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Độ thẳng đứng cột<\/td><td>≤ 1/500 giữa các mối nối; cột biên ≤ 25 mm về phía ranh giới và ≤ 50 mm ra ngoài trong 20 tầng đầu (AISC 303)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Cao độ mối nối<\/td><td>±5 mm (Spec), có bù co ngắn<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ đặc lõi bê tông<\/td><td>Gõ búa / siêu âm xuyên ống: không có vùng rỗng tách lớp &gt; 3 mm<\/td><td>100% cột<\/td><td>H<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Cẩu lắp đốt cột ống thép Q355B, nối hàn CJP kiểm tra UT 100% theo AWS D1.1.", "Bơm bê tông tự đầm SCC B50 từ chân cột (slump-flow 650–750 mm) — không đầm, không rỗ khí, không phân tầng.", "Hiệu ứng bó (confinement) của vỏ thép và khả năng chống mất ổn định của lõi bê tông: cột nhỏ hơn 30–40% so với BTCT cùng tải."], "vis": "<ul><li><strong>Eye-level Action Shot:<\/strong> ống kính 35 mm, f/2.8, cột thép <code class=\"hex\"><i style=\"background:#C1440E\"><\/i>#C1440E<\/code> hạ xuống trong khung; 4 thợ hàn lóe hồ quang xanh trắng <code class=\"hex\"><i style=\"background:#E1F5FE\"><\/i>#E1F5FE<\/code> bloom 3.0, tia lửa particle trọng lực thật.<\/li><li>Mặt cắt X-ray: SCC <code class=\"hex\"><i style=\"background:#7D7A74\"><\/i>#7D7A74<\/code> dâng từ dưới lên, mặt dòng chảy tự san phẳng (self-levelling), bọt khí bị đẩy ra lỗ thoát.<\/li><\/ul>", "tl": [[0, 2500, "Cẩu hạ đốt cột 12 m (3 tầng), bản mã dẫn hướng (erection lug) khớp; nêm căn chỉnh"], [2500, 5500, "Robot hàn quỹ đạo chạy vòng chu vi, 6 lượt hàn (mỗi lượt đổi màu nhiệt <code>#FFE0B2 → #FF6D00 → #3E2723<\/code>)"], [5500, 7000, "Đầu dò UT quét mối hàn, ảnh A-scan sạch, <code>UT 100% — ACCEPT<\/code>"], [7000, 10500, "SCC bơm vào từ cổng chân cột, mặt bê tông dâng 3 tầng; áp lực bơm <code>2,8 MPa<\/code>"], [10500, 12000, "Mặt cắt hiển thị ứng suất bó (hoop stress) trong vỏ thép <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code> và lõi bê tông chịu nén 3 trục <code class=\"hex\"><i style=\"background:#2166AC\"><\/i>#2166AC<\/code>"]], "bim": "<ul><li>Mô hình FEA cột liên hợp: thép đàn dẻo tuyến tính, bê tông mô hình Concrete Damaged Plasticity; hệ số bó K_e hiển thị.<\/li><li>Sơn chống gỉ <code class=\"hex\"><i style=\"background:#C1440E\"><\/i>#C1440E<\/code>; sơn chống cháy intumescent sau khi lắp <code class=\"hex\"><i style=\"background:#ECEFF1\"><\/i>#ECEFF1<\/code> (dày 1,5–3,0 mm cho R120).<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> UT mối hàn trước khi bơm bê tông; bơm thử áp lực trên cột mẫu (mock-up) để kiểm tra phình ống.<\/li><li><strong>Điểm mù 1:<\/strong> Bản sàn/dầm liên kết với cột CFT chỉ hàn vào vỏ thép — kiểm tra truyền lực cắt vào lõi bê tông (AISC I6 — load introduction).<\/li><li><strong>Điểm mù 2:<\/strong> Bê tông co ngót tách khỏi vỏ thép → mất hiệu ứng liên hợp. Dùng phụ gia bù co ngót, kiểm tra gõ búa sau 28 ngày.<\/li><li><strong>Điểm mù 3:<\/strong> Thiếu lỗ thoát hơi → nổ ống khi cháy.<\/li><\/ul>", "quote": "Cột CFT là cuộc hôn nhân hoàn hảo giữa thép và bê tông: lớp vỏ thép ôm chặt lõi bê tông làm nó chịu nén cao hơn, còn lõi bê tông chống không cho vỏ thép bị oằn. Kết quả là những chiếc trụ thanh mảnh gánh vạn tấn của khối đế thương mại, giải phóng không gian cho kiến trúc. Nhưng sự liên hợp đó chỉ tồn tại khi bê tông lấp đầy tuyệt đối — vì vậy chúng ta bơm từ chân lên, và chúng ta gõ kiểm tra từng cột.", "sw": ["#C1440E", "#E1F5FE", "#7D7A74", "#ECEFF1"], "scene": "column", "opts": {}}, {"n": 19, "title": "Chu trình ván khuôn nhôm (Aluminum Formwork) 4 ngày/tầng", "code": "EPC-SPEC-19-ALF", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ACI 347R-14<\/td><td>Ván khuôn — thiết kế, tháo dỡ sớm<\/td><\/tr><tr><td>ACI 347.3R-13 / ACI 301-20<\/td><td>Phân loại bề mặt CSC1–CSC4; dung sai Class A<\/td><\/tr><tr><td>ACI 117-10<\/td><td>Dung sai độ phẳng bề mặt tạo hình<\/td><\/tr><tr><td>TCVN 4453:1995<\/td><td>Thời gian tháo ván khuôn<\/td><\/tr><tr><td>EN 12812<\/td><td>Giàn chống<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Chu kỳ tầng điển hình<\/td><td>4 ngày (tối ưu 3 ngày khi dùng 2 bộ chống)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Tấm ván khuôn<\/td><td>Hợp kim 6061-T6, mặt dày 4 mm, 22–25 kg/m², tuổi thọ ≥ 200–300 lần quay vòng<\/td><td>Kiểm tra cong vênh ≤ 1 mm/1,2 m<\/td><td>W<\/td><\/tr><tr><td>Bề mặt hoàn thiện<\/td><td>Class A (ACI 301): độ lồi lõm từ từ ≤ 3 mm/1,5 m; gờ đột ngột ≤ 3 mm → bả mỏng sơn trực tiếp<\/td><td>Thước 1,5 m<\/td><td>W<\/td><\/tr><tr><td>Thẳng đứng vách<\/td><td>±3 mm/tầng<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Tháo ván khuôn vách/cột<\/td><td>Sau 12–24 h, bê tông ≥ 2,5 MPa (TCVN 4453: 25 daN/cm²)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Tháo ván khuôn sàn (drop-head early stripping)<\/td><td>36–48 h, chống đầu rơi giữ nguyên<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Tháo cây chống đầu rơi<\/td><td>Khi đạt ≥ 70% R28 (nhịp ≤ 8 m)<\/td><td>Mẫu hiện trường<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Bước chống<\/td><td>≤ 1,2 × 1,2 m (theo bản tính nhà sản xuất)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Chốt nêm (pin &amp; wedge)<\/td><td>100% đủ số lượng tại mép tấm; khoảng cách chốt ≤ 300 mm<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Chu trình 4 ngày (ví dụ):<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>Ngày<\/th><th>Ca sáng<\/th><th>Ca chiều<\/th><\/tr><\/thead><tbody><tr><td>D1<\/td><td>Tháo vách tầng dưới, chuyển lên; lắp ván khuôn vách tầng mới<\/td><td>Lắp cốt thép vách, MEP chờ vách<\/td><\/tr><tr><td>D2<\/td><td>Đóng ván khuôn vách; lắp ván khuôn dầm sàn<\/td><td>Lắp ván khuôn sàn, nghiệm thu khuôn<\/td><\/tr><tr><td>D3<\/td><td>Cốt thép dầm sàn, MEP âm sàn<\/td><td>Nghiệm thu (H)<\/td><\/tr><tr><td>D4<\/td><td>Đổ bê tông vách + dầm + sàn (đổ đêm D3–D4 nếu nóng)<\/td><td>Bảo dưỡng; bắt đầu chu kỳ mới<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Tấm nhôm đúc 6061-T6 nhẹ 23 kg/m², ghép chốt nêm thủ công, không cần cẩu — 200+ lần quay vòng.", "Tháo vách sau 12–24 h, tháo sàn sớm ở 36–48 h nhờ chống đầu rơi; cây chống giữ đến ≥ 70% R28.", "Chu trình 4 ngày/tầng, bề mặt Class A (≤ 3 mm/1,5 m): bỏ trát, bả mỏng sơn trực tiếp."], "vis": "<ul><li><strong>Dynamic Motion Tracking:<\/strong> steadicam bám theo đội thợ, ống kính 28 mm, f/4, nhịp chuyển động nhanh; âm thanh búa cao su và chốt nêm kim loại.<\/li><li>Ván khuôn <code class=\"hex\"><i style=\"background:#C9CDD2\"><\/i>#C9CDD2<\/code> ánh bạc, chốt nêm đỏ <code class=\"hex\"><i style=\"background:#D32F2F\"><\/i>#D32F2F<\/code>; gỡ tấm để lộ mặt bê tông nhẵn như gương (roughness 0.35, phản chiếu mờ).<\/li><\/ul>", "tl": [[0, 2500, "Các tấm vách khớp nhau, chốt nêm cắm — mỗi chốt chớp đỏ 80 ms"], [2500, 5000, "Tấm sàn được thợ đẩy lên đặt vào dầm nhôm; đầu chống đầu rơi <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>"], [5000, 7000, "Bê tông đổ (tua), đồng hồ giờ: <code>+36 h<\/code>"], [7000, 9500, "Đầu rơi hạ 50 mm, tấm sàn rời ra; cây chống ở lại; mặt bê tông Class A hiện ra"], [9500, 12000, "Tấm ván khuôn bay vút qua lỗ chuyển (pass-through slot 600 × 300 mm) lên tầng trên theo quỹ đạo mũi tên <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>; lịch D1–D4 hiển thị"]], "bim": "<ul><li>Mỗi tấm mang mã QR + màu theo vị trí: vách <code class=\"hex\"><i style=\"background:#C9CDD2\"><\/i>#C9CDD2<\/code>, sàn <code class=\"hex\"><i style=\"background:#B0BEC5\"><\/i>#B0BEC5<\/code>, góc <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>, đặc biệt (custom) <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>.<\/li><li>Bản đồ độ phẳng bề mặt sau tháo: ≤ 3 mm <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Tháo cây chống chỉ khi có kết quả nén mẫu hiện trường; chống lại tối thiểu 2 tầng dưới.<\/li><li><strong>Điểm mù 1:<\/strong> Tháo sớm theo lịch thay vì theo cường độ thực tế (mùa lạnh/mưa bê tông phát triển chậm) — dùng cảm biến maturity không dây.<\/li><li><strong>Điểm mù 2:<\/strong> Thiết kế ván khuôn nhôm \"đóng băng\" kiến trúc — mọi thay đổi bố trí căn hộ sau khi đặt hàng đều tốn kém. Chốt thiết kế trước khi sản xuất ≥ 10 tuần.<\/li><li><strong>Điểm mù 3:<\/strong> Rơi tấm qua lỗ chuyển gây tai nạn — lưới bao và vùng cấm bên dưới.<\/li><\/ul>", "quote": "Ván khuôn nhôm là động cơ của mọi kỷ lục tốc độ cao tầng: bốn ngày một tầng, hai trăm lần quay vòng, không cần móc cẩu. Nhưng tốc độ thực sự đến từ chỗ khác — từ bề mặt bê tông phẳng đến mức chúng ta bỏ hẳn công đoạn trát, tiết kiệm hàng chục nghìn mét vuông vữa và hàng tháng trời. Chỉ có một điều không bao giờ được vội: cây chống chỉ rời đi khi kết quả nén mẫu nói được, chứ không phải khi lịch trình nói được.", "sw": ["#C9CDD2", "#D32F2F", "#B0BEC5", "#FFC400", "#7E57C2", "#00C853"], "scene": "grid", "opts": {"mode": "form"}}, {"n": 20, "title": "Dầm chuyển (Transfer Girder) chịu siêu tải trọng chuyển đổi công năng", "code": "EPC-SPEC-20-TRG", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ACI 318-19 §9.9 (dầm cao ℓn/h ≤ 4), Ch. 23 (Strut-and-Tie)<\/td><td>Thiết kế dầm chuyển<\/td><\/tr><tr><td>TCVN 5574:2018<\/td><td>Thiết kế BTCT<\/td><\/tr><tr><td>ACI 347.2R / EN 12812<\/td><td>Giàn chống tải nặng<\/td><\/tr><tr><td>ACI 207.1R / TCVN 305:2004<\/td><td>Kiểm soát nhiệt khối lớn<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Kích thước dầm chuyển<\/td><td>h = 2,5–4,5 m; b = 1,5–3,0 m; nhịp 12–18 m<\/td><td>−5 / +15 mm<\/td><td>W<\/td><\/tr><tr><td>Cấp bê tông<\/td><td>B50<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Hàm lượng thép<\/td><td>300–450 kg/m³ (D36–D40 nhiều lớp, đai kín 4–6 nhánh, thép giá chống nứt mặt bên ≤ 300 mm)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Giàn chống tải nặng<\/td><td>Tháp chống thép tải 100–250 kN/chân; truyền tải qua ≥ 3–4 tầng dưới (đã kiểm tra khả năng chịu tải từng sàn)<\/td><td>Hệ số an toàn giàn ≥ 2,0 với ổn định<\/td><td>R + <strong>H<\/strong><\/td><\/tr><tr><td>Lún giàn chống khi đổ<\/td><td>≤ 5 mm (quan trắc thời gian thực bằng cảm biến dịch chuyển)<\/td><td>Dừng đổ nếu &gt; 5 mm<\/td><td>H<\/td><\/tr><tr><td>Đổ phân lớp<\/td><td>2 đợt: đợt 1 (≈ 1/3 chiều cao) được thiết kế như dầm liên hợp gánh đợt 2<\/td><td>Khe thi công nhám ≥ 6 mm biên độ (ACI 318 §22.9)<\/td><td>H<\/td><\/tr><tr><td>Độ vồng trước (pre-camber) ván khuôn<\/td><td>Theo tính toán (thường L/1 000 – L/750)<\/td><td>±3 mm<\/td><td>W<\/td><\/tr><tr><td>Độ võng dài hạn<\/td><td>≤ L/480 (cấu kiện đỡ tường/cấu kiện dễ hư hỏng — ACI 318 Bảng 24.2.2)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Nhiệt thủy hóa<\/td><td>T_max ≤ 70 °C; ΔT ≤ 20 °C<\/td><td>Thermocouple 3 cụm<\/td><td>H<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Giàn chống tải nặng truyền tải qua 3–4 tầng dưới, quan trắc lún thời gian thực ≤ 5 mm trong khi đổ.", "Thép D40 nhiều lớp, đai kín 6 nhánh, thép giá chống nứt mặt bên; thiết kế dầm cao theo Strut-and-Tie.", "Đổ 2 đợt: đợt 1 gánh đợt 2 như dầm liên hợp; kiểm soát nhiệt T_max ≤ 70 °C, ΔT ≤ 20 °C."], "vis": "<ul><li><strong>Low-angle Monumental Shot:<\/strong> camera dưới đáy dầm, ống kính 14 mm, khối dầm đen sẫm <code class=\"hex\"><i style=\"background:#4E4B47\"><\/i>#4E4B47<\/code> vắt ngang khung như cầu cạn; rừng tháp chống <code class=\"hex\"><i style=\"background:#F2B705\"><\/i>#F2B705<\/code> đan dày bên dưới, ánh sáng xuyên kẽ (god rays) qua lớp bụi.<\/li><li>Lớp FEA overlay: mô hình Strut-and-Tie — thanh chống nén <code class=\"hex\"><i style=\"background:#2166AC\"><\/i>#2166AC<\/code> dạng hình quạt từ cột trên xuống gối, thanh giằng kéo <code class=\"hex\"><i style=\"background:#B2182B\"><\/i>#B2182B<\/code> ở đáy dầm.<\/li><\/ul>", "tl": [[0, 2500, "Tháp chống mọc lên lấp đầy 2 tầng chuyển, mỗi tháp trễ 20 ms; mũi tên tải xuyên qua 4 tầng dưới"], [2500, 5500, "Lồng thép dầm hình thành: thép chủ 4 lớp, đai 6 nhánh bọc lại"], [5500, 8000, "Đổ đợt 1, sau đó đợt 2 (tua 7 ngày); cảm biến lún <code>2,1 mm<\/code> <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>"], [8000, 10500, "Cột thưa phía trên (khách sạn) đổ tải xuống; mô hình STM sáng lên: chống nén xanh, giằng kéo đỏ, nút CCT/CTT"], [10500, 12000, "Tải truyền xuống 2 cột lớn khối đế; nhãn <code>D/C = 0,86 PASS<\/code>"]], "bim": "<ul><li>STM: thanh chống <code class=\"hex\"><i style=\"background:#2166AC\"><\/i>#2166AC<\/code> độ dày tỷ lệ lực; giằng <code class=\"hex\"><i style=\"background:#B2182B\"><\/i>#B2182B<\/code>; nút <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>.<\/li><li>Giàn chống: η theo Turbo; chân chống vượt 90% chớp <code class=\"hex\"><i style=\"background:#FE9B2D\"><\/i>#FE9B2D<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Bản tính giàn chống tải nặng + kiểm tra khả năng chịu tải từng sàn đỡ, có kỹ sư kết cấu độc lập thẩm tra.<\/li><li><strong>Điểm mù 1:<\/strong> Tháo chống dầm chuyển trước khi các tầng trên được thi công đủ để đạt sự làm việc như thiết kế (hoặc ngược lại tải thi công tầng trên đè lên dầm chưa đủ tuổi) — trình tự tháo chống phải do thiết kế quy định.<\/li><li><strong>Điểm mù 2:<\/strong> Mật độ thép quá dày + đầm dùi không xuống được → rỗ đáy dầm. Dùng SCC hoặc bê tông có cốt liệu 10–14 mm và cửa sổ đầm hai bên ván khuôn.<\/li><li><strong>Điểm mù 3:<\/strong> Co ngắn từ biến khác biệt giữa cột trên dầm chuyển và lõi.<\/li><\/ul>", "quote": "Dầm chuyển là điểm mà kiến trúc đòi hỏi điều không tưởng: hàng chục cột của khối khách sạn phía trên phải biến mất để nhường chỗ cho một sảnh thương mại rộng thênh thang phía dưới. Khối bê tông bốn mét cao này nhận toàn bộ lực ấy và bẻ cong dòng lực sang những cột khổng lồ bên dưới. Trong lúc đổ, nó nặng hàng nghìn tấn mà chưa tự chịu được chính mình — vì vậy rừng giàn chống bên dưới cũng quan trọng như chính cái dầm.", "sw": ["#4E4B47", "#F2B705", "#2166AC", "#B2182B", "#FFC400", "#FE9B2D"], "scene": "beam", "opts": {}}, {"n": 21, "title": "Hệ sàn bao che an toàn tự leo (Safety Screen Platform) chống vật rơi", "code": "EPC-SPEC-21-SFT", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>QCVN 18:2021/BXD<\/td><td>Quy chuẩn kỹ thuật quốc gia về an toàn trong thi công xây dựng<\/td><\/tr><tr><td>TCVN 5308:1991<\/td><td>Quy phạm kỹ thuật an toàn trong xây dựng<\/td><\/tr><tr><td>OSHA 29 CFR 1926 Subpart M (§1926.502)<\/td><td>Bảo vệ chống ngã cao<\/td><\/tr><tr><td>EN 13374:2013 Class C<\/td><td>Hệ lan can bảo vệ mép tạm thời<\/td><\/tr><tr><td>EN 1263-1/-2<\/td><td>Lưới an toàn<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Chiều cao bao che<\/td><td>3,5–4,5 tầng (≈ 13–16 m) phủ tầng đang đổ + 2 tầng dưới<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Tấm chắn<\/td><td>Tôn đục lỗ dày 1,0–1,2 mm, tỷ lệ lỗ 25–35% (giảm tải gió) hoặc lưới thép mạ<\/td><td>Không khe hở &gt; 25 mm giữa tấm và sàn<\/td><td>W<\/td><\/tr><tr><td>Tải gió thiết kế<\/td><td>Làm việc 0,6–1,0 kPa; tồn tại (cố định tạm) theo gió bão vùng<\/td><td>Kiểm tra neo<\/td><td>R<\/td><\/tr><tr><td>Leo<\/td><td>Kích thủy lực tự leo; dừng leo khi gió ≥ 20 m/s<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Lan can mép<\/td><td>Cao 1 070 ± 75 mm (OSHA); chịu lực đỉnh 890 N bất kỳ hướng<\/td><td>Kiểm tra mỗi tầng<\/td><td>W<\/td><\/tr><tr><td>Bản chắn chân (toe board)<\/td><td>≥ 89 mm (OSHA) / ≥ 150 mm (Spec dự án)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Sàn đón vật rơi (catch fan) tại tầng 2–3<\/td><td>Vươn ra ≥ 3 m, nghiêng 20–45°<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Lưới an toàn ngang<\/td><td>Rơi tối đa ≤ 6 m xuống lưới (EN 1263)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Chiếu sáng thao tác<\/td><td>≥ 100 lux lối đi, ≥ 200 lux khu thao tác<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Neo vào kết cấu<\/td><td>Bê tông neo ≥ 15 MPa (theo nhà sản xuất)<\/td><td><\/td><td><strong>H<\/strong><\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Hệ bao che tự leo thủy lực phủ 4 tầng trên cùng, tôn đục lỗ 30% chịu gió và va đập, không khe hở &gt; 25 mm.", "Lan can 1 070 mm chịu 890 N, bản chắn chân 150 mm, sàn đón vật rơi vươn 3 m tại tầng thấp.", "Chiếu sáng ban đêm ≥ 200 lux, lối đi an toàn, nhà vệ sinh/trạm nước trên cao — biến tầng thi công thành pháo đài."], "vis": "<ul><li><strong>Exterior Drone Orbit Shot:<\/strong> quỹ đạo 360° quanh tháp bán kính 120 m, 18 s/vòng (dùng 8 s), ống kính 35 mm.<\/li><li>Lớp áo giáp bao che: khung <code class=\"hex\"><i style=\"background:#F2B705\"><\/i>#F2B705<\/code>, tấm tôn đục lỗ <code class=\"hex\"><i style=\"background:#ECEFF1\"><\/i>#ECEFF1<\/code> với logo nhà thầu; ánh nắng chiều xuyên lỗ tạo hoa văn sáng trên sàn bên trong.<\/li><\/ul>", "tl": [[0, 2500, "Khung bao che neo vào biên sàn, mỗi console neo sáng xanh"], [2500, 5500, "Kích tự leo đẩy cả lồng lên 1 tầng đồng bộ với ván khuôn lõi (mũi tên <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>)"], [5500, 8000, "Mô phỏng vật rơi (cờ lê 1 kg) va vào tấm chắn bị giữ lại, véc-tơ năng lượng triệt tiêu"], [8000, 10500, "Đêm xuống, đèn LED bao che bật thành dải sáng 4 tầng"], [10500, 12000, "Bảng LTI: <code>0 tai nạn mất ngày công — 1 250 000 giờ công an toàn<\/code>"]], "bim": "<ul><li>Vùng nguy hiểm vật rơi trên mặt đất: bán kính theo chiều cao (≈ H/10 tối thiểu 6 m) <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> 20%, lối đi có mái che <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>.<\/li><li>Áp lực gió trên tấm chắn (CFD) theo thang phân kỳ.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Nghiệm thu neo + chứng chỉ kiểm định hệ leo; trưởng ca an toàn ký sau mỗi lần leo.<\/li><li><strong>Điểm mù 1:<\/strong> Khe hở tại góc tòa nhà và tại vị trí vận thăng/cẩu — chi tiết bịt góc riêng.<\/li><li><strong>Điểm mù 2:<\/strong> Tải gió lên tấm chắn truyền vào sàn tuổi non — kiểm tra kết cấu.<\/li><li><strong>Điểm mù 3:<\/strong> Thời điểm \"chuyển giao\" khi mặt dựng bắt đầu lắp ở tầng dưới — phải có giải pháp lan can mép tạm thay thế.<\/li><\/ul>", "quote": "An toàn không phải là một hạng mục chi phí, nó là điều kiện để được phép xây dựng. Tấm áo giáp tự leo này bọc kín bốn tầng cao nhất — nơi con người làm việc ở độ cao hai trăm mét — để không một cái cờ lê nào rơi xuống phố. Một triệu giờ công không tai nạn không phải là may mắn; đó là kết quả của từng lan can một nghìn không trăm bảy mươi mi-li-mét được kiểm tra mỗi sáng.", "sw": ["#F2B705", "#ECEFF1", "#D50000", "#00C853"], "scene": "tower", "opts": {"mode": "screen"}}, {"n": 22, "title": "Kiểm tra không phá hủy (NDT) bê tông và mối nối cốt thép qua các tầng", "code": "EPC-SPEC-22-NDT", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 9357:2012 / ASTM C597<\/td><td>Vận tốc xung siêu âm (UPV)<\/td><\/tr><tr><td>TCVN 9334:2012 / ASTM C805<\/td><td>Súng bật nẩy<\/td><\/tr><tr><td>TCVN 9335:2012<\/td><td>Phương pháp kết hợp siêu âm – bật nẩy (SONREB)<\/td><\/tr><tr><td>BS 1881-204 / ACI 228.2R<\/td><td>Đo lớp bảo vệ, GPR, các phương pháp NDT<\/td><\/tr><tr><td>AWS D1.1 Ch. 8 / ISO 17640<\/td><td>Kiểm tra siêu âm (UT) mối hàn<\/td><\/tr><tr><td>ASTM E709<\/td><td>Kiểm tra bột từ (MT)<\/td><\/tr><tr><td>ASTM E165<\/td><td>Kiểm tra thẩm thấu chất lỏng (PT)<\/td><\/tr><tr><td>TCVN 8163:2009 / ISO 15835-2<\/td><td>Thử nghiệm mối nối ống ren<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>UPV bê tông<\/td><td>&gt; 4,5 km/s rất tốt; 3,5–4,5 tốt; 3,0–3,5 nghi ngờ; &lt; 3,0 kém<\/td><td>Cấu kiện chính ≥ 4,0 km/s<\/td><td>W<\/td><\/tr><tr><td>Súng bật nẩy<\/td><td>≥ 10 điểm/vùng 300 × 300 mm, loại bỏ giá trị lệch &gt; 6 đơn vị<\/td><td>Hiệu chuẩn đe thép 80 ± 2<\/td><td>W<\/td><\/tr><tr><td>Cường độ quy đổi SONREB<\/td><td>≥ f'c thiết kế với hệ số hiệu chỉnh từ lõi khoan<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Lớp bảo vệ (cover meter)<\/td><td>Thiết kế −5 / +10 mm; ≥ 90% điểm đạt<\/td><td>1 cột + 1 vách + 1 ô sàn mỗi tầng<\/td><td>W<\/td><\/tr><tr><td>UT mối hàn CJP<\/td><td>100%<\/td><td>Theo tiêu chí chấp nhận AWS D1.1 Bảng 8.2 (tĩnh)<\/td><td>H<\/td><\/tr><tr><td>MT mối hàn góc<\/td><td>10–20%<\/td><td>Không có vết nứt bề mặt<\/td><td>W<\/td><\/tr><tr><td>Coupler<\/td><td>1 mẫu thử kéo / 500 mối (hoặc mỗi lô); kéo ≥ 1,25 f_y thanh; độ trượt ≤ 0,10 mm<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Lực siết coupler<\/td><td>100% có vạch sơn, kiểm tra ngẫu nhiên 10% bằng cờ lê lực<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Phòng thí nghiệm<\/td><td>Đạt ISO/IEC 17025 (VILAS)<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Kết hợp siêu âm – bật nẩy (SONREB, TCVN 9335) hiệu chỉnh bằng lõi khoan; UPV cấu kiện chính ≥ 4,0 km/s.", "UT 100% mối hàn CJP theo AWS D1.1, MT mối hàn góc, thử kéo coupler 1 mẫu/500 mối (≥ 1,25 f_y, trượt ≤ 0,1 mm).", "Phòng thí nghiệm độc lập ISO/IEC 17025 lập biên bản cho từng tầng trước khi chuyển giai đoạn."], "vis": "<ul><li><strong>Close-up Tech Inspection View:<\/strong> macro 85 mm, f/2, đầu dò siêu âm áp lên cột (gel tiếp âm trong suốt), màn hình cầm tay hiện dạng sóng A-scan <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>.<\/li><li>Cảnh phụ: GPR quét sàn, ảnh hyperbol các thanh thép và cáp PT hiện trên màn hình.<\/li><\/ul>", "tl": [[0, 2500, "Hai đầu dò UPV đối diện trên cột; xung siêu âm truyền xuyên (sóng nén <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>), <code>V = 4,62 km/s<\/code>"], [2500, 5000, "Súng bật nẩy bắn 10 điểm lưới; giá trị trung bình 46"], [5000, 8000, "Đầu dò góc 70° quét mối hàn cột thép, chùm tia khúc xạ trong thép; A-scan không có phản xạ vượt mức"], [8000, 10000, "Máy kéo coupler: biểu đồ lực – biến dạng vượt 1,25 f_y, thanh đứt ngoài mối nối"], [10000, 12000, "Con dấu <code>PASS<\/code> <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code> phát sáng; cấu kiện trên BIM chuyển sang trạng thái \"Đã kiểm định\""]], "bim": "<ul><li>Trạng thái kiểm định cấu kiện trong BIM: chưa kiểm <code class=\"hex\"><i style=\"background:#B0BEC5\"><\/i>#B0BEC5<\/code>, đang kiểm <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>, đạt <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, nghi ngờ <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, không đạt <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><li>GPR: phản xạ thép hyperbol <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> trên nền xám.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Không đổ bê tông tầng trên khi biên bản NDT tầng dưới còn hạng mục \"nghi ngờ\" chưa xử lý.<\/li><li><strong>Điểm mù 1:<\/strong> Súng bật nẩy chỉ đánh giá lớp mặt 30 mm — bị ảnh hưởng bởi cacbonat hóa và độ ẩm; không dùng một mình để kết luận cường độ.<\/li><li><strong>Điểm mù 2:<\/strong> Coupler đủ lực nhưng thanh thép không vặn đủ chiều dài ren (thread engagement) — kiểm tra vạch đánh dấu trên thanh.<\/li><li><strong>Điểm mù 3:<\/strong> Hồ sơ NDT không liên kết với vị trí BIM → không truy vết được. Mỗi kết quả gắn GUID cấu kiện.<\/li><\/ul>", "quote": "Trong xây dựng cao tầng, không có chỗ cho câu &#x27;chắc là đạt&#x27;. Mỗi mét khối bê tông, mỗi mối hàn, mỗi khớp nối ren đều phải có một con số — và con số đó phải được gắn vào đúng cấu kiện trên mô hình số. Sóng siêu âm cho chúng ta nhìn thấy bên trong vật liệu mà không cần phá hủy nó — đó là con mắt của người kỹ sư giám sát hiện đại.", "sw": ["#00C853", "#B0BEC5", "#00B8D4", "#FFAB00", "#D50000", "#FFC400"], "scene": "wave", "opts": {}}, {"n": 23, "title": "Cất nóc (Topping Out) và đo sai số hình học bằng quét laser 3D", "code": "EPC-SPEC-23-TOP", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ACI 117-10 §4<\/td><td>Dung sai thẳng đứng công trình<\/td><\/tr><tr><td>USIBD Level of Accuracy Specification v3.1<\/td><td>Cấp độ chính xác đám mây điểm (LOA)<\/td><\/tr><tr><td>ISO 17123-9<\/td><td>Kiểm tra máy quét laser mặt đất<\/td><\/tr><tr><td>TCVN 9400:2012<\/td><td>Quan trắc độ nghiêng<\/td><\/tr><tr><td>BIMForum LOD 500<\/td><td>Mô hình hoàn công<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Độ lệch ngang đỉnh tháp so với trục gốc<\/td><td>Spec dự án ≤ H/2 000 → ≤ 110 mm cho H = 220 m (ACI 117: H/1 000, ≤ 150 mm)<\/td><td>Đo lúc 5–7h, gió &lt; 5 m/s<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Độ chính xác đám mây điểm<\/td><td>LOA30 (≤ 15 mm, 2σ) cho tổng thể; LOA40 (≤ 5 mm) cho giếng thang, mặt dựng<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Sai số ghép trạm (registration RMS)<\/td><td>≤ 3 mm (có bia chuẩn), ≤ 5 mm (cloud-to-cloud)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Mật độ điểm<\/td><td>≤ 5 mm khoảng cách điểm ở 10 m<\/td><td><\/td><td>R<\/td><\/tr><tr><td>So sánh As-built vs Design<\/td><td>95% bề mặt trong ±15 mm; giếng thang trong dung sai EN 81-20<\/td><td>Heatmap sai lệch<\/td><td>H<\/td><\/tr><tr><td>Co ngắn tích lũy dự báo vs đo<\/td><td>Sai lệch ≤ 20% giá trị dự báo<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Hoàn thành mẻ bê tông cuối cùng tầng mái — lễ cất nóc; khóa đường găng phần thân.", "Quét laser 3D toàn tháp trong &amp; ngoài (LOA30–LOA40), ghép trạm RMS ≤ 3 mm.", "So sánh As-built point cloud với BIM: độ lệch đỉnh tháp ≤ H/2 000; giếng thang đạt EN 81-20."], "vis": "<ul><li><strong>Epic Sunset Drone Shot:<\/strong> drone cao 300 m, ống kính 50 mm, tháp xuyên tầng mây, hoàng hôn 18h05 nhiệt độ màu 3 000 K, mặt trời 4° trên chân trời.<\/li><li>Cẩu treo dải băng đỏ <code class=\"hex\"><i style=\"background:#C62828\"><\/i>#C62828<\/code> + cờ; hàng triệu tia laser quét <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> lan phủ tòa tháp như lưới, chuyển thành đám mây điểm màu thật.<\/li><\/ul>", "tl": [[0, 2000, "Mẻ bê tông cuối rót xuống sàn mái; công nhân giơ cờ"], [2000, 4500, "24 máy quét đặt trên các tầng xoay 360°, tia laser bùng phát (2 triệu điểm/s mỗi máy)"], [4500, 7500, "Đám mây điểm tích tụ từ hạt đơn lẻ đến khối đặc (point splat size 1 → 3 px)"], [7500, 10000, "Mô hình BIM wireframe <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> chồng lên; heatmap sai lệch: 97% xanh <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>"], [10000, 12000, "Nhãn <code>Top drift = 64 mm ≤ 110 mm (H/2000) — PASS<\/code>; pháo hoa nhẹ nhàng"]], "bim": "<ul><li>Heatmap sai lệch đám mây điểm: −15 mm <code class=\"hex\"><i style=\"background:#2166AC\"><\/i>#2166AC<\/code> → 0 <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code> → +15 mm <code class=\"hex\"><i style=\"background:#B2182B\"><\/i>#B2182B<\/code>; ngoài ±15 mm <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> đậm.<\/li><li>Xử lý: Cyclone/Recap → Navisworks/Revit; voxel downsample 5 mm.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Báo cáo hình học tổng thể sau cất nóc trước khi đặt hàng ray thang máy và chốt kích thước tấm mặt dựng tầng cao.<\/li><li><strong>Điểm mù 1:<\/strong> Đo trong lúc tháp đang dao động do gió/nhiệt → kết quả sai. Đo trung bình nhiều lần, ghi điều kiện môi trường.<\/li><li><strong>Điểm mù 2:<\/strong> Lún móng làm nghiêng toàn tháp (rigid tilt) bị nhầm với sai số thi công.<\/li><li><strong>Điểm mù 3:<\/strong> Co ngắn từ biến tiếp tục 3–5 năm sau cất nóc — mặt dựng và ống đứng phải có khe co giãn tính toán.<\/li><\/ul>", "quote": "Khoảnh khắc cất nóc là khi ngọn tháp chạm vào bầu trời và cả công trường được phép tự hào. Nhưng một tổng chỉ huy thực thụ sẽ hỏi ngay: chúng ta đã đứng thẳng đến đâu? Hai triệu điểm laser mỗi giây trả lời câu hỏi đó — sáu mươi tư mi-li-mét trên hai trăm hai mươi mét. Đó không phải là may mắn; đó là kết quả của năm mươi lăm lần chuyển trục được kiểm soát nghiêm ngặt.", "sw": ["#C62828", "#00E5FF", "#2166AC", "#00C853", "#B2182B", "#D50000"], "scene": "tower", "opts": {"mode": "cloud"}}, {"n": 24, "title": "Tháo dỡ thiết bị thi công siêu cao tầng", "code": "EPC-SPEC-24-DSM", "dur": "15 000 ms", "part": "III", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 4244:2005 / QCVN 7:2012/BLĐTBXH<\/td><td>Thiết bị nâng<\/td><\/tr><tr><td>ISO 12480-1 / BS 7121-5<\/td><td>Kế hoạch nâng, tháo lắp cẩu tháp<\/td><\/tr><tr><td>ASTM C1107<\/td><td>Vữa không co ngót<\/td><\/tr><tr><td>ACI 318-19 §26.5 / ACI 546R<\/td><td>Sửa chữa, bù lỗ mở bê tông<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Gió khi tháo dỡ<\/td><td>≤ 12,5 m/s (theo nhà sản xuất, thường 10–12,5 m/s)<\/td><td>Dừng ngay khi vượt<\/td><td>W<\/td><\/tr><tr><td>Cẩu phụ trên mái (derrick/cẩu nhỏ)<\/td><td>Tải định mức ≥ 1,25 × cấu kiện nặng nhất (thường 6–10 t)<\/td><td>Kiểm tra sàn mái chịu tải tập trung<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Vùng cấm dưới mặt đất<\/td><td>Bán kính ≥ 1,5 × chiều cao rơi tiềm năng hạn chế bằng phương án; phong tỏa giao thông theo giấy phép<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Vữa bù lỗ mở sàn/vách<\/td><td>Không co ngót, cường độ ≥ cấp bê tông gốc + 5 MPa; cấy thép chờ đủ chiều dài neo<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Bề mặt tiếp giáp<\/td><td>Đục nhám biên độ ≥ 6 mm, quét chất kết dính epoxy<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Chống thấm lỗ mở mái<\/td><td>Thử ngâm nước 48 h, không rò<\/td><td><\/td><td>H<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Phương án tháo dỡ cẩu tháp bằng chuỗi cẩu phụ thu nhỏ dần trên mái (derrick → cẩu mini), gió ≤ 12,5 m/s.", "Hạ đốt thân cẩu, cabin, vận thăng; phong tỏa vùng nguy hiểm theo giấy phép giao thông đô thị.", "Bù lỗ mở sàn/vách bằng vữa không co ngót + cấy thép; chống thấm và thử ngâm nước 48 h."], "vis": "<ul><li><strong>High-speed Action Timelapse:<\/strong> camera trên tòa nhà lân cận, ống kính 70–200 mm zoom chậm, 48 giờ nén còn 10 s, mây chạy nhanh.<\/li><li>Đốt cẩu <code class=\"hex\"><i style=\"background:#F2B705\"><\/i>#F2B705<\/code> lần lượt được nhấc khỏi đỉnh, hạ xuống theo dây cáp mảnh lấp lánh; kết thúc với đỉnh mái kiến trúc thanh thoát (crown) lộ diện.<\/li><\/ul>", "tl": [[0, 2500, "Cẩu tháp tự hạ thấp (climbing down) về sát mái"], [2500, 5500, "Derrick nhấc cần, đối trọng, cabin, đốt thân lần lượt — mỗi cấu kiện 600 ms"], [5500, 7500, "Derrick tự tháo, cẩu mini nhỏ hơn tháo derrick, cẩu mini được hạ bằng vận thăng hàng"], [7500, 10000, "Lỗ mở sàn: thép cấy, vữa rót tự chảy lấp đầy, lớp chống thấm phủ kín"], [10000, 12000, "Drone kéo ra: tòa tháp hoàn toàn độc lập, đường chân trời sạch"]], "bim": "<ul><li>Trình tự tháo: cấu kiện chờ <code class=\"hex\"><i style=\"background:#F2B705\"><\/i>#F2B705<\/code>, đang nâng <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> glow, đã hạ <code class=\"hex\"><i style=\"background:#9E9E9E\"><\/i>#9E9E9E<\/code> mờ 40%.<\/li><li>Vùng cấm mặt đất <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> 20%.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Kế hoạch nâng chi tiết (lift plan) cho từng cấu kiện, có kiểm tra kết cấu sàn mái tại điểm đặt cẩu phụ.<\/li><li><strong>Điểm mù 1:<\/strong> Cẩu tháp đặt trong lõi — lỗ mở qua mỗi sàn trong lõi phải được bù đầy đủ cả phần thép chịu lực.<\/li><li><strong>Điểm mù 2:<\/strong> Vị trí vận thăng ngoài để lại \"khoảng trống\" mặt dựng — tấm mặt dựng cuối (closure units) cần đặt hàng riêng và lắp từ bên trong.<\/li><li><strong>Điểm mù 3:<\/strong> Neo cẩu/vận thăng cắt qua lớp chống thấm vách tầng hầm hoặc mái.<\/li><\/ul>", "quote": "Khi những chiếc cẩu cuối cùng rời khỏi đỉnh tháp, tòa nhà chính thức lột xác: nó không còn là công trường, nó là kiến trúc. Nhưng đây cũng là một trong những thao tác nguy hiểm nhất của dự án — tháo một cỗ máy hàng trăm tấn ở độ cao hai trăm mét bằng một cỗ máy nhỏ hơn, rồi lại nhỏ hơn nữa. Và đừng quên những lỗ mở mà chúng để lại: mỗi lỗ là một đường rò nước tiềm tàng nếu không được bù và thử nghiệm.", "sw": ["#F2B705", "#00E5FF", "#9E9E9E", "#D50000"], "scene": "tower", "opts": {"mode": "dismantle"}}, {"n": 25, "title": "Mặt dựng kính Unitized chống bão nhiệt đới", "code": "EPC-SPEC-25-FCD", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ASTM E330/E330M<\/td><td>Kết cấu — áp lực gió tĩnh đồng đều<\/td><\/tr><tr><td>ASTM E283 / E331 / AAMA 501.1<\/td><td>Lọt khí / thấm nước tĩnh / thấm nước động<\/td><\/tr><tr><td>AAMA 501.4 / 501.6<\/td><td>Chuyển vị lệch tầng (động đất, gió)<\/td><\/tr><tr><td>ASTM C1401 / C1184<\/td><td>Keo silicone kết cấu<\/td><\/tr><tr><td>EN 14179-1<\/td><td>Kính tôi nhiệt có thử Heat Soak (giảm nguy cơ vỡ do NiS)<\/td><\/tr><tr><td>TCVN 7505:2005 / TCVN 7737<\/td><td>Sử dụng kính trong xây dựng; kính hộp<\/td><\/tr><tr><td>QCVN 09:2017/BXD<\/td><td>Hiệu quả năng lượng: chỉ tiêu SHGC, U<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Áp lực gió thiết kế<\/td><td>Vùng giữa ±2,5 kPa; vùng góc/đỉnh đến ±4,0 kPa (theo kết quả hầm gió)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Thử kết cấu ASTM E330<\/td><td>100% thiết kế: võng thanh đứng ≤ L/175 hoặc ≤ 19 mm; 150% thiết kế: biến dạng dư ≤ 0,2% nhịp<\/td><td>Thử trên mẫu PMU<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Lọt khí ASTM E283<\/td><td>≤ 0,3 l/(s·m²) tại 75 Pa<\/td><td>PMU<\/td><td>H<\/td><\/tr><tr><td>Thấm nước ASTM E331 &amp; AAMA 501.1<\/td><td>Không thấm tại 20% áp lực thiết kế dương, tối thiểu 720 Pa (Spec dự án)<\/td><td>PMU + thử hiện trường AAMA 501.2 trên 2% mối nối<\/td><td>H<\/td><\/tr><tr><td>Chuyển vị lệch tầng AAMA 501.4<\/td><td>Khả năng chịu ±h/150 (≈ ±24 mm) không vỡ kính, không rơi<\/td><td>PMU<\/td><td>H<\/td><\/tr><tr><td>Kính hộp<\/td><td>8 mm HS Low-E + 12 mm khí Argon + 8 mm HS (hoặc lớp dán 6+1,52 PVB+6)<\/td><td>U ≤ 1,8 W/m²K; SHGC ≤ 0,30; VLT ≥ 40%<\/td><td>R<\/td><\/tr><tr><td>Kính tôi<\/td><td>100% thử Heat Soak EN 14179<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Lắp đặt module<\/td><td>Mặt phẳng ±2 mm giữa module kề nhau; khe nối ±2 mm; cao độ ±3 mm; vị trí tổng ±5 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Bas neo (bracket)<\/td><td>Rãnh neo đúc sẵn (cast-in channel) dung sai bê tông ±25 mm được hấp thụ bởi bas điều chỉnh 3D<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Khe co giãn stack joint<\/td><td>±15 mm (co ngắn, võng sàn, nhiệt)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Keo kết cấu<\/td><td>Bề rộng bám (bite) ≥ 6 mm và theo tính toán; thử bóc (peel/adhesion) 1/100 module<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Module Unitized chế tạo tại nhà máy, thử mẫu PMU: kết cấu 150%, lọt khí ≤ 0,3 l/s·m², thấm nước động 720 Pa, lệch tầng ±h/150.", "Treo module vào bas điều chỉnh 3D trên rãnh neo đúc sẵn bằng cẩu mini/monorail; khe nối ±2 mm, stack joint ±15 mm.", "Kính hộp Low-E Argon (U ≤ 1,8, SHGC ≤ 0,30), 100% kính tôi thử Heat Soak chống tự vỡ."], "vis": "<ul><li><strong>Close-up External Rigging Shot:<\/strong> camera treo ngoài mặt dựng tầng 42, ống kính 24 mm, f/5.6, gió thổi tóc bảo hộ, thành phố mờ sương bên dưới (DOF nông).<\/li><li>Module kính <code class=\"hex\"><i style=\"background:#7FB3B5\"><\/i>#7FB3B5<\/code> phản chiếu bầu trời và mây; khung nhôm sơn PVDF <code class=\"hex\"><i style=\"background:#37474F\"><\/i>#37474F<\/code>; giác hút chân không 4 đĩa với đồng hồ áp suất xanh.<\/li><li>Âm thanh \"cạch\" khi móc treo (hook) bập vào bas — đồng bộ frame.<\/li><\/ul>", "tl": [[0, 2500, "Module 1 500 × 4 200 mm (≈ 350 kg) bay lên bằng monorail, xoay 90° trong không trung"], [2500, 5000, "Thợ bên trong sàn kéo module áp sát; móc treo hạ vào bas; vít điều chỉnh Z hiển thị <code>+1,5 mm<\/code>"], [5000, 7500, "Module kế tiếp khớp ngàm đực–cái (stack &amp; mullion interlock), gioăng EPDM ép kín"], [7500, 10000, "Mô phỏng bão: mưa hắt 720 Pa, giọt nước trượt trên mặt kính, đường thoát nước áp lực cân bằng (pressure-equalised) dẫn nước ra ngoài"], [10000, 12000, "Camera lùi xa: mặt dựng phủ dần 55 tầng như vảy cá, phản chiếu hoàng hôn"]], "bim": "<ul><li>Áp lực gió lên mặt dựng (hầm gió): thang −4,0 kPa <code class=\"hex\"><i style=\"background:#2166AC\"><\/i>#2166AC<\/code> → +2,5 kPa <code class=\"hex\"><i style=\"background:#B2182B\"><\/i>#B2182B<\/code>; module phân vùng thiết kế A/B/C màu <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code> / <code class=\"hex\"><i style=\"background:#F3C63A\"><\/i>#F3C63A<\/code> / <code class=\"hex\"><i style=\"background:#FE9B2D\"><\/i>#FE9B2D<\/code>.<\/li><li>Kính: IOR 1,52, reflectance 18%, phủ Low-E mô phỏng ánh xanh ngọc khi góc nhìn &gt; 60°.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Đạt toàn bộ thử nghiệm PMU tại phòng thí nghiệm độc lập trước khi sản xuất hàng loạt.<\/li><li><strong>Điểm mù 1:<\/strong> Hấp thụ sai lệch bê tông — bas không đủ biên độ điều chỉnh khi sàn lệch &gt; ±25 mm. Quét laser mép sàn trước khi chế tạo bas.<\/li><li><strong>Điểm mù 2:<\/strong> Ngăn cháy lan giữa các tầng tại khe mép sàn – mặt dựng (perimeter fire barrier) — thường bị bỏ sót. Yêu cầu hệ ngăn cháy đã thử nghiệm (ASTM E2307) EI ≥ 60 phút theo QCVN 06.<\/li><li><strong>Điểm mù 3:<\/strong> Hệ thống bảo trì mặt dựng (BMU, ray treo gondola) chưa phối hợp với module — điểm neo phải chờ sẵn.<\/li><\/ul>", "quote": "Mặt dựng Unitized không chỉ là tấm áo lộng lẫy phản chiếu bầu trời; nó là một màng chắn kỹ thuật phải đứng vững trước áp lực bốn kilopascal của cơn bão, ngăn nước mưa bị gió quất ngang, và cho phép tòa nhà lắc lư hai mươi bốn mi-li-mét mỗi tầng mà không rơi một tấm kính nào. Tất cả đã được chứng minh trên mẫu thử PMU trước khi một module nào được sản xuất. Và hãy nhớ khe hở nhỏ giữa mép sàn và mặt kính — đó là con đường ngọn lửa leo từ tầng này lên tầng khác nếu chúng ta quên chặn nó.", "sw": ["#7FB3B5", "#37474F", "#2166AC", "#B2182B", "#61FC6C", "#F3C63A", "#FE9B2D"], "scene": "grid", "opts": {"mode": "facade"}}, {"n": 26, "title": "Trục kỹ thuật MEP đứng (Vertical Shaft MEP: HVAC, Điện, Cấp thoát nước)", "code": "EPC-SPEC-26-RSR", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>QCVN 06:2022/BXD + Sửa đổi 1:2023<\/td><td>An toàn cháy cho nhà và công trình<\/td><\/tr><tr><td>SMACNA HVAC Duct Construction Standards / HVAC Air Duct Leakage Test Manual<\/td><td>Chế tạo và độ kín ống gió<\/td><\/tr><tr><td>TCVN 5687:2024 (hoặc bản hiện hành)<\/td><td>Thông gió – điều hòa không khí<\/td><\/tr><tr><td>NFPA 14 / TCVN 3890:2023<\/td><td>Hệ thống họng nước chữa cháy (standpipe)<\/td><\/tr><tr><td>TCVN 4513:1988 / QCVN 01:2021/BXD + tiêu chuẩn cấp thoát nước bên trong<\/td><td>Cấp thoát nước trong nhà<\/td><\/tr><tr><td>ASTM E814 / UL 1479<\/td><td>Chèn bịt chống cháy xuyên sàn (firestop)<\/td><\/tr><tr><td>ASCE 7-22 Ch. 13<\/td><td>Giằng kháng chấn thiết bị MEP<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Độ kín ống gió<\/td><td>Seal Class A, Leakage Class 4–6 (SMACNA) tại áp lực thiết kế<\/td><td>Thử 10–20% chiều dài, 100% ống áp cao<\/td><td>W<\/td><\/tr><tr><td>Thử áp ống chữa cháy<\/td><td>13,8 bar (200 psi) trong 2 h hoặc +3,5 bar trên áp làm việc nếu áp làm việc &gt; 10,3 bar<\/td><td>Không tụt áp<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Thử áp cấp nước sinh hoạt<\/td><td>1,5 × áp làm việc, ≥ 10 bar, 60 phút<\/td><td>Tụt áp ≤ 0,2 bar (Spec dự án)<\/td><td>H<\/td><\/tr><tr><td>Thử kín ống thoát nước<\/td><td>Ngâm cột nước 3 m hoặc thử khói<\/td><td>15 phút không rò<\/td><td>H<\/td><\/tr><tr><td>Phân vùng áp lực<\/td><td>Mỗi vùng ≤ 6 bar tại thiết bị; trạm giảm áp (PRV) mỗi 10–14 tầng<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Bảo ôn ống nước lạnh<\/td><td>Cao su lưu hóa NBR dày 19–32 mm, λ ≤ 0,036 W/m·K, μ ≥ 7 000<\/td><td>Không đọng sương ở 30 °C/RH 80%<\/td><td>W<\/td><\/tr><tr><td>Khớp giãn nở ống đứng<\/td><td>Neo cố định + khớp nối giãn nở theo tính toán ΔT và co ngắn kết cấu<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Giá đỡ ống đứng<\/td><td>Mỗi tầng một giá dẫn hướng; giá chịu tải mỗi 3–5 tầng<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Chèn bịt xuyên sàn<\/td><td>F-rating ≥ giới hạn chịu lửa sàn (REI 120)<\/td><td>100% lỗ xuyên<\/td><td>H<\/td><\/tr><tr><td>Độ thẳng đứng ống<\/td><td>≤ 2 mm/m; ≤ 10 mm/tầng<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Ống gió tổng, ống nước lạnh chiller, ống cấp – thoát nước, máng cáp/busway chạy trong các trục kỹ thuật đứng có phân vùng áp lực ≤ 6 bar.", "Ống chữa cháy thép hàn thử áp 13,8 bar trong 2 h; ống cấp nước thử 1,5 × áp làm việc; neo và khớp giãn nở hấp thụ nhiệt và co ngắn.", "Bảo ôn NBR chống đọng sương; chèn bịt chống cháy 100% lỗ xuyên sàn đạt F ≥ 120 phút."], "vis": "<ul><li><strong>Vertical Shaft X-ray View:<\/strong> cắt dọc trục kỹ thuật 3 × 6 m xuyên 55 tầng, camera bay dọc từ đáy lên đỉnh 4 s (≈ 55 m/s ảo), ống kính 18 mm.<\/li><li>Màu ống theo bảng 0.3.5: CHWS <code class=\"hex\"><i style=\"background:#0057B8\"><\/i>#0057B8<\/code>, CHWR <code class=\"hex\"><i style=\"background:#5BA4E6\"><\/i>#5BA4E6<\/code>, FP <code class=\"hex\"><i style=\"background:#D32F2F\"><\/i>#D32F2F<\/code>, DW <code class=\"hex\"><i style=\"background:#00ACC1\"><\/i>#00ACC1<\/code>, SAN <code class=\"hex\"><i style=\"background:#6D4C41\"><\/i>#6D4C41<\/code>, SA <code class=\"hex\"><i style=\"background:#90A4AE\"><\/i>#90A4AE<\/code> mạ kẽm lấp lánh, PWR <code class=\"hex\"><i style=\"background:#FBC02D\"><\/i>#FBC02D<\/code>.<\/li><li>Bảo ôn đen mờ <code class=\"hex\"><i style=\"background:#212121\"><\/i>#212121<\/code> roughness 0.9; firestop đỏ cam <code class=\"hex\"><i style=\"background:#E64A19\"><\/i>#E64A19<\/code> tại mỗi sàn.<\/li><\/ul>", "tl": [[0, 2000, "Giá đỡ thép gắn vào vách lõi bằng bu lông nở cơ khí (đã quét GPR tránh cáp PT/thép)"], [2000, 5000, "Tời kéo đoạn ống 6 m nối tiếp, mối hàn sáng cam rồi nguội"], [5000, 7000, "Đồng hồ thử áp <code>13,8 bar — 2:00:00 — Δ 0,0 bar<\/code>"], [7000, 9000, "Bảo ôn bọc quanh ống nước lạnh như da; firestop phun kín lỗ xuyên"], [9000, 12000, "Dòng chảy được mô phỏng: nước lạnh xanh chảy xuống, nước hồi lên, khí cấp tràn ra các tầng — \"hệ tuần hoàn\" sống động"]], "bim": "<ul><li>Áp lực tĩnh theo chiều cao (biểu đồ cạnh trục): 0–6 bar <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, 6–10 bar <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, &gt; 10 bar <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> — PRV reset về xanh.<\/li><li>Dòng chảy dạng hạt: CHW 1,5–2,5 m/s, thoát nước rơi tự do có ống thông hơi <code class=\"hex\"><i style=\"background:#43A047\"><\/i>#43A047<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Thử áp và thử kín trước khi bảo ôn và trước khi đóng tường trục kỹ thuật.<\/li><li><strong>Điểm mù 1:<\/strong> Hiện tượng \"búa nước\" và áp lực âm trong ống thoát nước đứng siêu cao — bắt buộc ống thông hơi song song hoặc van thông khí tự động, bộ giảm tốc dòng (offset) mỗi 15–20 tầng.<\/li><li><strong>Điểm mù 2:<\/strong> Co ngắn kết cấu nén ép ống đứng bị neo cứng hai đầu → nứt mối nối. Thiết kế khớp trượt.<\/li><li><strong>Điểm mù 3:<\/strong> Lỗ xuyên sàn bị lấp bằng vữa thường hoặc foam PU — không có giá trị chống cháy.<\/li><\/ul>", "quote": "Trục kỹ thuật MEP là hệ tuần hoàn và hệ thần kinh của cơ thể khổng lồ này — nước lạnh chảy xuống như máu tĩnh mạch, không khí tươi bơm lên như hơi thở. Ở độ cao hai trăm mét, cột nước tạo ra hai mươi bar áp lực, đủ để xé tung một van thông thường, nên chúng ta chia tòa nhà thành từng vùng áp lực. Và mỗi lỗ xuyên sàn ở đây phải được bịt bằng vật liệu chống cháy thực thụ — vì một trục kỹ thuật không được bịt kín chính là một ống khói nối năm mươi lăm tầng.", "sw": ["#0057B8", "#5BA4E6", "#D32F2F", "#00ACC1", "#6D4C41", "#90A4AE", "#FBC02D", "#212121", "#E64A19", "#00C853", "#FFAB00", "#D50000", "#43A047"], "scene": "pipes", "opts": {"mode": "riser"}}, {"n": 27, "title": "Thang máy tốc độ cao (High-speed Elevators) và thang máy chữa cháy", "code": "EPC-SPEC-27-ELV", "dur": "15 000 ms", "part": "IV", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 6396-20:2017 (EN 81-20) / TCVN 6396-50 (EN 81-50)<\/td><td>An toàn cấu tạo và lắp đặt thang máy<\/td><\/tr><tr><td>EN 81-72:2020<\/td><td>Thang máy chữa cháy<\/td><\/tr><tr><td>EN 81-73<\/td><td>Ứng xử thang máy khi có cháy<\/td><\/tr><tr><td>ISO 18738-1<\/td><td>Đo chất lượng hành trình (rung, ồn)<\/td><\/tr><tr><td>QCVN 02:2019/BLĐTBXH<\/td><td>An toàn lao động thang máy<\/td><\/tr><tr><td>QCVN 06:2022/BXD<\/td><td>Yêu cầu thang máy chữa cháy cho nhà &gt; 28 m<\/td><\/tr><tr><td>NFPA 110<\/td><td>Nguồn điện khẩn cấp<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Tốc độ thang tốc hành (shuttle)<\/td><td>6–8 m/s (dự án: 7 m/s)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Gia tốc / độ giật<\/td><td>≤ 1,0 m/s² / ≤ 1,5 m/s³<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Rung ngang trong cabin (ISO 18738)<\/td><td>≤ 10–15 milli-g đỉnh – đỉnh (A95)<\/td><td><\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Độ ồn trong cabin<\/td><td>≤ 50–55 dB(A) tại 7 m/s<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Lắp ray dẫn hướng<\/td><td>Độ thẳng đứng ≤ 1 mm/5 m; khe nối ray ≤ 0,1 mm; khoảng cách ray +0,5 / −0 mm<\/td><td>Đo dây dọi/laser<\/td><td>H<\/td><\/tr><tr><td>Giếng thang<\/td><td>Theo EN 81-20 (xem Slide 15)<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Độ chính xác dừng tầng<\/td><td>±3 mm (Spec dự án; EN 81-20: ±10 mm)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Thử tải<\/td><td>125% tải định mức (thử phanh) ; thử bộ hãm an toàn ở tải định mức + tốc độ định mức<\/td><td><\/td><td>H — kiểm định viên<\/td><\/tr><tr><td>Thang chữa cháy (EN 81-72)<\/td><td>Từ tầng truy cập đến tầng trên cùng ≤ 60 s; tải ≥ 1 000 kg; cabin ≥ 1 100 × 2 100 mm; chống nước nhỏ giọt<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Nguồn khẩn cấp<\/td><td>Máy phát Type 10 (≤ 10 s, NFPA 110); thiết bị cứu hộ tự động ARD đưa cabin về tầng gần nhất<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Mất điện → ARD kích hoạt<\/td><td>≤ 3 s (Spec dự án)<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Ray dẫn hướng căn chỉnh bằng laser ≤ 1 mm/5 m; máy kéo không hộp số nam châm vĩnh cửu, điều khiển đích đến (destination dispatch).", "Thang tốc hành 7 m/s: rung ngang ≤ 15 milli-g, ồn ≤ 55 dB(A), dừng tầng ±3 mm.", "Thang chữa cháy EN 81-72: lên tầng cao nhất ≤ 60 s; ARD ≤ 3 s, máy phát ≤ 10 s khi mất điện."], "vis": "<ul><li><strong>High-speed Vertical Tracking Shot:<\/strong> camera gắn trên nóc cabin nhìn lên, ống kính 14 mm, giếng thang LED định vị <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> mỗi tầng chạy vút xuống như đường hầm ánh sáng; motion blur 270°.<\/li><li>Phòng máy đỉnh giếng: máy kéo gearless <code class=\"hex\"><i style=\"background:#263238\"><\/i>#263238<\/code> với puly cáp, cáp thép 8 – 10 sợi <code class=\"hex\"><i style=\"background:#B8BDC4\"><\/i>#B8BDC4<\/code>.<\/li><\/ul>", "tl": [[0, 2500, "Ray dẫn hướng dựng từ đáy lên, laser căn chỉnh <code>Δ 0,4 mm/5 m<\/code>"], [2500, 4500, "Máy kéo được cẩu đặt lên bệ phòng máy, cân chỉnh bằng đồng hồ so"], [4500, 8000, "Cabin tăng tốc 0 → 7 m/s, đồng hồ kỹ thuật số đếm tầng 1 → 55 trong 30 s (tua ×4); biểu đồ rung ISO 18738 dưới ngưỡng"], [8000, 10000, "Mô phỏng mất điện: đèn tắt, ARD bật ở 2,6 s, cabin trôi về tầng gần nhất, mở cửa"], [10000, 12000, "Chế độ lính cứu hỏa: công tắc chìa, thang chữa cháy chạy thẳng tầng 55 trong 52 s, nhãn <code>EN 81-72 PASS<\/code>"]], "bim": "<ul><li>Phân luồng thang (vertical transportation zoning): khối thấp <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code>, khối giữa <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code>, khối cao <code class=\"hex\"><i style=\"background:#F3C63A\"><\/i>#F3C63A<\/code>, thang tốc hành lên sky-lobby <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>, thang chữa cháy <code class=\"hex\"><i style=\"background:#D32F2F\"><\/i>#D32F2F<\/code>.<\/li><li>Phân tích lưu lượng: thời gian chờ trung bình ≤ 30 s (văn phòng), công suất vận chuyển 5 phút (HC5) ≥ 12–13%.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Kiểm định an toàn bởi tổ chức kiểm định được cấp phép trước khi đưa vào sử dụng (kể cả dùng tạm thi công).<\/li><li><strong>Điểm mù 1:<\/strong> Dao động tòa nhà do gió làm cáp thang và cáp điều khiển lắc (rope sway) — với tháp có chu kỳ 5–6 s cần thiết bị chống lắc cáp và chế độ giảm tốc khi gió lớn (cảm biến dao động tòa nhà liên kết).<\/li><li><strong>Điểm mù 2:<\/strong> Hiệu ứng ống khói (stack effect) làm cửa thang khó đóng ở tầng trệt — cửa xoay/khóa gió sảnh.<\/li><li><strong>Điểm mù 3:<\/strong> Dùng thang vĩnh cửu phục vụ thi công làm hỏng ray và cabin — hợp đồng phải quy định bảo dưỡng và thay thế phụ tùng trước bàn giao.<\/li><\/ul>", "quote": "Những chiếc thang bảy mét mỗi giây đưa con người lên tầng năm mươi lăm trong ba mươi giây — nhưng phép màu đó được xây trên những thanh ray thẳng đến một mi-li-mét trên năm mét. Sự êm ái mà hành khách cảm nhận được, dưới mười lăm phần nghìn gi
