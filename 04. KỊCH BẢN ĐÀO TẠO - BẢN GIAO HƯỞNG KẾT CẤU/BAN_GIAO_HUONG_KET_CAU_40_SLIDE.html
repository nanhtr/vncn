<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bản Giao Hưởng Kết Cấu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phòng điều khiển BIM — thanh lệnh trên cùng, sân khấu mô phỏng bên trái, hồ sơ đặc tả bên phải.
   Giao diện tối có chủ đích (màn hologram điện ảnh), chỉ một bảng màu. */
:root{
  color-scheme:dark;
  --bg:#071118; --panel:#0C1A23; --panel2:#10222D; --line:#1C3340;
  --fg:#DCE9EE; --mute:#88A2AD; --wire:#00E5FF; --gold:#FFC400;
  --pass:#00C853; --warn:#FFAB00; --fail:#FF4D4D;
  --f-disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(rgba(0,229,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.035) 1px,transparent 1px);
  background-size:32px 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wire);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:17px;white-space:nowrap}
.brand b{color:var(--wire)}
.crumb{color:var(--mute);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--wire)}
.btn.pri{background:var(--wire);color:#00262B;border-color:var(--wire);font-weight:600}
.count{font-family:var(--f-mono);font-size:13px;color:var(--mute);min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--gold);transition:width .3s}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1500px;margin:0 auto}

/* Slide */
.slide{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 14px;font-family:var(--f-mono);font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.eyebrow .tag{color:var(--gold)}
h1,h2{font-family:var(--f-disp);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:clamp(26px,3.2vw,40px)}
.num{font-family:var(--f-disp);color:var(--wire);font-weight:600;font-size:15px;letter-spacing:.12em}
.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bul li{position:relative;padding-left:22px;font-size:16px;line-height:1.5}
.bul li::before{content:"";position:absolute;left:2px;top:.62em;width:10px;height:2px;background:var(--wire)}
.quote{margin:0;background:linear-gradient(90deg,rgba(255,196,0,.09),transparent);border-left:3px solid var(--gold);
  padding:12px 16px;border-radius:0 8px 8px 0;font-size:15.5px;font-style:italic;color:#F3EBD2}
.quote small{display:block;font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}

.stage{position:relative;background:#050D13;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:16/10;max-width:100%}
.stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:11px;color:var(--wire);opacity:.85;pointer-events:none}
.hud2{position:absolute;right:10px;bottom:8px;font-family:var(--f-mono);font-size:11px;color:var(--mute);pointer-events:none;font-variant-numeric:tabular-nums}
.player{display:flex;align-items:center;gap:10px}
.track{flex:1;height:6px;background:var(--panel2);border-radius:3px;position:relative;cursor:pointer;border:1px solid var(--line)}
.track i{position:absolute;inset:0 auto 0 0;background:var(--wire);border-radius:3px}
.tc{font-family:var(--f-mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.tl{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--mute);border:1px solid transparent}
.tl li span{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums;padding-top:2px}
.tl li.on{color:var(--fg);background:var(--panel2);border-color:var(--line)}
.tl li.on span{color:var(--wire)}
.tl li.done span{color:var(--pass)}
.sw{display:flex;flex-wrap:wrap;gap:4px}
.sw i{width:18px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.15)}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;cursor:pointer;font-size:13px;color:var(--mute);font-weight:500}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--wire)}
.pane{font-size:13.5px;min-width:0}
.pane p{margin:.4em 0}
.pane ul{margin:.3em 0;padding-left:1.1em}
.pane li{margin:.25em 0}
.pane ol{padding-left:1.2em;margin:.2em 0}
.pane strong{color:#fff}
.note{color:var(--warn);font-size:12.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:.5em 0}
table{border-collapse:collapse;width:100%;font-size:12.8px;font-variant-numeric:tabular-nums}
th{background:var(--panel2);text-align:left;font-weight:600;color:var(--wire);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
code{font-family:var(--f-mono);font-size:.9em;background:rgba(0,229,255,.08);padding:1px 4px;border-radius:3px;color:#BFF6FF;white-space:nowrap}
code.hex i{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(255,255,255,.25)}

/* Bìa & phụ lục */
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;min-height:70vh}
.cover h1{font-size:clamp(44px,7vw,96px);text-transform:uppercase;letter-spacing:.02em;line-height:.95}
.cover h1 b{color:var(--wire);font-weight:700;display:block}
.lede{font-size:17px;color:var(--mute);max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--fg);background:var(--panel)}
.parts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.parts button{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.parts button:hover{border-color:var(--wire)}
.parts .r{font-family:var(--f-disp);font-size:22px;color:var(--gold);font-weight:700}
.parts .s{font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.appx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}

/* Mục lục */
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:0;width:min(720px,calc(100vw - 32px));max-height:85vh}
dialog::backdrop{background:rgba(2,8,12,.7)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.idx{padding:8px 16px 16px;overflow:auto}
.idx h3{font-family:var(--f-disp);color:var(--gold);font-size:16px;letter-spacing:.06em;margin:14px 0 6px;text-transform:uppercase}
.idx button{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.idx button:hover,.idx button.cur{background:var(--panel2)}
.idx button span{font-family:var(--f-mono);color:var(--wire);font-size:12px}

@media (max-width:980px){
  .slide,.cover,.appx{grid-template-columns:minmax(0,1fr)}
  .cover{min-height:0}
  .crumb{display:none}
}
@media (max-width:520px){
  .tl li{grid-template-columns:minmax(0,1fr)}
  .brand{font-size:15px}
  .bul li{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.prog{transition:none}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="brand">Bản giao hưởng <b>kết cấu</b></div>
  <div class="crumb" id="crumb"></div>

    <button class="btn" id="bIdx" type="button" aria-haspopup="dialog">Mục lục</button>

chỉnh N60<\/td><td>W<\/td><\/tr><tr><td>Mẫu nguyên dạng<\/td><td>Mỗi 2,0 m trong sét, Ø ≥ 75 mm, ống thành mỏng<\/td><td>Độ xáo trộn: tỷ số diện tích ≤ 10%<\/td><td>R<\/td><\/tr><tr><td>Mực nước ngầm<\/td><td>Đo sau 24 h ổn định<\/td><td>±10 mm<\/td><td>W<\/td><\/tr><tr><td>Nước ngầm SO₄²⁻<\/td><td>Mức S1 nếu 150–1 500 ppm; S2: 1 500–10 000 ppm<\/td><td>Phân tích 2 mùa (khô/mưa)<\/td><td>R<\/td><\/tr><tr><td>Nước ngầm Cl⁻<\/td><td>&gt; 500 mg/l → yêu cầu cấp phối chống xâm thực, lớp bảo vệ ≥ 75 mm<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Mực nước thiết kế<\/td><td>Cực đại và cực tiểu trong chu kỳ 50 năm (theo số liệu thủy văn + piezometer quan trắc ≥ 12 tháng)<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Khoan xoay lấy mẫu liên tục, 7 lỗ phủ kín chu vi và lõi tháp, khoan vào đá gốc ≥ 5 m lõi liên tục.", "SPT mỗi 2 m, cắt cánh hiện trường và nén ba trục UU–CU–CD xác định c', φ', Su và sức chịu tải cực hạn.", "Phân tích hóa học nước ngầm (SO₄²⁻, Cl⁻, pH, CO₂ xâm thực) theo 2 mùa để thiết kế bê tông chống xâm thực."], "vis": "<ul><li><strong>Camera A — Epic Drone Shot:<\/strong> cao độ 400 m, ống kính 24 mm, f/8, hạ thẳng đứng với vận tốc 40 m/s rồi giảm tốc ease-out về 2 m/s khi chạm mặt đất.<\/li><li><strong>Camera B — X-ray Cross-section:<\/strong> mặt cắt đứng xuyên lòng đất, mặt phẳng cắt phát sáng viền <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> dày 2 px. Ống kính 50 mm, dolly ngang 0,5 m/s.<\/li><li><strong>Các lớp địa tầng<\/strong> (từ trên xuống, độ dày thực tế, phóng đại đứng ×1):<ol><li>Đất lấp <code class=\"hex\"><i style=\"background:#8D6E63\"><\/i>#8D6E63<\/code>, 0–2,5 m<\/li><li>Sét yếu (bùn sét) <code class=\"hex\"><i style=\"background:#5D6D7E\"><\/i>#5D6D7E<\/code>, N = 0–3, 2,5–18 m — bề mặt ướt roughness 0.1<\/li><li>Cát mịn chặt vừa <code class=\"hex\"><i style=\"background:#D4B483\"><\/i>#D4B483<\/code>, N = 12–25, 18–35 m<\/li><li>Sét cứng <code class=\"hex\"><i style=\"background:#A1887F\"><\/i>#A1887F<\/code>, N = 25–40, 35–52 m<\/li><li>Cuội sỏi <code class=\"hex\"><i style=\"background:#BCAAA4\"><\/i>#BCAAA4<\/code> (hạt instanced Ø 20–80 mm), N &gt; 50, 52–72 m<\/li><li>Đá gốc phong hóa nhẹ → tươi <code class=\"hex\"><i style=\"background:#455A64\"><\/i>#455A64<\/code> → <code class=\"hex\"><i style=\"background:#263238\"><\/i>#263238<\/code>, &gt; 72 m<\/li><\/ol><\/li><li>Mũi khoan kim cương Ø 76 mm (lõi NQ 47,6 mm), phụt bùn khoan trắng đục <code class=\"hex\"><i style=\"background:#E0E0E0\"><\/i>#E0E0E0<\/code> opacity 70%, hạt particle 20 000/s, dưới đèn pha 5 600 K.<\/li><\/ul>", "tl": [[0, 1200, "Vệ tinh GNSS (3 icon) phát chùm tín hiệu <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code> hội tụ, đánh dấu 7 điểm khoan bằng vòng tròn <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> Ø 1,5 m"], [1200, 2800, "Drone hạ độ cao, mặt đất \"bóc\" thành mặt cắt X-ray (wipe từ trái sang phải 1 600 ms)"], [2800, 6000, "Cần khoan quay 120 vòng/phút, đâm xuống; đồng hồ độ sâu chạy 0 → 85 m (số JetBrains Mono, cập nhật mỗi 40 ms)"], [6000, 8000, "Ống lõi kéo lên, lõi đá dài 1,5 m trượt ra khay mẫu; chú thích RQD = 78% <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>"], [8000, 10400, "Hình trụ địa tầng 3D của 7 lỗ nội suy thành khối địa chất (kriging), các lớp mọc lên từ dưới lên, mỗi lớp trễ 200 ms"], [10400, 12000, "Nhãn N-SPT, Su, φ' nhấp nháy 2 lần (mỗi lần 160 ms) tại từng lớp; chốt khung"]], "bim": "<ul><li>Mô hình địa chất: Civil 3D / Leapfrog Works, lưới voxel 1 × 1 × 0,5 m, nội suy kriging thông thường.<\/li><li>Bản đồ màu N-SPT: N = 0 <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> → N = 15 <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code> → N = 30 <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code> → N ≥ 50 <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code>.<\/li><li>Đường mực nước ngầm: mặt phẳng <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code> opacity 35%, có sóng gợn biên độ 5 cm, chu kỳ 3 s; hai mặt cực đại/cực tiểu nét đứt.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Không phê duyệt thiết kế cọc nếu chưa có báo cáo nén ba trục và lõi đá tầng mũi cọc được TVGS chứng kiến.<\/li><li><strong>Điểm mù 1:<\/strong> Hang karst hoặc thấu kính sét kẹp trong đá — bắt buộc khoan kiểm tra bổ sung dưới mũi cọc ≥ 3D tại lõi tháp.<\/li><li><strong>Điểm mù 2:<\/strong> Mực nước ngầm \"treo\" (perched water) giữa các lớp sét — lắp piezometer nhiều tầng, không dùng ống quan trắc hở toàn chiều sâu.<\/li><li><strong>Điểm mù 3:<\/strong> Đo nước ngầm chỉ một mùa dẫn đến đánh giá sai lực đẩy nổi tầng hầm.<\/li><\/ul>", "quote": "Thưa các đồng nghiệp, không có tòa tháp nào vững chãi nếu đặt trên một giả định về lòng đất. Bảy lỗ khoan, hàng trăm mẫu nguyên dạng và từng mét lõi đá này chính là bộ gen — DNA của nền móng. Chúng ta giải mã từng con số N-SPT, từng phần triệu ion sunfat trước khi cho phép hàng trăm nghìn tấn thép và bê tông đè lên. Một đồng tiết kiệm sai chỗ ở khâu khảo sát sẽ phải trả bằng cả nghìn đồng ở khâu xử lý sự cố.", "sw": ["#00E5FF", "#8D6E63", "#5D6D7E", "#D4B483", "#A1887F", "#BCAAA4", "#455A64", "#263238", "#E0E0E0", "#D50000", "#FFAB00", "#61FC6C", "#4675ED", "#00B8D4"], "scene": "strata", "opts": {"drill": 1}}, {"n": 2, "title": "Mô hình thông tin công trình (BIM) & Kiểm tra xung đột hệ thống (Clash Detection)", "code": "EPC-SPEC-02-BIM", "dur": "15 000 ms", "part": "I", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>ISO 19650-1/-2:2018<\/td><td>Quản lý thông tin giai đoạn chuyển giao (thiết kế &amp; thi công)<\/td><\/tr><tr><td>ISO 19650-3:2020<\/td><td>Giai đoạn vận hành<\/td><\/tr><tr><td>BIMForum LOD Specification (bản hiện hành)<\/td><td>Định nghĩa LOD 100–500<\/td><\/tr><tr><td>Quyết định 258/QĐ-TTg (2023)<\/td><td>Lộ trình áp dụng BIM tại Việt Nam<\/td><\/tr><tr><td>NBIMS-US / COBie<\/td><td>Chuẩn trao đổi dữ liệu tài sản<\/td><\/tr><tr><td>IFC 4.3 (ISO 16739-1)<\/td><td>Định dạng trao đổi mở<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị yêu cầu<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>LOD thiết kế kỹ thuật<\/td><td>LOD 300<\/td><td>R<\/td><\/tr><tr><td>LOD phối hợp thi công / shop drawing<\/td><td><strong>LOD 350<\/strong> (có kết nối, gối đỡ, giá treo)<\/td><td>H trước khi phát hành bản vẽ thi công<\/td><\/tr><tr><td>LOD chế tạo sẵn (cốt thép, ống MEP, module mặt dựng)<\/td><td><strong>LOD 400<\/strong><\/td><td>H<\/td><\/tr><tr><td>LOD hoàn công bàn giao<\/td><td><strong>LOD 500<\/strong> — đối chiếu quét laser, sai lệch hình học ≤ ±10 mm<\/td><td>H<\/td><\/tr><tr><td>Xung đột cứng (hard clash) kết cấu – MEP<\/td><td><strong>0 xung đột chưa giải quyết<\/strong> khi phát hành<\/td><td>H<\/td><\/tr><tr><td>Dung sai phát hiện va chạm Navisworks<\/td><td>Tolerance = 0 mm (hard), 25 mm (clearance có bảo ôn), 600 mm (vùng bảo trì)<\/td><td>W<\/td><\/tr><tr><td>Chu kỳ họp phối hợp<\/td><td>1 lần/tuần; mọi clash phải có người chịu trách nhiệm và hạn xử lý ≤ 10 ngày<\/td><td>R<\/td><\/tr><tr><td>Độ cao thông thủy hành lang sau trần<\/td><td>≥ 2 600 mm (Spec dự án)<\/td><td>H<\/td><\/tr><tr><td>Quy ước đặt tên tệp<\/td><td>Theo ISO 19650-2 National Annex: <code>Dự án-Đơn vị-Khối-Tầng-Loại-Vai trò-Số<\/code><\/td><td>R<\/td><\/tr><tr><td>Trạng thái thông tin CDE<\/td><td>WIP → Shared (S1–S4) → Published (A) → Archived<\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Tích hợp hình học, thuộc tính vật liệu, tiến độ 4D và chi phí 5D vào Môi trường dữ liệu chung (CDE) theo ISO 19650.", "Quét tự động 100% va chạm giữa ống gió HVAC, ống chữa cháy, máng cáp và dầm/cột; mục tiêu 0 clash khi phát hành.", "Xuất bản vẽ chế tạo LOD 400 cho cốt thép và MEP; mô hình hoàn công LOD 500 đối chiếu quét laser ±10 mm."], "vis": "<ul><li><strong>Macro Wireframe Hologram<\/strong> lơ lửng trong không gian <code class=\"hex\"><i style=\"background:#05080D\"><\/i>#05080D<\/code>; camera quỹ đạo tròn bán kính 80 m quanh mô hình, tốc độ 6°/s, ống kính 35 mm, depth-of-field f/2.8 lấy nét vào tầng 23.<\/li><li>Mô hình tháp: nét <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code>, mặt kính ghost 15%. MEP theo bảng màu mục 0.3.5.<\/li><li>Khi clash: khối giao nhau phát sáng <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> emissive 8.0, viền bùng nổ hạt (burst) 300 particles, kèm nhãn <code>CLASH #0412 — Ø300 CHWS × Dầm D2 600×900<\/code>.<\/li><\/ul>", "tl": [[0, 1600, "Lớp kiến trúc hiện mờ (opacity 0 → 15%), quét đường chân trời từ đỉnh xuống"], [1600, 3600, "Lớp kết cấu BTCT lồng vào từ dưới lên, mỗi tầng trễ 30 ms (55 tầng = 1 650 ms)"], [3600, 6000, "Ống MEP bay vào từ 4 phía theo đường cong ease-out-expo, mỗi hệ thống trễ 240 ms"], [6000, 7200, "37 điểm clash bật sáng đỏ đồng thời, bộ đếm <code>CLASHES: 37<\/code> đỏ"], [7200, 10400, "Từng ống dịch chuyển né (offset Z hoặc đổi tuyến), mỗi điểm chuyển <code>#D50000 → #00C853<\/code> trong 200 ms; bộ đếm giảm về <code>0<\/code>"], [10400, 12000, "Mô hình \"chẻ\" thành bản vẽ chế tạo 2D trượt ra (spool drawing có mã QR)"]], "bim": "<ul><li>Ma trận clash (Clash Matrix) ưu tiên: Kết cấu &gt; Thoát nước trọng lực &gt; Ống gió chính &gt; Chữa cháy &gt; Nước lạnh &gt; Máng cáp &gt; Ống nhỏ &lt; Ø50.<\/li><li>Trạng thái clash: New <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>, Active <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code>, Reviewed <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>, Approved <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>, Resolved <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>.<\/li><li>4D: màu thi công theo tuần — đang thi công <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>, hoàn thành <code class=\"hex\"><i style=\"background:#9A9893\"><\/i>#9A9893<\/code>, trễ tiến độ <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Không phát hành bản vẽ thi công khi báo cáo clash còn trạng thái New/Active.<\/li><li><strong>Điểm mù 1:<\/strong> Clash \"mềm\" — ống không va dầm nhưng không còn chỗ tháo bảo ôn, mở van, rút cuộn coil FCU. Bắt buộc mô hình hóa vùng bảo trì (maintenance envelope).<\/li><li><strong>Điểm mù 2:<\/strong> Độ võng dầm và độ dốc ống thoát nước (1–2%) không có trong mô hình — phải mô hình ống thoát nước có độ dốc thực.<\/li><li><strong>Điểm mù 3:<\/strong> Gán nhầm LOD 500 cho mô hình thiết kế — gây tranh chấp hợp đồng khi bàn giao.<\/li><\/ul>", "quote": "Trên mô hình phối hợp LOD 350 này, mỗi xung đột được giải quyết bằng một cú nhấp chuột, thay vì một mũi khoan phá vào bê tông đã đông cứng. Ba mươi bảy điểm đỏ trên màn hình là ba mươi bảy lệnh thay đổi, ba mươi bảy lần chậm tiến độ mà chúng ta đã xóa bỏ ngay từ bàn làm việc. Và khi tòa nhà hoàn thành, mô hình LOD 500 đã đối chiếu với quét laser sẽ trở thành bản sao số trung thực đến từng centimet để vận hành suốt năm mươi năm.", "sw": ["#05080D", "#00E5FF", "#D50000", "#FFAB00", "#00B8D4", "#7E57C2", "#00C853", "#FFC400", "#9A9893"], "scene": "tower", "opts": {"mode": "clash"}}, {"n": 3, "title": "Thiết kế kết cấu chịu tải trọng động lực học (Gió bão cực đoan & Động đất)", "code": "EPC-SPEC-03-DYN", "dur": "15 000 ms", "part": "I", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 2737:2023<\/td><td>Tải trọng và tác động — gió, thành phần động<\/td><\/tr><tr><td>ASCE 7-22 Ch. 26–31<\/td><td>Tải trọng gió, quy trình hầm gió (Ch. 31)<\/td><\/tr><tr><td>ASCE 49-21<\/td><td>Thí nghiệm hầm gió cho công trình<\/td><\/tr><tr><td>TCVN 9386:2012 (Eurocode 8)<\/td><td>Thiết kế công trình chịu động đất<\/td><\/tr><tr><td>ISO 10137:2007 / ISO 6897<\/td><td>Tiêu chí tiện nghi gia tốc người sử dụng<\/td><\/tr><tr><td>ASCE 41 / LATBSDC / PEER TBI<\/td><td>Phân tích phi tuyến theo lịch sử thời gian<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ghi chú<\/th><\/tr><\/thead><tbody><tr><td>Áp lực gió cơ sở<\/td><td>Theo vùng gió TCVN 2737:2023, chu kỳ lặp 50 năm cho cường độ; quy đổi 100 năm cho kiểm tra công trình quan trọng<\/td><td>Hệ số chuyển đổi chu kỳ theo phụ lục tiêu chuẩn<\/td><\/tr><tr><td>Tỷ lệ mô hình hầm gió<\/td><td>1 : 400, dòng biên khí quyển đúng địa hình bán kính 600 m<\/td><td>Phương pháp HFFB + áp lực bề mặt (≥ 600 điểm đo)<\/td><\/tr><tr><td>Hướng gió thí nghiệm<\/td><td>36 hướng, bước 10°<\/td><td><\/td><\/tr><tr><td>Chuyển vị đỉnh do gió<\/td><td>≤ H/500 = 440 mm<\/td><td>Kiểm tra trạng thái sử dụng<\/td><\/tr><tr><td>Chuyển vị lệch tầng do gió<\/td><td>≤ h/400<\/td><td><\/td><\/tr><tr><td>Gia tốc đỉnh tháp, chu kỳ lặp 10 năm<\/td><td>Căn hộ ≤ <strong>15 milli-g<\/strong> (0,15 m/s²); văn phòng ≤ <strong>25 milli-g<\/strong><\/td><td>ISO 10137 / CTBUH<\/td><\/tr><tr><td>Chu kỳ dao động riêng T₁<\/td><td>≈ 5,0–5,8 s (ước lượng H/40)<\/td><td>Sai lệch FEA–đo thực tế ≤ ±15%<\/td><\/tr><tr><td>Chuyển vị lệch tầng động đất<\/td><td>d_r·ν ≤ 0,005 h (TCVN 9386 — bộ phận phi kết cấu giòn)<\/td><td>ν = 0,4–0,5<\/td><\/tr><tr><td>Số bản ghi gia tốc nền NLTHA<\/td><td>≥ 7 cặp (lấy trung bình) hoặc 11 cặp theo ASCE 7-22<\/td><td>Hiệu chỉnh phổ khớp 0,2T–2,0T<\/td><\/tr><tr><td>Khối lượng TMD<\/td><td>0,5–1,5% khối lượng dạng dao động thứ nhất (≈ 400–600 t)<\/td><td>Tần số điều chỉnh f_TMD/f₁ ≈ 0,97–0,99<\/td><\/tr><tr><td>Tỷ số cản TMD tối ưu<\/td><td>8–12%<\/td><td>Hành trình tối đa ±1,2 m, có khóa an toàn<\/td><\/tr><tr><td>Hiệu quả giảm gia tốc<\/td><td>30–45%<\/td><td>Kiểm chứng bằng đo dao động môi trường sau khi lắp<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Thí nghiệm hầm gió 1:400, 36 hướng, đo lực móng cao tần (HFFB) và áp lực bề mặt mặt dựng; kiểm soát xoáy Kármán (vortex shedding).", "Giảm chấn khối lượng TMD 500 t trên tầng mái: giảm 30–45% gia tốc đỉnh, đưa về ≤ 15 milli-g cho căn hộ.", "Phân tích phi tuyến lịch sử thời gian (NLTHA) với ≥ 7 cặp băng gia tốc nền; kiểm soát lệch tầng ≤ 0,5% chiều cao tầng."], "vis": "<ul><li><strong>Dynamic Wind Simulation View:<\/strong> camera tĩnh 3/4, ống kính 85 mm nén phối cảnh, tháp chiếm 70% chiều cao khung.<\/li><li>Dòng gió CFD dạng streamline: vận tốc thấp <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code>, vận tốc cao <code class=\"hex\"><i style=\"background:#F3C63A\"><\/i>#F3C63A<\/code>, vùng xoáy áp lực âm đỏ đậm <code class=\"hex\"><i style=\"background:#7A0403\"><\/i>#7A0403<\/code> bám hai mép khuất gió, xoáy rời luân phiên với tần số Strouhal St ≈ 0,12.<\/li><li><strong>Cận cảnh TMD:<\/strong> khối thép-bê tông nặng hình hộp 9 × 9 × 4 m (hoặc con lắc cầu), treo bằng 8 dây cáp, 8 giảm chấn nhớt thủy lực chrome <code class=\"hex\"><i style=\"background:#B8BDC4\"><\/i>#B8BDC4<\/code>, lò xo hồi vị. Ống kính 24 mm, f/4, ánh sáng xanh lạnh 6 500 K.<\/li><\/ul>", "tl": [[0, 1500, "Streamline tràn từ trái sang phải, mật độ 4 000 đường, tốc độ hạt tăng dần"], [1500, 4000, "Tháp uốn cong (biến dạng phóng đại ×200), dao động theo chu kỳ 5,4 s (tua nhanh ×2 → 2,7 s/chu kỳ)"], [4000, 6500, "Heatmap ứng suất trên lõi và cột chân tháp chuyển <code>#4675ED → #F3C63A → #D23105<\/code> tại cột góc tầng 1–5"], [6500, 9000, "TMD được kích hoạt: khối dao động ngược pha 180° (vẽ véc-tơ vận tốc <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code>), biên độ đỉnh tháp giảm từ 100% → 58% (đồ thị phổ gia tốc chạy góc phải)"], [9000, 12000, "Heatmap hạ về <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code>; nhãn <code>a_peak = 13.8 milli-g ≤ 15 milli-g — PASS<\/code> <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>"]], "bim": "<ul><li>Trường áp lực mặt dựng: thang phân kỳ −3,5 kPa <code class=\"hex\"><i style=\"background:#2166AC\"><\/i>#2166AC<\/code> → 0 <code class=\"hex\"><i style=\"background:#F7F7F7\"><\/i>#F7F7F7<\/code> → +2,5 kPa <code class=\"hex\"><i style=\"background:#B2182B\"><\/i>#B2182B<\/code>.<\/li><li>Mô hình FEA: ETABS/Midas Gen, sàn phần tử shell cứng vô hạn trong mặt phẳng (rigid diaphragm) chỉ cho phân tích tổng thể, độ cứng nứt: cột 0,7EI, vách 0,7EI (không nứt)/0,35EI (nứt), dầm 0,35EI, sàn 0,25EI.<\/li><li>Phổ gia tốc: đường trước TMD <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>, sau TMD <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>, ngưỡng tiện nghi nét đứt <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Báo cáo hầm gió phải được kỹ sư kết cấu đối chiếu với tải gió theo tiêu chuẩn; kết quả hầm gió không được thấp hơn 80% giá trị tiêu chuẩn mà không có thẩm tra độc lập (tham khảo ASCE 7-22 §31.4).<\/li><li><strong>Điểm mù 1:<\/strong> Hiệu ứng nhóm nhà (interference) của các tháp lân cận tương lai — chạy hầm gió với kịch bản quy hoạch tương lai.<\/li><li><strong>Điểm mù 2:<\/strong> TMD bị lệch tần số do khối lượng thực tế công trình khác thiết kế — thiết kế TMD có khả năng hiệu chỉnh ±10% tần số sau khi đo dao động thực tế.<\/li><li><strong>Điểm mù 3:<\/strong> Hiệu ứng P-Δ và co ngắn cột (column shortening) không đưa vào mô hình.<\/li><\/ul>", "quote": "Một tòa tháp hai trăm hai mươi mét không phải là một khối đá tĩnh tại; nó là một cơ thể đàn hồi dao động với chu kỳ năm giây rưỡi trước mỗi cơn cuồng phong. Hầm gió cho chúng ta biết cơn bão sẽ tấn công ở đâu, phân tích phi tuyến cho chúng ta biết kết cấu sẽ chảy dẻo ở đâu. Và năm trăm tấn thép treo trên đỉnh tháp kia — bộ giảm chấn TMD — chính là trái tim thứ hai, đập ngược nhịp với gió để cư dân tầng năm mươi vẫn bình thản rót một ly nước mà không gợn sóng.", "sw": ["#4675ED", "#F3C63A", "#7A0403", "#B8BDC4", "#2166AC", "#F7F7F7", "#B2182B", "#D50000", "#00C853", "#FFC400"], "scene": "tower", "opts": {"mode": "sway"}}, {"n": 4, "title": "Tiến độ tổng thể đường găng (CPM) & Tổ chức thi công mặt bằng hẹp đô thị", "code": "EPC-SPEC-04-PLN", "dur": "15 000 ms", "part": "I", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>AACE RP 29R-03 / 49R-06<\/td><td>Phân tích tiến độ, xác định đường găng<\/td><\/tr><tr><td>DCMA 14-Point Assessment<\/td><td>Kiểm định chất lượng tiến độ<\/td><\/tr><tr><td>PMI Practice Standard for Scheduling<\/td><td>Lập tiến độ CPM<\/td><\/tr><tr><td>TCVN 4055:2012<\/td><td>Tổ chức thi công<\/td><\/tr><tr><td>QCVN 18:2021/BXD<\/td><td>An toàn trong thi công xây dựng<\/td><\/tr><tr><td>Nghị định 06/2021/NĐ-CP<\/td><td>Quản lý chất lượng, thi công và bảo trì<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Chỉ số DCMA / Logistics<\/th><th>Ngưỡng chấp nhận<\/th><\/tr><\/thead><tbody><tr><td>Hoạt động thiếu liên kết logic (Missing Logic)<\/td><td>≤ 5%<\/td><\/tr><tr><td>Quan hệ Lead (độ trễ âm)<\/td><td>0%<\/td><\/tr><tr><td>Lag<\/td><td>≤ 5%<\/td><\/tr><tr><td>Quan hệ khác FS (SS, FF, SF)<\/td><td>≤ 10% (SF = 0)<\/td><\/tr><tr><td>Ràng buộc cứng (Hard Constraints)<\/td><td>≤ 5%<\/td><\/tr><tr><td>Dự trữ lớn (Total Float &gt; 44 ngày làm việc)<\/td><td>≤ 5%<\/td><\/tr><tr><td>Dự trữ âm (Negative Float)<\/td><td>0<\/td><\/tr><tr><td>Hoạt động thời lượng &gt; 44 ngày<\/td><td>≤ 5%<\/td><\/tr><tr><td>Critical Path Test / CPLI<\/td><td>CPLI ≥ 0,95<\/td><\/tr><tr><td>BEI (Baseline Execution Index)<\/td><td>≥ 0,95<\/td><\/tr><tr><td>Mức độ chi tiết<\/td><td>WBS ≤ 6 cấp, hoạt động 5–20 ngày<\/td><\/tr><tr><td>Cập nhật tiến độ<\/td><td>Hàng tuần (look-ahead 3 tuần), báo cáo EVM hàng tháng: SPI, CPI ∈ [0,95 ; 1,05]<\/td><\/tr><tr><td>Cửa sổ giao vật tư JIT<\/td><td>±15 phút so với khung giờ đặt; ngoài giờ cao điểm (cấm xe tải 6h–9h, 16h–20h theo quy định địa phương)<\/td><\/tr><tr><td>Tồn kho thép tại công trường<\/td><td>≤ 3 ngày thi công<\/td><\/tr><tr><td>Diện tích kho bãi tạm / mặt bằng<\/td><td>Hệ số sử dụng mặt bằng ≤ 0,8 (dành ≥ 20% cho đường nội bộ &amp; PCCC)<\/td><\/tr><tr><td>Bán kính quay đầu xe bơm/xe 40 ft<\/td><td>≥ 12 m, đường nội bộ rộng ≥ 6 m, tải trọng ≥ 30 t/trục kép<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Mạng logic CPM trên Primavera P6, kiểm định 14 chỉ số DCMA; đường găng: tường vây → đào đất → móng bè → lõi → sàn điển hình → mặt dựng → T&amp;C.", "Quy hoạch mặt bằng động theo 4 giai đoạn: kho thép, bãi cẩu, trạm trộn dự phòng, cổng vào/ra một chiều với cầu rửa xe.", "Logistics JIT: cửa sổ giao hàng ±15 phút, tồn kho ≤ 3 ngày, tránh hoàn toàn khung giờ cấm tải đô thị."], "vis": "<ul><li><strong>Top-down Orthographic Time-lapse:<\/strong> camera trực giao trên cao 300 m, khung bao lô đất 80 × 70 m.<\/li><li>Xe tải là icon khối 3D <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> chạy trên tuyến <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>; tuyến cấm ở giờ cao điểm chuyển <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> mờ.<\/li><li>Nửa dưới màn hình: biểu đồ Gantt tối, thanh công việc găng <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>, không găng <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code>, dự trữ dạng thanh mảnh <code class=\"hex\"><i style=\"background:#90A4AE\"><\/i>#90A4AE<\/code>, milestone hình thoi <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> phát sáng.<\/li><\/ul>", "tl": [[0, 1200, "Mặt bằng trắng, ranh giới lô đất vẽ nét <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> chạy vòng 1 200 ms"], [1200, 4000, "Các phân khu hiện theo thứ tự tối ưu: cẩu tháp (vòng bán kính 65 m), kho thép, lán trại, trạm bơm, cổng; mỗi khối \"drop-in\" 280 ms"], [4000, 7500, "Đồng hồ 24 h tua: 06:00–09:00 cổng đỏ; 22:00–05:00 dòng xe dày đặc; mũi tên luồng vật tư sáng nhịp nhàng 1 Hz"], [7500, 10500, "Gantt chạy, vạch \"Data Date\" quét sang phải; đường găng sáng đỏ liên tục, milestone \"Cất nóc\" nhấp sáng vàng"], [10500, 12000, "Bảng DCMA 14 chỉ số chuyển xanh lần lượt mỗi 100 ms"]], "bim": "<ul><li>4 giai đoạn mặt bằng: Phần ngầm <code class=\"hex\"><i style=\"background:#6D4C41\"><\/i>#6D4C41<\/code>, Thân <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code>, Mặt dựng <code class=\"hex\"><i style=\"background:#7FB3B5\"><\/i>#7FB3B5<\/code>, Hoàn thiện <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>.<\/li><li>Vùng cẩu quét (crane swing zone) bán kính 65 m: <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code> opacity 12%; vùng chồng lấn hai cẩu: <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> opacity 20% (bắt buộc hệ chống va chạm cẩu).<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Baseline tiến độ chỉ được phê duyệt khi đạt ≥ 12/14 chỉ số DCMA.<\/li><li><strong>Điểm mù 1:<\/strong> Thời gian phê duyệt hồ sơ vật liệu, mẫu (submittal) và thời gian sản xuất hàng đặt riêng (thang máy 9–12 tháng, máy biến áp 6–8 tháng, chiller 5–7 tháng) không nằm trong CPM.<\/li><li><strong>Điểm mù 2:<\/strong> Mùa mưa và ngày cấm thi công (lễ, sự kiện) không được đưa vào lịch làm việc.<\/li><li><strong>Điểm mù 3:<\/strong> Dự trữ bị \"giấu\" vào lag — kiểm tra lag &gt; 0 ở mọi quan hệ.<\/li><\/ul>", "quote": "Mặt bằng chật hẹp giữa lòng đô thị là bài toán tử huyệt của mọi tổng thầu: không có chỗ để sai, không có chỗ để chứa. Đường găng trên Primavera không phải là một bức tranh, nó là một bản hợp đồng với thời gian — mỗi ngày trễ trên đường găng là một ngày trễ của toàn dự án. Khi xe thép đến đúng mười lăm phút trước lúc cẩu rảnh tay, khi đó chúng ta mới thực sự điều khiển được nhịp đập của công trường.", "sw": ["#FFC400", "#00C853", "#D50000", "#4675ED", "#90A4AE", "#6D4C41", "#7FB3B5", "#FFAB00"], "scene": "plan", "opts": {}}, {"n": 5, "title": "Hệ thống trắc đạc (GNSS / Robotic Total Station) và quan trắc lún mốc chuẩn", "code": "EPC-SPEC-05-SUR", "dur": "15 000 ms", "part": "I", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 9398:2012<\/td><td>Công tác trắc địa trong xây dựng — yêu cầu chung<\/td><\/tr><tr><td>TCVN 9360:2012<\/td><td>Quan trắc độ lún nhà và công trình bằng thủy chuẩn hình học<\/td><\/tr><tr><td>TCVN 9400:2012<\/td><td>Quan trắc độ nghiêng công trình dạng tháp<\/td><\/tr><tr><td>TCVN 9364:2012<\/td><td>Nhà cao tầng — kỹ thuật đo đạc phục vụ thi công<\/td><\/tr><tr><td>ACI 117-10 (R2015)<\/td><td>Dung sai thi công bê tông<\/td><\/tr><tr><td>EN 81-20<\/td><td>Dung sai giếng thang máy<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị chuẩn<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Máy toàn đạc robot<\/td><td>Độ chính xác góc <strong>0,5\"–1\"<\/strong>, cạnh 0,6 mm + 1 ppm<\/td><td>Kiểm định ≤ 12 tháng<\/td><\/tr><tr><td>GNSS đa tần (lưới cơ sở)<\/td><td>Tĩnh: mặt bằng 3 mm + 0,5 ppm, cao độ 5 mm + 0,5 ppm<\/td><td>Đo ≥ 2 ca<\/td><\/tr><tr><td>Lưới khống chế cơ sở<\/td><td>Sai số trung phương vị trí điểm ≤ 5 mm<\/td><td>R<\/td><\/tr><tr><td>Chuyển trục lên tầng bằng máy chiếu đứng laser<\/td><td>Độ chính xác 1/200 000 (≈ 1 mm/200 m)<\/td><td>Mỗi tầng, 4 điểm trục<\/td><\/tr><tr><td>Sai số chuyển trục giữa hai tầng<\/td><td>≤ ±2 mm<\/td><td>W<\/td><\/tr><tr><td>Sai số chuyển cao độ qua tầng<\/td><td>≤ ±3 mm/tầng; tích lũy ≤ ±15 mm toàn tháp<\/td><td>W<\/td><\/tr><tr><td>Độ thẳng đứng tổng thể tháp<\/td><td>Spec dự án ≤ H/2 000 và ≤ 100 mm (ACI 117 cho phép H/1 000, ≤ 150 mm)<\/td><td>H khi cất nóc<\/td><\/tr><tr><td>Thủy chuẩn quan trắc lún<\/td><td>Hạng I: sai số khép ≤ ±0,3√n mm (n = số trạm)<\/td><td>Chu kỳ theo tầng<\/td><\/tr><tr><td>Chu kỳ quan trắc lún<\/td><td>Mỗi 3 tầng thi công trong giai đoạn thân; 3 tháng/lần sau cất nóc; đến khi tốc độ lún ≤ 0,02 mm/ngày<\/td><td>R<\/td><\/tr><tr><td>Ngưỡng cảnh báo lún công trình lân cận<\/td><td>Xanh &lt; 10 mm; Vàng 10–20 mm; Đỏ ≥ 25 mm hoặc độ nghiêng ≥ 1/500<\/td><td>Theo ngày khi đào hầm<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Lưới khống chế 3 cấp gắn mốc quốc gia VN-2000; mốc chuẩn sâu (deep benchmark) đặt ngoài vùng ảnh hưởng lún ≥ 2 lần chiều sâu hố đào.", "Toàn đạc robot 0,5\" + GNSS đa tần; chuyển trục bằng máy chiếu đứng laser 1/200 000 qua lỗ chừa 150 × 150 mm mỗi sàn.", "Hiệu chỉnh co ngắn cột, lún móng và dao động nhiệt: đo vào khung giờ 5h–7h sáng, sai số tích lũy toàn tháp ≤ H/2 000."], "vis": "<ul><li><strong>Laser Beam Perspective:<\/strong> camera đặt ngay sau máy chiếu đứng ở tầng hầm, nhìn thẳng lên qua chuỗi lỗ chừa sàn (tunnel effect), ống kính 14 mm, f/11 để giữ nét toàn chiều sâu.<\/li><li>Chùm laser <code class=\"hex\"><i style=\"background:#1DE9B6\"><\/i>#1DE9B6<\/code> dày 3 mm, volumetric fog 4%, tán xạ bụi lơ lửng; tại mỗi sàn có bia mục tiêu kỹ thuật số dạng vòng tròn đồng tâm <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> (vòng trong Ø 4 mm = vùng đạt).<\/li><li>Cảnh phụ: toàn đạc robot xoay 360°, lăng kính 360° trên cột phản xạ chớp sáng.<\/li><\/ul>", "tl": [[0, 1000, "Màn tối; điểm laser bật sáng ở mốc gốc kèm âm \"ping\""], [1000, 3500, "Tia laser phóng thẳng lên qua 55 sàn, mỗi sàn chớp bia mục tiêu (45 ms/sàn)"], [3500, 6000, "Toàn đạc robot quét góc cột; tọa độ XYZ chạy dạng luồng số <code>X=12 345.678 Y=…<\/code> cập nhật 25 lần/s"], [6000, 9000, "Đồ thị sai lệch trục theo chiều cao: đường đo <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code> nằm trong ống dung sai <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code> ±H/2 000; điểm thử vượt ngưỡng đổi <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> rồi được hiệu chỉnh"], [9000, 12000, "Bản đồ lún đẳng trị trên mặt móng (contour 2 mm), lún cực đại 38 mm ở lõi, lún lệch 1/1 200 — nhãn PASS"]], "bim": "<ul><li>Contour lún: 0 mm <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code> → 25 mm <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code> → 50 mm <code class=\"hex\"><i style=\"background:#F3C63A\"><\/i>#F3C63A<\/code> → ≥ 80 mm <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code>.<\/li><li>Tầm nhìn đo đạc: đường ngắm toàn đạc nét đứt <code class=\"hex\"><i style=\"background:#1DE9B6\"><\/i>#1DE9B6<\/code>, điểm kiểm soát hình tam giác <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Mỗi tầng chỉ được đổ bê tông cột/vách khi biên bản chuyển trục và cao độ được TVGS ký.<\/li><li><strong>Điểm mù 1:<\/strong> Co ngắn khác biệt giữa lõi và cột biên (differential shortening) có thể đạt 20–40 mm ở tháp 200 m — phải cộng bù cao độ (compensation) từng tầng theo dự báo creep/shrinkage.<\/li><li><strong>Điểm mù 2:<\/strong> Tháp nghiêng do bức xạ nhiệt một phía buổi chiều — chỉ đo trục vào sáng sớm, nhiệt độ ổn định.<\/li><li><strong>Điểm mù 3:<\/strong> Mốc chuẩn đặt trong vùng ảnh hưởng hạ nước ngầm — mốc tự lún theo công trình.<\/li><\/ul>", "quote": "Sai số một mi-li-mét ở tầng một, nếu không được kiểm soát, sẽ khuếch đại thành năm, mười centimet ở tầng năm mươi lăm — và thang máy tốc độ cao sẽ không chạy nổi trong một giếng thang cong. Chùm laser một phần hai trăm nghìn này là đôi mắt thần đi xuyên qua từng tầng sàn. Nhưng hãy nhớ: chúng ta đo vào lúc bình minh, khi tòa tháp chưa bị mặt trời uốn cong, và chúng ta luôn cộng bù độ co ngắn của bê tông trước khi nó kịp xảy ra.", "sw": ["#1DE9B6", "#FFC400", "#4675ED", "#61FC6C", "#F3C63A", "#D23105"], "scene": "tower", "opts": {"mode": "laser"}}, {"n": 6, "title": "Thi công tường vây Barrette (Diaphragm Wall) chống sạt lở tầng hầm sâu", "code": "EPC-SPEC-06-DWL", "dur": "15 000 ms", "part": "II", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>EN 1538:2010+A1:2015<\/td><td>Thi công công trình địa kỹ thuật đặc biệt — tường trong đất<\/td><\/tr><tr><td>TCVN 9395:2012<\/td><td>Cọc khoan nhồi — thi công và nghiệm thu (yêu cầu dung dịch khoan)<\/td><\/tr><tr><td>API RP 13B-1<\/td><td>Phương pháp thí nghiệm dung dịch khoan gốc nước<\/td><\/tr><tr><td>TCVN 4453:1995 / TCVN 5574:2018<\/td><td>Bê tông cốt thép toàn khối, thiết kế BTCT<\/td><\/tr><tr><td>ICE SPERW (3rd ed.)<\/td><td>Chỉ dẫn kỹ thuật thi công tường trong đất<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Dung sai / Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Chiều sâu tường<\/td><td>45–55 m (dự án: 50 m), ngàm vào sét cứng ≥ 5 m<\/td><td>−0 / +300 mm<\/td><td>H<\/td><\/tr><tr><td>Chiều dày panel<\/td><td>0,8–1,5 m (dự án: 1,2 m)<\/td><td>−0 / +50 mm<\/td><td>W<\/td><\/tr><tr><td>Chiều dài panel<\/td><td>2,8–6,5 m (1 – 3 lần ngoạm)<\/td><td>±50 mm<\/td><td>W<\/td><\/tr><tr><td>Độ thẳng đứng<\/td><td>Gàu ngoạm: ≤ 1/300; Hydrofraise có inclinometer: ≤ 1/500<\/td><td>Đo Koden/Sonic mỗi panel<\/td><td>H<\/td><\/tr><tr><td>Tường dẫn (guide wall)<\/td><td>Khoảng hở = chiều dày + 50 mm, sai số mặt trong ±10 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td><strong>Bentonite tươi<\/strong><\/td><td>Tỷ trọng 1,02–1,10 g/cm³; độ nhớt Marsh 32–50 s; pH 7–11; lượng mất nước ≤ 30 ml/30 min<\/td><td><\/td><td>W mỗi mẻ<\/td><\/tr><tr><td><strong>Bentonite trước khi đổ bê tông<\/strong><\/td><td>Tỷ trọng ≤ 1,15 g/cm³; hàm lượng cát ≤ 4%; độ nhớt Marsh ≤ 50 s<\/td><td>Lấy mẫu đáy hố cách đáy 0,5 m<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Mực dung dịch<\/td><td>Cao hơn mực nước ngầm ≥ 1,5 m, cách mặt tường dẫn ≤ 0,5 m<\/td><td>Liên tục<\/td><td>W<\/td><\/tr><tr><td>Bê tông<\/td><td>B35, độ sụt 180–220 mm, hạt cốt liệu ≤ 20 mm, xi măng ≥ 400 kg/m³<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Ống Tremie<\/td><td>Ø 250–300 mm, chôn trong bê tông ≥ 2 m (tối thiểu 1,5 m), khoảng cách ống ≤ 3 m<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Tốc độ dâng bê tông<\/td><td>≥ 3 m/h<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Đổ vượt cao độ cắt đầu<\/td><td>≥ 0,8–1,0 m<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Lớp bê tông bảo vệ<\/td><td>75 mm (con kê bê tông dạng bánh xe)<\/td><td>−0 / +15 mm<\/td><td>W<\/td><\/tr><tr><td>Gioăng chống thấm mối nối<\/td><td>Waterstop CWS/PVC 300 mm liên tục toàn chiều sâu<\/td><td><\/td><td>H<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Đào bằng gàu ngoạm thủy lực hoặc Hydrofraise có cảm biến nghiêng; độ thẳng đứng ≤ 1/300 – 1/500.", "Dung dịch Bentonite duy trì cao hơn nước ngầm ≥ 1,5 m; trước khi đổ bê tông: γ ≤ 1,15 g/cm³, cát ≤ 4%.", "Hạ lồng thép 20–35 t, đổ bê tông B35 qua ống Tremie chôn sâu ≥ 2 m, đẩy dung dịch thu hồi về trạm lọc."], "vis": "<ul><li><strong>Underground Cross-section Split View:<\/strong> khung chia đôi dọc — nửa trái là mặt đất công trường thực (ống kính 35 mm, f/5.6, giờ vàng 17h), nửa phải là mặt cắt lòng đất X-ray.<\/li><li>Gàu ngoạm 12 t với hàm răng thép <code class=\"hex\"><i style=\"background:#7A7F87\"><\/i>#7A7F87<\/code>, bùn sét dính <code class=\"hex\"><i style=\"background:#5D6D7E\"><\/i>#5D6D7E<\/code>; dung dịch Bentonite <code class=\"hex\"><i style=\"background:#B5838D\"><\/i>#B5838D<\/code> bán trong, SSS 0.6, hạt cát lơ lửng.<\/li><li>Hệ ống tuần hoàn → trạm desander (sàng rung, xyclon) ở rìa khung, dòng chảy được vẽ bằng mũi tên hạt <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>.<\/li><\/ul>", "tl": [[0, 1200, "Tường dẫn BTCT hiện lên, nét đo khoảng hở <code>1 250 mm<\/code>"], [1200, 4000, "Gàu ngoạm hạ – ngoạm – kéo 3 chu kỳ (mỗi chu kỳ 930 ms), độ sâu chạy 0 → 50 m; dung dịch dâng bù theo"], [4000, 5500, "Đầu đo sóng siêu âm Koden quét vách hố, biểu đồ thẳng đứng 1/420 PASS"], [5500, 8000, "Cẩu hạ lồng thép 3 đốt (nối bằng cóc U), ánh kim loại phản chiếu đèn; gioăng CWS trượt vào mối nối"], [8000, 11000, "2 ống Tremie rót bê tông <code class=\"hex\"><i style=\"background:#6E6A64\"><\/i>#6E6A64<\/code>, mặt bê tông dâng dạng nấm (mushroom), dung dịch Bentonite bị đẩy lên và hút về trạm; vạch đo \"chôn ống 2,4 m\" <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>"], [11000, 12000, "Panel hoàn chỉnh khớp với panel kế bên, ghép thành vòng tường vây"]], "bim": "<ul><li>Mô phỏng chất lỏng: Bentonite là chất lỏng Bingham, ứng suất chảy 5–15 Pa; bê tông tươi Bingham ứng suất chảy 200–400 Pa, nhớt dẻo 20–60 Pa·s (Houdini FLIP, voxel 2 cm).<\/li><li>Áp lực dung dịch lên vách: véc-tơ <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>; áp lực đất chủ động: véc-tơ <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code>; cân bằng hiển thị FS ≥ 1,2.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Kiểm tra bentonite đáy hố + đo độ sâu + độ thẳng đứng trước khi hạ lồng thép.<\/li><li><strong>Điểm mù 1:<\/strong> Bê tông bị nhiễm bentonite tại mối nối panel (joint contamination) → rò nước khi đào. Bắt buộc chải rửa mối nối bằng bàn chải chuyên dụng đến khi sạch.<\/li><li><strong>Điểm mù 2:<\/strong> Thời gian từ khi đào xong đến khi đổ bê tông quá dài (&gt; 24 h) làm lắng cặn và tạo màng bánh bùn (filter cake) dày.<\/li><li><strong>Điểm mù 3:<\/strong> Hộp chờ (coupler box) cho dầm sàn tầng hầm bị lệch cao độ — sai số yêu cầu ±50 mm, kiểm tra trước khi hạ lồng.<\/li><\/ul>", "quote": "Tường vây Barrette là bức tường thành năm mươi mét đứng giữa hố đào của chúng ta và những nền móng của hàng xóm. Trong suốt quá trình đào, thứ duy nhất giữ vách đất không sụp đổ là một cột dung dịch bentonite màu hồng đất — vì vậy từng gam trên centimet khối của nó đều phải được đo. Một mối nối bị nhiễm bùn hôm nay sẽ là một vòi phun nước ngầm vào tầng hầm năm tầng ngày mai.", "sw": ["#7A7F87", "#5D6D7E", "#B5838D", "#00B8D4", "#D23105"], "scene": "strata", "opts": {"panel": 1}}, {"n": 7, "title": "Khoan cọc nhồi đường kính lớn (Bored Pile) và siêu âm kiểm tra khuyết tật cọc", "code": "EPC-SPEC-07-BPL", "dur": "15 000 ms", "part": "II", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 9395:2012 / EN 1536:2010+A1:2015<\/td><td>Thi công &amp; nghiệm thu cọc khoan nhồi<\/td><\/tr><tr><td>TCVN 10304:2014<\/td><td>Móng cọc — tiêu chuẩn thiết kế<\/td><\/tr><tr><td>TCVN 9396:2012 / ASTM D6760-16<\/td><td>Siêu âm truyền qua lỗ khoan (CSL)<\/td><\/tr><tr><td>TCVN 9393:2012 / ASTM D1143/D1143M-20<\/td><td>Thử tĩnh nén dọc trục<\/td><\/tr><tr><td>ASTM D8169/D8169M-18<\/td><td>Thử tải hai chiều (O-cell / Bi-directional)<\/td><\/tr><tr><td>ASTM D5882 / ASTM D4945<\/td><td>Biến dạng nhỏ PIT / Biến dạng lớn PDA<\/td><\/tr><tr><td>ASTM C1218 / TCVN 12252:2020<\/td><td>Khoan lõi kiểm tra mũi cọc<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Dung sai / Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Đường kính cọc<\/td><td>D1500 / D1800 / D2000<\/td><td>−0 / +50 mm (đo calliper)<\/td><td>W<\/td><\/tr><tr><td>Chiều sâu<\/td><td>Vào đá gốc ≥ 1,0D hoặc theo thiết kế (dự án: 78–90 m)<\/td><td>−0<\/td><td>H<\/td><\/tr><tr><td>Lệch tâm đầu cọc<\/td><td>≤ 75 mm (Spec dự án; EN 1536: ≤ 0,1D và ≤ 100 mm)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Độ nghiêng<\/td><td>≤ 1/200 (Spec dự án; TCVN 9395: ≤ 1%)<\/td><td>Đo Koden<\/td><td>H<\/td><\/tr><tr><td>Cặn lắng đáy hố (cọc chống)<\/td><td>≤ 50 mm (đo bằng quả dọi tạ + SoDeX)<\/td><td><\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Bentonite trước khi đổ<\/td><td>γ ≤ 1,15 g/cm³, cát ≤ 4%, Marsh 32–50 s<\/td><td><\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Ống siêu âm<\/td><td>Thép Ø 60/54 mm, số ống: D1500 → 4 ống; D2000 → 6 ống (ASTM D6760 khuyến nghị 1 ống / 0,25–0,30 m đường kính)<\/td><td>Kín nước, bơm đầy nước sạch trước đổ bê tông<\/td><td>W<\/td><\/tr><tr><td>Tỷ lệ siêu âm<\/td><td>100% cọc D ≥ 1,5 m (Spec dự án)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Tiêu chí CSL<\/td><td>FAT tăng ≤ 10% &amp; suy giảm năng lượng ≤ 6 dB → Tốt; 10–20% / 6–9 dB → Nghi ngờ; &gt; 20% / &gt; 9 dB → Khuyết tật<\/td><td>Chụp tomography 3D nếu nghi ngờ<\/td><td>H<\/td><\/tr><tr><td>Thời điểm siêu âm<\/td><td>≥ 7 ngày sau đổ bê tông<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Thử tĩnh<\/td><td>≥ 1% số cọc, tối thiểu 3 cọc; tải thử 200% (cọc thử thiết kế: đến phá hoại hoặc ≥ 250%)<\/td><td>Lún dư sau dỡ tải theo tiêu chí thiết kế; lún tại tải thiết kế ≤ 10 mm (Spec dự án)<\/td><td>H<\/td><\/tr><tr><td>Bê tông cọc<\/td><td>B35–B40, độ sụt 180–220 mm, thời gian bắt đầu ninh kết ≥ 6 h<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Tremie<\/td><td>Chôn ≥ 2 m, có nút cầu (plug) kín khí ở mẻ đầu<\/td><td><\/td><td>H<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Khoan bằng cần Kelly và gầu khoan đá; làm sạch đáy bằng airlift đến cặn lắng ≤ 50 mm trước khi đổ bê tông.", "Lồng thép tích hợp 4–6 ống siêu âm; siêu âm CSL 100% cọc D ≥ 1,5 m, tiêu chí FAT ≤ 10%, suy giảm năng lượng ≤ 6 dB.", "Đổ bê tông liên tục từ đáy lên qua Tremie chôn ≥ 2 m; thử tĩnh/hai chiều ≥ 1% số cọc đến 200–250% tải thiết kế."], "vis": "<ul><li><strong>Macro X-Ray Inside Pile:<\/strong> camera chui vào lòng cọc, ống kính 18 mm, dịch chuyển dọc trục từ đầu xuống mũi cọc 90 m trong 3 s (vận tốc ảo 30 m/s), bê tông hiển thị dạng thủy tinh mờ <code class=\"hex\"><i style=\"background:#9A9893\"><\/i>#9A9893<\/code> @ 25% opacity.<\/li><li>Lồng thép <code class=\"hex\"><i style=\"background:#7A7F87\"><\/i>#7A7F87<\/code>, ống siêu âm <code class=\"hex\"><i style=\"background:#C9CDD2\"><\/i>#C9CDD2<\/code>; sóng siêu âm 50 kHz dạng gợn hình nón <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code> truyền giữa các cặp ống.<\/li><li>Khuyết tật mô phỏng (chỉ để minh họa rồi loại bỏ): túi bùn <code class=\"hex\"><i style=\"background:#5D6D7E\"><\/i>#5D6D7E<\/code>, rỗ khí dạng bong bóng.<\/li><\/ul>", "tl": [[0, 1500, "Gầu khoan rút lên, xả đất; airlift hút cặn, đồng hồ \"cặn lắng 120 → 35 mm\""], [1500, 3500, "Lồng thép 4 đốt hạ xuống (nối ống siêu âm bằng măng sông ren), ánh kim"], [3500, 6500, "Bê tông dâng từ đáy, dung dịch bị đẩy lên; hiển thị đường cong \"thể tích thực tế vs lý thuyết\" — hệ số đổ ≥ 1,05"], [6500, 9500, "Đầu dò phát–thu kéo đồng bộ lên với tốc độ 0,3 m/s, ảnh hưởng 6 mặt cắt; đồ thị FAT thẳng tắp, năng lượng ổn định"], [9500, 12000, "Tomography 3D hiển thị khối cọc đồng nhất <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code>, nhãn <code>CSL: GOOD — 6/6 profiles<\/code>"]], "bim": "<ul><li>Tomography vận tốc sóng: ≥ 4 000 m/s <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code>; 3 500–4 000 <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code>; 3 000–3 500 <code class=\"hex\"><i style=\"background:#F3C63A\"><\/i>#F3C63A<\/code>; &lt; 3 000 m/s <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code>.<\/li><li>Đường cong tải – lún thử tĩnh: nhánh gia tải <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>, nhánh dỡ tải <code class=\"hex\"><i style=\"background:#7E57C2\"><\/i>#7E57C2<\/code>, giới hạn thiết kế <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> nét đứt.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Đo cặn lắng + kiểm tra bentonite đáy ngay trước khi lắp Tremie; quá 3 giờ chờ phải đo lại.<\/li><li><strong>Điểm mù 1:<\/strong> Ống siêu âm không bơm nước kịp thời bị bê tông bóp méo/nứt → không siêu âm được. Bơm nước ngay khi hạ lồng.<\/li><li><strong>Điểm mù 2:<\/strong> Mũi cọc tiếp xúc kém với đá (soft toe) — CSL không phát hiện được vùng sát mũi. Khoan lõi xuyên mũi cọc ≥ 1 m với ≥ 1% số cọc hoặc dùng ống chờ khoan mũi (toe-grouting).<\/li><li><strong>Điểm mù 3:<\/strong> Thời gian đổ bê tông vượt thời gian bắt đầu ninh kết → mẻ đầu tiên đông cứng quanh đáy ống Tremie.<\/li><\/ul>", "quote": "Mỗi cọc khoan nhồi đường kính hai mét, sâu chín mươi mét, là một cột chống vô hình gánh hàng nghìn tấn của tòa tháp. Chúng ta không bao giờ nhìn thấy nó sau khi đổ bê tông — vì thế chúng ta phải nhìn xuyên qua nó bằng sóng siêu âm, từng mặt cắt, từng hai mươi centimet. Năm centimet cặn lắng dưới mũi cọc có thể biến một cọc chống vào đá thành một cọc treo trong bùn — và đó là lý do tôi luôn đứng ở miệng hố khi người ta thả quả dọi đo đáy.", "sw": ["#9A9893", "#7A7F87", "#C9CDD2", "#00B8D4", "#5D6D7E", "#4675ED", "#61FC6C", "#F3C63A", "#D23105", "#7E57C2", "#FFC400"], "scene": "strata", "opts": {"pile": 1}}, {"n": 8, "title": "Hệ thống neo đất (Ground Anchors) và thanh chống tạm (Strut System)", "code": "EPC-SPEC-08-ANC", "dur": "15 000 ms", "part": "II", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 8870:2011<\/td><td>Thi công và nghiệm thu neo trong đất<\/td><\/tr><tr><td>EN 1537:2013 / EN ISO 22477-5<\/td><td>Thi công neo đất; thí nghiệm neo<\/td><\/tr><tr><td>PTI DC35.1-14<\/td><td>Neo đất và đá ứng suất trước<\/td><\/tr><tr><td>AISC 360-22 / TCVN 5575:2024<\/td><td>Thiết kế kết cấu thép thanh chống<\/td><\/tr><tr><td>CIRIA C760<\/td><td>Tường chắn trong hố đào sâu<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng chấp nhận<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Thí nghiệm hiệu năng (Performance test)<\/td><td>2–5% số neo, tải đến 1,50 × DL<\/td><td>Chuyển vị đàn hồi ≥ 80% chiều dài tự do lý thuyết<\/td><td>H<\/td><\/tr><tr><td>Thí nghiệm kiểm định (Proof test)<\/td><td>100% số neo, tải đến 1,33 × DL<\/td><td>Từ biến ≤ 1 mm trong 1–10 phút, hoặc ≤ 2 mm trong 6–60 phút<\/td><td>H<\/td><\/tr><tr><td>Tải khóa neo (Lock-off)<\/td><td>100–110% DL<\/td><td>±5%<\/td><td>W<\/td><\/tr><tr><td>Góc nghiêng neo<\/td><td>15–30°<\/td><td>±2°<\/td><td>W<\/td><\/tr><tr><td>Bầu neo phụt vữa<\/td><td>Vữa W/C 0,40–0,45, cường độ ≥ 30 MPa @ 7 ngày, áp lực phụt 1,0–2,5 MPa<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Thanh chống H-beam<\/td><td>H400×400×13×21 (một/hai thanh ghép), dầm vành đai (waling) H588×300<\/td><td>Độ thẳng ≤ L/1 000<\/td><td>W<\/td><\/tr><tr><td>Gia tải trước thanh chống (preload)<\/td><td>50–70% lực nén thiết kế bằng kích thủy lực, chèn nêm thép<\/td><td>±5%<\/td><td>H<\/td><\/tr><tr><td>Quan trắc lực thanh chống<\/td><td>Đo biến dạng dây rung (VW strain gauge), đọc 2 lần/ngày<\/td><td>Cảnh báo ≥ 80% thiết kế, dừng ≥ 100%<\/td><td>W<\/td><\/tr><tr><td>Chuyển vị ngang tường vây (Inclinometer)<\/td><td>Ngưỡng Xanh ≤ 0,15% H_đào; Vàng 0,15–0,25%; Đỏ ≥ 0,3% H_đào (≈ 60 mm khi đào 20 m)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Biên độ nhiệt thanh chống<\/td><td>Tính toán ΔT ±15 °C, hệ số α = 12×10⁻⁶ /°C<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Neo đất: khoan nghiêng 15–30°, phụt vữa áp lực 1,0–2,5 MPa tạo bầu neo; thử kiểm định 100% neo ở 1,33 × DL.", "Hệ thanh chống H400 + dầm vành đai H588; gia tải trước 50–70% lực thiết kế bằng kích thủy lực đồng bộ.", "Quan trắc thời gian thực: lực chống (VW gauge), chuyển vị tường (inclinometer) với ngưỡng 3 cấp Xanh – Vàng – Đỏ."], "vis": "<ul><li><strong>Low-angle Action Shot:<\/strong> camera đặt sát đáy hố, ống kính 16 mm nhìn lên, thanh chống <code class=\"hex\"><i style=\"background:#F2B705\"><\/i>#F2B705<\/code> đan chéo trên nền trời xanh. Ánh sáng ngược (backlight) tạo viền sáng thanh thép.<\/li><li>Đầu neo nhô qua tường vây, kích thủy lực tâm rỗng (center-hole jack) đỏ <code class=\"hex\"><i style=\"background:#C1440E\"><\/i>#C1440E<\/code> với đèn LED áp suất xanh chuyển dần.<\/li><li>Cảnh X-ray: bầu neo vữa hình củ hành Ø 300–400 mm <code class=\"hex\"><i style=\"background:#BDBDBD\"><\/i>#BDBDBD<\/code> trong lớp cát <code class=\"hex\"><i style=\"background:#D4B483\"><\/i>#D4B483<\/code>.<\/li><\/ul>", "tl": [[0, 2000, "Máy khoan góc nghiêng 20° đâm xuyên tường vây ra ngoài, ống vách xoay"], [2000, 4500, "Vữa phụt áp lực bung nở thành bầu neo dài 8 m (animate bán kính 0 → 200 mm, nhiễu Perlin bề mặt)"], [4500, 7500, "Kích kéo căng chùm 6 tao cáp Ø15,2; đồng hồ áp suất quét 0 → 1,33 DL; đồ thị tải – chuyển vị; giữ 10 phút (tua) → từ biến 0,6 mm PASS"], [7500, 10000, "Tầng chống H-beam lắp vào: thanh bay vào từ trên, gá vào waling; kích preload ép nêm \"cạch\""], [10000, 12000, "Bảng quan trắc: 24 thanh chống – lực 62% thiết kế <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>; inclinometer 18 mm ≤ 30 mm"]], "bim": "<ul><li>Lực trong thanh chống (FEA Plaxis 2D/3D kết hợp): tỷ lệ η theo thang Turbo, hiển thị bằng độ dày ống phát sáng tỷ lệ với lực.<\/li><li>Biến dạng tường vây phóng đại ×100, đường profile inclinometer <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>, ống ngưỡng <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code> / <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Không đào tầng tiếp theo khi tầng chống trên chưa được gia tải trước và nghiệm thu.<\/li><li><strong>Điểm mù 1:<\/strong> Neo đất xâm phạm ranh giới đất lân cận/công trình ngầm hiện hữu → cần chấp thuận pháp lý và khảo sát công trình ngầm (GPR) trước khi khoan.<\/li><li><strong>Điểm mù 2:<\/strong> Giãn nở nhiệt thanh chống ban ngày gây vượt lực — dùng kích chủ động (servo strut) hoặc tính toán ΔT.<\/li><li><strong>Điểm mù 3:<\/strong> Liên kết thanh chống – cột chống tạm (king post) không có giằng chống mất ổn định ngoài mặt phẳng.<\/li><\/ul>", "quote": "Hệ neo và thanh chống là đôi cánh tay thép giữ hàng triệu tấn áp lực đất đang dồn ép vào hố móng từng giây. Một thanh chống không được gia tải trước sẽ để tường vây dịch chuyển trước rồi mới chịu lực — và chuyển vị đó chính là vết nứt trên tường nhà hàng xóm. Chúng ta không đoán; chúng ta đọc lực từng thanh, hai lần mỗi ngày, cho đến khi sàn hầm cuối cùng thay thế chúng.", "sw": ["#F2B705", "#C1440E", "#BDBDBD", "#D4B483", "#00B8D4", "#FFAB00", "#D50000"], "scene": "strata", "opts": {"excav": 1, "anchors": 1}}, {"n": 9, "title": "Đào đất hố móng nhiều giai đoạn kết hợp hạ mực nước ngầm (Dewatering)", "code": "EPC-SPEC-09-EXC", "dur": "15 000 ms", "part": "II", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>CIRIA C750 (2016)<\/td><td>Kiểm soát nước ngầm — thiết kế và thực hành<\/td><\/tr><tr><td>EN 1997-1 (Eurocode 7) §2.4.7.4–5<\/td><td>Trạng thái giới hạn đẩy nổi (UPL) và xói ngầm thủy lực (HYD)<\/td><\/tr><tr><td>TCVN 9362:2012<\/td><td>Thiết kế nền nhà và công trình<\/td><\/tr><tr><td>TCVN 4447:2012<\/td><td>Công tác đất — thi công và nghiệm thu<\/td><\/tr><tr><td>QCVN 18:2021/BXD<\/td><td>An toàn trong thi công<\/td><\/tr><tr><td>QCVN 05:2023/BTNMT, QCVN 40:2011/BTNMT<\/td><td>Chất lượng không khí, nước thải xả ra môi trường<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Mực nước ngầm trong hố<\/td><td>Thấp hơn đáy đào hiện tại ≥ 1,0 m (tối thiểu 0,5 m)<\/td><td>Đo piezometer hàng ngày<\/td><td>H trước mỗi lớp đào<\/td><\/tr><tr><td>Hệ số an toàn đẩy trồi đáy (uplift của lớp cách nước)<\/td><td>FS ≥ 1,10 (EC7 UPL) ; Spec dự án ≥ 1,20<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Hệ số an toàn xói ngầm / bùng nền (piping, heave)<\/td><td>FS ≥ 1,5 – 2,0<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Giếng hạ nước sâu (Deep wells)<\/td><td>Ø 300 mm, sâu 30–45 m, lưu lượng 10–30 m³/h/giếng; dự phòng ≥ 25% số giếng<\/td><td>Máy phát dự phòng tự khởi động<\/td><td>W<\/td><\/tr><tr><td>Giếng phục hồi (recharge wells) ngoài tường vây<\/td><td>Kích hoạt khi mực nước ngoài hạ &gt; 1,0 m so với ban đầu<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Hàm lượng hạt mịn trong nước bơm<\/td><td>≤ 50 ppm (tránh rửa trôi đất gây lún)<\/td><td>Lấy mẫu hàng tuần<\/td><td>W<\/td><\/tr><tr><td>Chiều sâu đào vượt dưới tầng chống<\/td><td>≤ 0,5 m dưới cao độ thanh chống trước khi lắp<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Cao độ đáy đào cuối<\/td><td>±50 mm; 300 mm cuối đào thủ công/gàu răng phẳng<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Lún công trình lân cận<\/td><td>Xanh &lt; 10 mm; Vàng 10–20 mm; Đỏ ≥ 25 mm (hoặc lún lệch ≥ 1/500)<\/td><td>Đo hàng ngày<\/td><td>W<\/td><\/tr><tr><td>Bụi PM10 tại hàng rào<\/td><td>≤ 150 µg/m³ trung bình 24 h<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Cầu rửa xe<\/td><td>100% xe ra khỏi công trường; bánh xe sạch bùn<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Vận hành giếng hạ nước sâu trước khi đào ≥ 7 ngày; mực nước luôn thấp hơn đáy đào ≥ 1,0 m; dự phòng 25% giếng và nguồn điện.", "Đào phân tầng theo phương pháp bottom-up/semi top-down, không đào vượt quá 0,5 m dưới cao độ thanh chống.", "Kiểm soát lún lân cận bằng giếng phục hồi, giới hạn hạt mịn trong nước bơm ≤ 50 ppm; xe đất qua cầu rửa tự động."], "vis": "<ul><li><strong>Epic Time-lapse Shot:<\/strong> camera crane cố định trên miệng hố, 20 mm, mỗi khung = 30 s thực, 72 giờ thi công nén trong 9 s.<\/li><li>Hố móng 80 × 70 m sâu 22 m, máy đào gàu 1,6 m³ <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code> múc đất lên xe ben 15 m³ chạy ramp xoắn quanh hố; vòi xả nước giếng trắng xóa vào bể lắng 3 ngăn.<\/li><li>Mặt cắt X-ray bên phải: mặt nước ngầm <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code> hạ dần dạng phễu (cone of depression) quanh mỗi giếng.<\/li><\/ul>", "tl": [[0, 2500, "Mặt nước ngầm rút từ −2 m xuống −23 m, hiển thị hình phễu chồng lấn của 18 giếng; bộ đếm lưu lượng <code>Q = 420 m³/h<\/code>"], [2500, 6000, "Máy đào bóc lớp đất theo các mốc cao độ đỏ <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code> (−4,5 / −9,0 / −13,5 / −18,0 / −22,0 m); mỗi lớp 700 ms"], [6000, 9000, "Sau mỗi lớp, tầng thanh chống <code class=\"hex\"><i style=\"background:#F2B705\"><\/i>#F2B705<\/code> bay vào lắp kín vòng (4 tầng chống)"], [9000, 11000, "Xe ra cổng qua cầu rửa, nước xịt 360°; chỉ số PM10 <code>92 µg/m³<\/code> <code class=\"hex\"><i style=\"background:#00C853\"><\/i>#00C853<\/code>"], [11000, 12000, "Bảng quan trắc lún lân cận: 14/14 điểm Xanh"]], "bim": "<ul><li>Mô hình thấm 3D (MODFLOW / Plaxis Flow): cột áp thủy lực từ <code class=\"hex\"><i style=\"background:#0D47A1\"><\/i>#0D47A1<\/code> (cao) → <code class=\"hex\"><i style=\"background:#E3F2FD\"><\/i>#E3F2FD<\/code> (thấp); đường dòng thấm <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code>.<\/li><li>Lớp đất đã đào biến mất bằng hiệu ứng \"voxel dissolve\" 200 ms mỗi khối 2 × 2 × 0,5 m.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Trước mỗi lớp đào: biên bản mực nước + lực thanh chống + chuyển vị tường + lún lân cận đều ở mức Xanh.<\/li><li><strong>Điểm mù 1:<\/strong> Mất điện ban đêm làm ngừng bơm → nước dâng đẩy nổi đáy hố trong vài giờ. Bắt buộc ATS + máy phát dự phòng và báo động SMS.<\/li><li><strong>Điểm mù 2:<\/strong> Tầng chứa nước có áp (artesian) dưới lớp sét đáy hố — kiểm tra UPL ở từng giai đoạn đào, không chỉ ở cao độ cuối.<\/li><li><strong>Điểm mù 3:<\/strong> Máy đào va chạm cột chống tạm (king post) và ống quan trắc — đánh dấu sơn phản quang và người cảnh giới.<\/li><\/ul>", "quote": "Đào hố sâu hai mươi hai mét giữa thành phố là một cuộc chiến ngầm mà kẻ thù là nước. Mỗi giờ, bốn trăm hai mươi khối nước được rút ra để đáy hố không bị đẩy trồi, nhưng nếu rút quá tay, chính nền đất của khu phố sẽ lún theo. Vì vậy chúng ta đào theo nhịp của quan trắc chứ không theo nhịp của máy xúc: số liệu xanh thì đào, số liệu vàng thì dừng lại và suy nghĩ.", "sw": ["#FFC400", "#00B8D4", "#0D47A1", "#E3F2FD", "#00E5FF"], "scene": "strata", "opts": {"excav": 1, "water": 1}}, {"n": 10, "title": "Bê tông lót (Lean Concrete) và chống thấm ngược đáy móng", "code": "EPC-SPEC-10-WPF", "dur": "15 000 ms", "part": "II", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 4447:2012<\/td><td>Đầm chặt nền đất<\/td><\/tr><tr><td>TCVN 4453:1995<\/td><td>Bê tông toàn khối<\/td><\/tr><tr><td>BS 8102:2022<\/td><td>Bảo vệ kết cấu ngầm chống nước (Grade 3 cho tầng hầm kỹ thuật)<\/td><\/tr><tr><td>ASTM D5385<\/td><td>Khả năng chống áp lực thủy tĩnh của màng<\/td><\/tr><tr><td>ASTM D903 / D4541<\/td><td>Độ bám dính bóc tách / kéo nhổ<\/td><\/tr><tr><td>ACI 212.3R-16<\/td><td>Phụ gia chống thấm kết tinh (PRAH)<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Dung sai<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Độ chặt nền đáy móng<\/td><td>K ≥ 0,95 (Proctor tiêu chuẩn)<\/td><td>Mỗi 500 m² một điểm<\/td><td>W<\/td><\/tr><tr><td>Bê tông lót<\/td><td>B7.5–B12.5 (M100–M150), dày 100 mm<\/td><td>−10 / +20 mm<\/td><td>W<\/td><\/tr><tr><td>Độ phẳng bề mặt bê tông lót<\/td><td>Khe hở thước 3 m ≤ 10 mm (mặt nhận màng: ≤ 5 mm, không gờ sắc)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Cao độ bê tông lót<\/td><td>±10 mm<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Màng HDPE dán sẵn (pre-applied fully bonded)<\/td><td>Dày ≥ 1,2 mm (Spec dự án 1,5 mm)<\/td><td>−0<\/td><td>R<\/td><\/tr><tr><td>Chồng mí màng HDPE<\/td><td>≥ 75 mm cạnh dọc, ≥ 150 mm đầu cuộn<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Màng khò nóng SBS (phương án)<\/td><td>Dày 4 mm, 2 lớp so le; chồng mí ≥ 100 mm dọc, ≥ 150 mm ngang<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Chịu áp lực thủy tĩnh màng<\/td><td>≥ 70 m cột nước (ASTM D5385)<\/td><td>Chứng chỉ<\/td><td>R<\/td><\/tr><tr><td>Độ bám dính màng – bê tông<\/td><td>≥ 0,5 MPa (kéo nhổ D4541) hoặc theo nhà sản xuất<\/td><td>3 điểm/1 000 m²<\/td><td>W<\/td><\/tr><tr><td>Phụ gia tinh thể trong bê tông móng<\/td><td>0,8–1,2% khối lượng xi măng<\/td><td>Biên bản trộn<\/td><td>R<\/td><\/tr><tr><td>Thử tia lửa điện / chân không mối hàn<\/td><td>100% mối nối khò/hàn<\/td><td>Không rò<\/td><td>H<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Đầm nền đạt K ≥ 0,95, đổ bê tông lót B10 dày 100 mm, độ phẳng ≤ 5 mm/3 m dưới lớp màng.", "Màng HDPE dán sẵn 1,5 mm bám dính toàn phần, chồng mí ≥ 75/150 mm, chịu áp lực thủy tĩnh ≥ 70 m cột nước.", "Kết hợp phụ gia tinh thể thẩm thấu trong bê tông móng: hệ chống thấm kép đạt cấp độ BS 8102 Grade 3."], "vis": "<ul><li><strong>Close-up Macro Tracking Shot:<\/strong> ống kính macro 100 mm, f/4, dolly thấp 15 cm trên mặt sàn, tốc độ 0,3 m/s.<\/li><li>Đèn khò gas lửa xanh tím <code class=\"hex\"><i style=\"background:#5E35B1\"><\/i>#5E35B1<\/code> (lõi <code class=\"hex\"><i style=\"background:#B3E5FC\"><\/i>#B3E5FC<\/code>), màng SBS đen bóng <code class=\"hex\"><i style=\"background:#111316\"><\/i>#111316<\/code> sủi bọt chảy dẻo, mép chồng phẳng.<\/li><li>Lớp gel tinh thể \"pha lê\" <code class=\"hex\"><i style=\"background:#7FFFD4\"><\/i>#7FFFD4<\/code> 40% transmission phủ lên, tinh thể kim (needle crystals) mọc vào mao quản bê tông — dựng macro × 2 000 (microscope view).<\/li><\/ul>", "tl": [[0, 2000, "Lu rung nhỏ lăn trên nền, đồng hồ độ chặt <code>K = 0,96<\/code>"], [2000, 4000, "Bê tông lót chảy đều, thước gạt nhôm 3 m kéo phẳng, laser cao độ quét <code>±6 mm<\/code>"], [4000, 7000, "Cuộn màng HDPE lăn trải, các vệt chồng mí 75 mm sáng <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code>; mép màng vén lên ôm chân tường vây"], [7000, 9500, "Zoom macro xuyên qua bê tông: tinh thể mọc lấp mao quản (chuyển màu <code class=\"hex\"><i style=\"background:#7FFFD4\"><\/i>#7FFFD4<\/code> lan tỏa 2 s)"], [9500, 12000, "Mô phỏng áp lực nước ngầm đẩy lên (mũi tên <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code>) bị chặn hoàn toàn tại mặt màng; nhãn <code>70 m head — NO LEAK<\/code>"]], "bim": "<ul><li>Màng: <code class=\"hex\"><i style=\"background:#111316\"><\/i>#111316<\/code>, clear-coat 0.8; mối chồng mí highlight <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> 1 px; lỗi chồng mí &lt; 75 mm <code class=\"hex\"><i style=\"background:#D50000\"><\/i>#D50000<\/code>.<\/li><li>Mô phỏng thấm: nước dạng hạt FLIP màu <code class=\"hex\"><i style=\"background:#4FC3F7\"><\/i>#4FC3F7<\/code>; vùng bê tông bão hòa chuyển tối 10%.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Nghiệm thu 100% màng (chồng mí, chi tiết đầu cọc, góc trong/ngoài) trước khi đặt cốt thép đáy móng.<\/li><li><strong>Điểm mù 1:<\/strong> Chi tiết chống thấm đầu cọc (pile head) — điểm rò rỉ phổ biến nhất. Dùng vữa tinh thể + băng trương nở quanh thép chờ + màng ôm cổ cọc.<\/li><li><strong>Điểm mù 2:<\/strong> Màng bị thủng bởi con kê, chân ghế thép, xe cút kít khi lắp cốt thép — trải tấm bảo vệ, đặt con kê có đế rộng.<\/li><li><strong>Điểm mù 3:<\/strong> Mối nối màng đáy với tường vây không liên tục — thiết kế chi tiết chuyển tiếp (transition detail) có waterstop trương nở.<\/li><\/ul>", "quote": "Đáy móng là chiến tuyến đầu tiên và cũng là chiến tuyến không bao giờ sửa lại được: một khi bốn mét bê tông đã đè lên, không ai có thể vá một vết thủng một mi-li-mét bên dưới. Vì thế chúng ta làm hai lớp phòng thủ — một lớp màng liền mạch chịu bảy mươi mét cột nước, và hàng tỷ tinh thể tự mọc lấp kín mao quản bê tông. Ở đây, chỗ yếu nhất luôn là đầu cọc, và đó là nơi tôi yêu cầu kiểm tra kỹ nhất.", "sw": ["#5E35B1", "#B3E5FC", "#111316", "#7FFFD4", "#00E5FF", "#D50000", "#4FC3F7"], "scene": "layers", "opts": {"mode": "base"}}, {"n": 11, "title": "Lắp đặt cốt thép móng bè khối lớn (Mass Raft Foundation)", "code": "EPC-SPEC-11-RBR", "dur": "15 000 ms", "part": "II", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 1651-2:2018<\/td><td>Thép thanh vằn CB500-V<\/td><\/tr><tr><td>JIS G3112<\/td><td>Thép SD490<\/td><\/tr><tr><td>TCVN 5574:2018 / ACI 318-19<\/td><td>Thiết kế BTCT, cấu tạo cốt thép<\/td><\/tr><tr><td>ACI 117-10<\/td><td>Dung sai lắp đặt cốt thép<\/td><\/tr><tr><td>TCVN 8163:2009 / ISO 15835-1:2018<\/td><td>Mối nối ống ren (coupler)<\/td><\/tr><tr><td>ACI 421.1R<\/td><td>Cốt thép chống chọc thủng (stud rail)<\/td><\/tr><tr><td>AISC 303-22<\/td><td>Dung sai bu lông neo chân cột thép<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Dung sai<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Chiều dày móng bè<\/td><td>3,0–4,5 m (dự án: 4,0 m)<\/td><td>±20 mm<\/td><td>W<\/td><\/tr><tr><td>Thép chủ<\/td><td>D32–D40 CB500-V, lưới 2–3 lớp trên/dưới, a = 150–200 mm<\/td><td>Khoảng cách ±10 mm (ACI 117: ±1/4 khoảng cách hoặc ±25 mm, lấy nhỏ hơn)<\/td><td>W<\/td><\/tr><tr><td>Lớp bảo vệ đáy (đổ trên đất/màng)<\/td><td>75 mm<\/td><td>−10 / +12 mm<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Lớp bảo vệ mặt trên<\/td><td>50 mm<\/td><td>−10 / +12 mm<\/td><td>W<\/td><\/tr><tr><td>Vị trí thép theo chiều cao tiết diện<\/td><td>d &gt; 200 mm: ±13 mm (ACI 117)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Nối thép D ≥ 32<\/td><td>Bắt buộc coupler (không nối chồng), Type 2 / cấp A<\/td><td>Kéo ≥ 1,25 f_y và ≥ f_u thanh; độ trượt ≤ 0,10 mm<\/td><td>H (thử 1 mẫu/500 mối)<\/td><\/tr><tr><td>Mối nối so le<\/td><td>≤ 50% số thanh tại một mặt cắt<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Giá đỡ thép (steel chairs/space truss)<\/td><td>Thép hình L75–L100, tính toán chịu tải ≥ 1,5 × (trọng lượng thép trên + người + thiết bị ≈ 5 kN/m²)<\/td><td>Biến dạng ≤ 5 mm<\/td><td>R + W<\/td><\/tr><tr><td>Thép chờ cột/vách<\/td><td>Vị trí ±10 mm, cao độ ±20 mm<\/td><td><\/td><td>H<\/td><\/tr><tr><td>Bu lông neo chân cột thép<\/td><td>Trong một nhóm ±3 mm; giữa các nhóm ±6 mm; cao độ đỉnh ±13 mm (AISC 303)<\/td><td>Dùng dưỡng (template) thép<\/td><td>H<\/td><\/tr><tr><td>Ống làm mát &amp; cảm biến nhiệt<\/td><td>Lắp trước khi đóng lưới trên (xem Slide 12)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Hàm lượng cốt thép ước tính<\/td><td>180–250 kg/m³<\/td><td><\/td><td>R<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Hệ giá đỡ thép không gian chịu toàn bộ lưới thép trên 2–3 lớp D32–D40 và tải thi công, biến dạng ≤ 5 mm.", "Nối thép bằng coupler cấp A (≥ 1,25 f_y, trượt ≤ 0,1 mm), cốt thép chống chọc thủng quanh đầu cọc và chân lõi.", "Định vị thép chờ ±10 mm, bu lông neo chân cột ±3 mm bằng dưỡng thép; lớp bảo vệ đáy 75 mm."], "vis": "<ul><li><strong>Wide Isometric Architectural View:<\/strong> camera trực giao isometric 30°, tiêu cự tương đương 200 mm, mô phỏng sa bàn; sau đó dolly-in xuyên vào giữa rừng thép (ống kính 24 mm, f/2.8, bokeh thép phía trước).<\/li><li>Thép <code class=\"hex\"><i style=\"background:#7A7F87\"><\/i>#7A7F87<\/code> metallic 1.0 roughness 0.38, gân xoắn chi tiết; đèn pha LED 5 000 K treo cao tạo hàng nghìn điểm sáng phản chiếu (specular sparkle).<\/li><li>Ống coupler <code class=\"hex\"><i style=\"background:#B0BEC5\"><\/i>#B0BEC5<\/code> đánh dấu sơn vạch đỏ chứng nhận siết đủ lực.<\/li><\/ul>", "tl": [[0, 2000, "Lưới thép đáy lớp 1 và 2 trải ra theo hướng X rồi Y (mỗi thanh trễ 4 ms, hiệu ứng \"đàn piano\")"], [2000, 4500, "Giá đỡ không gian mọc lên như rừng cột, cao 3,6 m"], [4500, 7500, "Cẩu tháp hạ các tấm lưới thép trên tiền chế 6 × 2,4 m; coupler xoay vặn vào, cờ lê lực hiển thị <code>≥ 300 N·m<\/code>"], [7500, 9500, "Thép chống chọc thủng (stud rail) và thép chờ lõi cắm xuống, dưỡng bu lông neo khóa vào"], [9500, 12000, "Camera kéo ngược: toàn bộ lồng thép 4 m sáng ánh kim; lớp phủ BIM đối chiếu vị trí <code>Δmax = 8 mm<\/code> PASS"]], "bim": "<ul><li>Phân màu theo đường kính trên BIM: D20 <code class=\"hex\"><i style=\"background:#4675ED\"><\/i>#4675ED<\/code>, D25 <code class=\"hex\"><i style=\"background:#1BCFD4\"><\/i>#1BCFD4<\/code>, D32 <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code>, D36 <code class=\"hex\"><i style=\"background:#F3C63A\"><\/i>#F3C63A<\/code>, D40 <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code>.<\/li><li>Ống làm mát <code class=\"hex\"><i style=\"background:#0057B8\"><\/i>#0057B8<\/code>, cảm biến nhiệt chấm <code class=\"hex\"><i style=\"background:#FFC400\"><\/i>#FFC400<\/code>.<\/li><\/ul>", "hold": "<ul><li><strong>H:<\/strong> Nghiệm thu cốt thép móng bè theo từng phân khu ≤ 400 m², có bản vẽ đối chiếu BIM và ảnh 360°.<\/li><li><strong>Điểm mù 1:<\/strong> Hệ giá đỡ sụp đổ do không tính tải — đã có nhiều sự cố chết người. Giá đỡ phải có bản tính, có giằng chéo.<\/li><li><strong>Điểm mù 2:<\/strong> Mật độ thép quá dày khiến bê tông không lọt qua (cốt liệu Dmax 20 mm cần khe hở ≥ 1,33 × Dmax ≈ 27 mm; Spec ≥ 40 mm) và không có lỗ thả đầm dùi — chừa \"giếng đầm\" 200 × 200 mm mỗi 1,5 m.<\/li><li><strong>Điểm mù 3:<\/strong> Thép chờ lõi lệch làm hỏng ván khuôn leo ở Slide 15.<\/li><\/ul>", "quote": "Bạn đang nhìn vào hơn ba nghìn tấn thép cường độ cao, đan thành một ma trận dày bốn mét — bộ xương sống sẽ phân phối toàn bộ trọng lượng tòa tháp xuống bốn trăm hai mươi cọc. Nhưng hãy chú ý đến những thứ không ai chụp ảnh: những chiếc giá đỡ thép bên dưới phải gánh toàn bộ lưới trên và người thợ trước khi bê tông kịp vào. Và mỗi coupler ở đây phải mạnh hơn chính cây thép mà nó nối.", "sw": ["#7A7F87", "#B0BEC5", "#4675ED", "#1BCFD4", "#61FC6C", "#F3C63A", "#D23105", "#0057B8", "#FFC400"], "scene": "grid", "opts": {"mode": "rebar"}}, {"n": 12, "title": "Đổ bê tông khối lớn liên tục (Continuous Mass Pour) & quản lý nhiệt thủy hóa", "code": "EPC-SPEC-12-MSC", "dur": "15 000 ms", "part": "II", "std": "<div class=\"tw\"><table><thead><tr><th>Mã<\/th><th>Phạm vi<\/th><\/tr><\/thead><tbody><tr><td>TCVN 305:2004<\/td><td>Bê tông khối lớn — quy phạm thi công và nghiệm thu<\/td><\/tr><tr><td>ACI 207.1R-05, ACI 207.2R<\/td><td>Bê tông khối lớn, ứng xử nhiệt<\/td><\/tr><tr><td>ACI 301-20 Mục 8<\/td><td>Chỉ dẫn kỹ thuật bê tông khối lớn<\/td><\/tr><tr><td>TCVN 9340:2012<\/td><td>Bê tông trộn sẵn<\/td><\/tr><tr><td>ASTM C618 / C989<\/td><td>Tro bay loại F / Xỉ lò cao nghiền mịn<\/td><\/tr><tr><td>TCVN 3105, 3118:2022<\/td><td>Lấy mẫu, cường độ nén<\/td><\/tr><\/tbody><\/table><\/div>", "tol": "<div class=\"tw\"><table><thead><tr><th>Thông số<\/th><th>Giá trị<\/th><th>Ngưỡng<\/th><th>Kiểm tra<\/th><\/tr><\/thead><tbody><tr><td>Khối tích một đợt đổ<\/td><td>7 200 m³ (80 × 22,5 × 4 m mỗi phân đoạn) hoặc đổ toàn khối<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Cấp độ bền<\/td><td>B45 (≈ M600) @ 56 ngày (cho phép tuổi thiết kế 56–90 ngày)<\/td><td>f_cm theo TCVN 5574<\/td><td>R<\/td><\/tr><tr><td>Chất kết dính<\/td><td>Xi măng ít tỏa nhiệt (PCB/LH) + tro bay F 25–35% hoặc GGBS 50–65%<\/td><td>Nhiệt thủy hóa xi măng ≤ 270 kJ/kg @ 7 ngày<\/td><td>R<\/td><\/tr><tr><td>Nhiệt độ hỗn hợp khi đổ<\/td><td>≤ 30 °C (Spec dự án ≤ 28 °C; dùng đá vảy, nước lạnh 4 °C, đổ đêm)<\/td><td>Đo mỗi xe<\/td><td><strong>H<\/strong><\/td><\/tr><tr><td>Nhiệt độ tối đa trong lõi khối<\/td><td>≤ 70 °C (phòng ngừa DEF — ettringite muộn)<\/td><td>Liên tục<\/td><td>H<\/td><\/tr><tr><td>Chênh lệch nhiệt độ tâm – mặt<\/td><td>ΔT ≤ 20 °C (TCVN 305); tiêu chuẩn mềm theo tính toán ứng suất nhiệt có thể cho phép đến 25 °C với GGBS<\/td><td>Liên tục 14–21 ngày<\/td><td>H<\/td><\/tr><tr><td>Mô-đun gradient nhiệt<\/td><td>≤ 50 °C/m<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Độ sụt<\/td><td>180 ± 20 mm, thời gian bắt đầu ninh kết ≥ 8 h (phụ gia chậm đông)<\/td><td>Mỗi xe<\/td><td>W<\/td><\/tr><tr><td>Chiều dày lớp đổ<\/td><td>300–500 mm, đổ bậc thang (step-pour), khe lạnh bị cấm<\/td><td>Thời gian phủ lớp ≤ thời gian bắt đầu ninh kết − 2 h<\/td><td>H<\/td><\/tr><tr><td>Công suất cung cấp<\/td><td>≥ 250 m³/h (≥ 4 trạm trộn, ≥ 6 bơm, 1 trạm + 1 bơm dự phòng)<\/td><td><\/td><td>R<\/td><\/tr><tr><td>Ống làm mát<\/td><td>HDPE Ø 32 mm, lưới 1,0–1,5 m, lưu lượng 15–25 l/min/vòng, chênh lệch nước – bê tông ≤ 20 °C<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Cảm biến nhiệt (thermocouple)<\/td><td>≥ 6 cụm × 3 cao độ (tâm, 50 mm dưới mặt, 50 mm trên đáy) + môi trường; ghi 30 phút/lần<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Mẫu thí nghiệm<\/td><td>1 tổ mẫu / 500 m³ (TCVN 4453 cho khối lớn)<\/td><td><\/td><td>W<\/td><\/tr><tr><td>Bảo dưỡng<\/td><td>Phủ bạt cách nhiệt + giữ ẩm ≥ 14 ngày; dỡ cách nhiệt khi ΔT mặt – môi trường ≤ 15 °C<\/td><td><\/td><td>W<\/td><\/tr><\/tbody><\/table><\/div>", "bul": ["Chuỗi cung ứng 250 m³/h, 4 trạm trộn + 6 bơm, đổ liên tục 30–36 giờ, lớp 300–500 mm, cấm tuyệt đối khe lạnh.", "Bê tông B45 dùng tro bay/xỉ, nhiệt độ khi đổ ≤ 28 °C, lõi khối ≤ 70 °C, chênh lệch tâm–mặt ΔT ≤ 20 °C.", "Ống làm mát tuần hoàn + 18 cảm biến nhiệt ghi 30 phút/lần; phủ cách nhiệt giữ ẩm ≥ 14 ngày."], "vis": "<ul><li><strong>Thermal Infrared Camera View:<\/strong> mở màn bằng camera thường (drone 100 m, đêm, đèn pha), sau đó \"lật\" sang camera nhiệt bằng wipe ngang 400 ms.<\/li><li>Palette nhiệt: 20 °C <code class=\"hex\"><i style=\"background:#30123B\"><\/i>#30123B<\/code> → 40 °C <code class=\"hex\"><i style=\"background:#39A2FC\"><\/i>#39A2FC<\/code> → 55 °C <code class=\"hex\"><i style=\"background:#61FC6C\"><\/i>#61FC6C<\/code> → 65 °C <code class=\"hex\"><i style=\"background:#FE9B2D\"><\/i>#FE9B2D<\/code> → ≥ 70 °C <code class=\"hex\"><i style=\"background:#7A0403\"><\/i>#7A0403<\/code>.<\/li><li>Ống làm mát zíc-zắc phát sáng <code class=\"hex\"><i style=\"background:#00B8D4\"><\/i>#00B8D4<\/code> bên trong khối (cắt X-ray), dòng nước chảy dạng hạt.<\/li><\/ul>", "tl": [[0, 2500, "6 xe bơm cần 52 m dang tay quanh hố, 40 xe bồn xếp hàng; đồng hồ thời gian thực <code>T+00:00 → T+32:00<\/code> tua nhanh"], [2500, 5000, "Bê tông lan theo bậc thang, mỗi lớp 400 mm, đầm dùi rung tạo gợn sóng"], [5000, 7000, "Lật sang camera nhiệt; lõi khối nóng dần đến 62 °C trong 72 h (tua)"], [7000, 10000, "Ống làm mát hoạt động: lõi giảm dần; đồ thị góc phải — 3 đường Tâm <code class=\"hex\"><i style=\"background:#D23105\"><\/i>#D23105<\/code>, Mặt <code class=\"hex\"><i style=\"background:#F3C63A\"><\/i>#F3C63A<\/code>, ΔT <code class=\"hex\"><i style=\"background:#00E5FF\"><\/i>#00E5FF<\/code> luôn nằm dưới ngưỡng 20 °C <code class=\"hex\"><i style=\"background:#FFAB00\"><\/i>#FFAB00<\/code> nét đứt"], [10000, 12000, "Trở lại camera thường: mặt m
