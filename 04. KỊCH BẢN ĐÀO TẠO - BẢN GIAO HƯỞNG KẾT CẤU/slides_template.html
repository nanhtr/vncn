<title>Bản Giao Hưởng Kết Cấu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phòng điều khiển BIM — thanh lệnh trên cùng, sân khấu mô phỏng bên trái, hồ sơ đặc tả bên phải.
   Giao diện tối có chủ đích (màn hologram điện ảnh), chỉ một bảng màu. */
:root{
  color-scheme:dark;
  --bg:#071118; --panel:#0C1A23; --panel2:#10222D; --line:#1C3340;
  --fg:#DCE9EE; --mute:#88A2AD; --wire:#00E5FF; --gold:#FFC400;
  --pass:#00C853; --warn:#FFAB00; --fail:#FF4D4D;
  --f-disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(rgba(0,229,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.035) 1px,transparent 1px);
  background-size:32px 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wire);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:17px;white-space:nowrap}
.brand b{color:var(--wire)}
.crumb{color:var(--mute);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--wire)}
.btn.pri{background:var(--wire);color:#00262B;border-color:var(--wire);font-weight:600}
.count{font-family:var(--f-mono);font-size:13px;color:var(--mute);min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--gold);transition:width .3s}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1500px;margin:0 auto}

/* Slide */
.slide{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 14px;font-family:var(--f-mono);font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.eyebrow .tag{color:var(--gold)}
h1,h2{font-family:var(--f-disp);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:clamp(26px,3.2vw,40px)}
.num{font-family:var(--f-disp);color:var(--wire);font-weight:600;font-size:15px;letter-spacing:.12em}
.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bul li{position:relative;padding-left:22px;font-size:16px;line-height:1.5}
.bul li::before{content:"";position:absolute;left:2px;top:.62em;width:10px;height:2px;background:var(--wire)}
.quote{margin:0;background:linear-gradient(90deg,rgba(255,196,0,.09),transparent);border-left:3px solid var(--gold);
  padding:12px 16px;border-radius:0 8px 8px 0;font-size:15.5px;font-style:italic;color:#F3EBD2}
.quote small{display:block;font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}

.stage{position:relative;background:#050D13;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:16/10;max-width:100%}
.stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:11px;color:var(--wire);opacity:.85;pointer-events:none}
.hud2{position:absolute;right:10px;bottom:8px;font-family:var(--f-mono);font-size:11px;color:var(--mute);pointer-events:none;font-variant-numeric:tabular-nums}
.player{display:flex;align-items:center;gap:10px}
.track{flex:1;height:6px;background:var(--panel2);border-radius:3px;position:relative;cursor:pointer;border:1px solid var(--line)}
.track i{position:absolute;inset:0 auto 0 0;background:var(--wire);border-radius:3px}
.tc{font-family:var(--f-mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.tl{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--mute);border:1px solid transparent}
.tl li span{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums;padding-top:2px}
.tl li.on{color:var(--fg);background:var(--panel2);border-color:var(--line)}
.tl li.on span{color:var(--wire)}
.tl li.done span{color:var(--pass)}
.sw{display:flex;flex-wrap:wrap;gap:4px}
.sw i{width:18px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.15)}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;cursor:pointer;font-size:13px;color:var(--mute);font-weight:500}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--wire)}
.pane{font-size:13.5px;min-width:0}
.pane p{margin:.4em 0}
.pane ul{margin:.3em 0;padding-left:1.1em}
.pane li{margin:.25em 0}
.pane ol{padding-left:1.2em;margin:.2em 0}
.pane strong{color:#fff}
.note{color:var(--warn);font-size:12.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:.5em 0}
table{border-collapse:collapse;width:100%;font-size:12.8px;font-variant-numeric:tabular-nums}
th{background:var(--panel2);text-align:left;font-weight:600;color:var(--wire);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
code{font-family:var(--f-mono);font-size:.9em;background:rgba(0,229,255,.08);padding:1px 4px;border-radius:3px;color:#BFF6FF;white-space:nowrap}
code.hex i{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(255,255,255,.25)}

/* Bìa & phụ lục */
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;min-height:70vh}
.cover h1{font-size:clamp(44px,7vw,96px);text-transform:uppercase;letter-spacing:.02em;line-height:.95}
.cover h1 b{color:var(--wire);font-weight:700;display:block}
.lede{font-size:17px;color:var(--mute);max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--fg);background:var(--panel)}
.parts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.parts button{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.parts button:hover{border-color:var(--wire)}
.parts .r{font-family:var(--f-disp);font-size:22px;color:var(--gold);font-weight:700}
.parts .s{font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.appx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}

/* Mục lục */
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:0;width:min(720px,calc(100vw - 32px));max-height:85vh}
dialog::backdrop{background:rgba(2,8,12,.7)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.idx{padding:8px 16px 16px;overflow:auto}
.idx h3{font-family:var(--f-disp);color:var(--gold);font-size:16px;letter-spacing:.06em;margin:14px 0 6px;text-transform:uppercase}
.idx button{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.idx button:hover,.idx button.cur{background:var(--panel2)}
.idx button span{font-family:var(--f-mono);color:var(--wire);font-size:12px}

@media (max-width:980px){
  .slide,.cover,.appx{grid-template-columns:minmax(0,1fr)}
  .cover{min-height:0}
  .crumb{display:none}
}
@media (max-width:520px){
  .tl li{grid-template-columns:minmax(0,1fr)}
  .brand{font-size:15px}
  .bul li{font-size:15px}
}

/* Bản cho người mới */
body{font-size:16px}
.road{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:18px}
.road button{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;font-size:13px;color:var(--mute);min-width:0}
.road button b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--fg);font-size:13px}
.road button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.road button.on{border-color:var(--gold);color:var(--fg)}
.road button.on b{background:var(--gold);color:#2A2000}
.easy{display:flex;flex-direction:column;gap:22px;max-width:1240px;margin:0 auto}
.ehead{display:flex;flex-direction:column;gap:6px}
.ehead h2{font-size:clamp(28px,4vw,46px)}
.egrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.cap{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:72px}
.cap span{flex:none;font-family:var(--f-disp);font-weight:700;font-size:22px;color:var(--gold);line-height:1.1}
.cap p{margin:0;font-size:19px;line-height:1.45;font-weight:500}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--mute);border:1px solid transparent}
.steps li b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:13px;color:var(--fg)}
.steps li.on{background:var(--panel);border-color:var(--line);color:var(--fg)}
.steps li.on b{background:var(--wire);color:#00262B}
.steps li.done b{background:var(--pass);color:#00230F}
.box{border-radius:10px;padding:14px 16px;border:1px solid var(--line);background:var(--panel)}
.box h3{margin:0 0 6px;font-family:var(--f-disp);font-size:20px;letter-spacing:.02em}
.box p{margin:0;font-size:17px;line-height:1.6}
.box.say h3{color:var(--wire)}
.box.like h3{color:var(--gold)}
.box.warn{background:rgba(255,77,77,.07);border-color:rgba(255,77,77,.35)}
.box.warn h3{color:#FF8A80}
.sh{font-family:var(--f-disp);font-size:22px;margin:0 0 10px;letter-spacing:.02em}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ncard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.ncard strong{font-family:var(--f-disp);font-size:32px;color:var(--gold);line-height:1.05}
.ncard span{color:var(--fg);font-size:15px}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:0}
.gl>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.gl dt{font-weight:600;color:var(--wire);font-size:16px}
.gl dd{margin:4px 0 0;font-size:15px}
.dict .lnk{margin-top:8px;background:none;border:0;color:var(--gold);cursor:pointer;padding:0;font-size:13px;text-decoration:underline}
.pro{border:1px dashed var(--line);border-radius:10px;padding:0 14px}
.pro summary{cursor:pointer;padding:12px 0;color:var(--mute);font-size:14px}
.pro summary em{font-style:normal;opacity:.8}
.proin{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.pmeta{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.pager{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:6px}
.pager button{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:15px}
.pager button small{color:var(--mute);font-size:12px}
.pager button.nx{text-align:right;border-color:var(--wire)}
.pager button:hover{border-color:var(--gold)}
.btn.big{padding:10px 16px;font-size:15px}
.stage.tall{aspect-ratio:4/3}
.hint{color:var(--mute);font-size:14px;margin:0}
.howto{margin:6px 0 0;padding-left:1.2em;font-size:16px;display:flex;flex-direction:column;gap:4px}
.phases{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.phases button{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.phases button:hover{border-color:var(--wire)}
.phases b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#2A2000;font-size:16px}
.phases strong{display:block;font-size:17px}
.phases span{color:var(--mute);font-size:14px}
.phases em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--mute)}
@media (max-width:980px){.egrid{grid-template-columns:minmax(0,1fr)}.road span{display:none}.road button{justify-content:center}}
@media (max-width:520px){.pager{grid-template-columns:minmax(0,1fr)}.pager button.nx{text-align:left}.phases button{grid-template-columns:36px minmax(0,1fr)}.phases em{display:none}.cap p{font-size:17px}}
@media (prefers-reduced-motion:reduce){.prog{transition:none}}
</style>
<!--BODY-->
<header class="bar" id="bar">
  <div class="brand">Bản giao hưởng <b>kết cấu</b></div>
  <div class="crumb" id="crumb"></div>
  <div class="nav">
    <button class="btn" id="bIdx" type="button" aria-haspopup="dialog">Mục lục</button>
    <button class="btn" id="bPrev" type="button" aria-label="Slide trước">←</button>
    <span class="count" id="count">—</span>
    <button class="btn" id="bNext" type="button" aria-label="Slide sau">→</button>
  </div>
  <div class="prog" id="prog"></div>
</header>
<main id="main"></main>
<dialog id="dlg" aria-label="Mục lục 40 slide">
  <div class="dh"><strong>Mục lục — 40 slide</strong><button class="btn" id="dClose" type="button">Đóng</button></div>
  <div class="idx" id="idx"></div>
</dialog>
<script type="application/json" id="data">/*__DATA__*/</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const S=D.slides, TOTAL=S.length;
const SPEED=.5;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const main=$('#main');
let cur=0, anim=null;  // 0 = bìa, 1..40 = slide, 41 = phụ lục

/* ---------- Bảng màu canvas ---------- */
const C={wire:'#00E5FF',dim:'rgba(0,229,255,.22)',pass:'#00C853',warn:'#FFAB00',fail:'#FF3B3B',info:'#00B8D4',gold:'#FFC400',
  laser:'#1DE9B6',steel:'#8A9099',conc:'#8E8B86',text:'#D5E6EC',mute:'#6E8792',pink:'#B5838D',purple:'#9575CD',orange:'#FF6D00',yellow:'#F2B705'};
const TURBO=['#30123B','#4145AB','#4675ED','#39A2FC','#1BCFD4','#24ECA6','#61FC6C','#A4FC3B','#D1E834','#F3C63A','#FE9B2D','#D23105','#7A0403'];
const turbo=v=>TURBO[Math.round(Math.max(0,Math.min(1,v))*(TURBO.length-1))];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(p,a,b)=>cl((p-a)/(b-a));
const ez=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ln(g,a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function tx(g,s,x,y,col=C.text,sz=11,al='left',w=400){if(s[0]!=='§')return;s=s.slice(1);sz=Math.max(sz,13);g.fillStyle=col;g.font=`${w} ${sz}px "Be Vietnam Pro",system-ui,sans-serif`;g.textAlign=al;g.textBaseline='middle';g.fillText(s,x,y)}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}

/* ---------- Tháp dạng wireframe ---------- */
function geo(w,h,cx,tw){return{cx:cx??w*.5,by:h*.9,ty:h*.08,tw:tw??Math.min(w*.2,h*.3),n:28}}
const fy=(G,i)=>G.by-(G.by-G.ty)*i/G.n;
function tower(g,G,upto,o={}){
  const k=Math.min(G.n,Math.floor(upto)),off=o.off||(()=>0);
  if(o.fill)for(let i=0;i<k;i++){const of=off(i/G.n);g.fillStyle=o.fill(i);g.fillRect(G.cx-G.tw/2+of,fy(G,i+1),G.tw,fy(G,i)-fy(G,i+1)-1)}
  g.lineWidth=1;
  for(let i=0;i<=k;i++){const y=fy(G,i),of=off(i/G.n);g.strokeStyle=o.floor?o.floor(i):C.dim;ln(g,G.cx-G.tw/2+of,y,G.cx+G.tw/2+of,y)}
  for(let c=0;c<=5;c++){g.strokeStyle=o.col||C.wire;g.globalAlpha=c==0||c==5?.95:.35;g.beginPath();
    for(let i=0;i<=k;i++){const x=G.cx-G.tw/2+G.tw*c/5+off(i/G.n);i?g.lineTo(x,fy(G,i)):g.moveTo(x,fy(G,i))}g.stroke()}
  g.globalAlpha=1;
}
function ground(g,w,G){g.strokeStyle=C.wire;g.globalAlpha=.6;ln(g,0,G.by,w,G.by);g.globalAlpha=1}

/* ---------- Các cảnh mô phỏng ---------- */
const SC={};
SC.strata=(g,w,h,t,Dm,o)=>{
  const p=t/Dm,gy=h*.14,dep=d=>gy+(h-gy)*d;
  const L=[[.08,'#8D6E63','Đất lấp'],[.28,'#5D6D7E','Bùn sét mềm (yếu)'],[.46,'#D4B483','Cát'],[.62,'#A1887F','Sét cứng'],[.8,'#BCAAA4','Sỏi cuội'],[1,'#37474F','Đá cứng (đá gốc)']];
  let y0=gy;for(const[d,c,n]of L){const y1=dep(d);g.fillStyle=c;g.globalAlpha=.42;g.fillRect(0,y0,w,y1-y0);g.globalAlpha=1;tx(g,'§'+n,8,y0+12,'#E8F0F2',13);y0=y1}
  g.strokeStyle=C.wire;g.lineWidth=1.5;ln(g,0,gy,w,gy);g.lineWidth=1;
  if(o.drill){

function Player(cv,sl,ui){
  const g=cv.getContext('2d');const Dm=Math.max(...sl.tl.map(r=>r[1]),12000);let t=RM?Dm*.92:0,playing=!RM,last=0,raf=0;
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);g.setTransform(d,0,0,d,0,0);draw()}
  function draw(){const r=cv.getBoundingClientRect();g.clearRect(0,0,r.width,r.height);try{SC[sl.scene](g,r.width,r.height,t,Dm,sl.opts)}catch(e){console.error(e)}
    ui.tick(t,Dm)}
  function loop(ts){if(!last)last=ts;t+=(ts-last)*SPEED;last=ts;if(t>Dm+1500)t=0;draw();raf=playing?requestAnimationFrame(loop):0}
  const ro=new ResizeObserver(size);ro.observe(cv);
  const api={play(){if(playing)return;playing=true;last=0;raf=requestAnimationFrame(loop);ui.state(true)},pause(){playing=false;cancelAnimationFrame(raf);ui.state(false)},
    toggle(){playing?api.pause():api.play()},seek(ms){t=cl(ms,0,Dm);last=0;draw()},destroy(){playing=false;cancelAnimationFrame(raf);ro.disconnect()},Dm};
  size();if(playing)raf=requestAnimationFrame(loop);ui.state(playing);return api;
}

    <div class="nav"><button class="btn pri big" type="button" data-go="1">Bắt đầu từ bước 1 →</button><button class="btn big" type="button" data-go="${GLOSS}">Từ điển xây dựng</button></div>
  </div>
  <div class="col"><div class="stage tall"><canvas role="img" aria-label="Các bộ phận chính của một tòa nhà cao tầng"></canvas></div><p class="hint">Các bộ phận chính của một tòa nhà cao tầng. Phần dưới mặt đất cũng lớn và quan trọng như phần bạn nhìn thấy.</p></div></section>
  <h3 class="sh">5 giai đoạn của hành trình</h3>
  <ol class="phases">${ROMAN.map((r,i)=>`<li><button type="button" data-go="${firstOf(r)}"><b>${i+1}</b><div><strong>${PH[r][0]}</strong><span>${PH[r][1]}</span></div><em>Bước ${partOf(r).range}</em></button></li>`).join('')}</ol>`;
  bindGo(main);
  anim=Player(main.querySelector('canvas'),{scene:'anatomy',opts:{},tl:[[0,12000,'']]},{tick(){},state(){}});
}
function renderGloss(){
  const all=[];S.forEach(s=>s.easy.tu.forEach(([t,d])=>all.push([t,d,s.n])));
  all.sort((a,b)=>a[0].localeCompare(b[0],'vi'));
  main.innerHTML=`<article class="easy"><header class="ehead"><div class="num">Tra cứu</div><h2>Từ điển xây dựng cho người mới</h2><p class="lede">${all.length} từ khó xuất hiện trong 40 bước, xếp theo vần chữ cái. Bấm "Xem bước" để mở trang giải thích từ đó.</p></header>
    <dl class="gl dict">${all.map(([t,d,n])=>`<div><dt>${t}</dt><dd>${d}</dd><button type="button" class="lnk" data-go="${n}">Xem bước ${n}</button></div>`).join('')}</dl>${pager(GLOSS)}</article>`;
  bindGo(main);anim=null;
}
function renderAppx(){main.innerHTML=`<article class="easy"><header class="ehead"><div class="num">Phụ lục cho kỹ sư</div><h2>Bảng điểm dừng kiểm soát và danh mục hiệu chỉnh tiêu chuẩn</h2></header>
  <div class="appx"><div class="pane">${D.itp}</div><div class="pane"><p><strong>Hiệu chỉnh so với bản nháp Rev.01</strong></p>${D.corr}</div></div>${pager(APPX)}</article>`;bindGo(main);anim=null}

function go(i){i=cl(i,0,LAST);if(anim)anim.destroy();anim=null;cur=i;
  if(i===0)renderCover();else if(i===GLOSS)renderGloss();else if(i===APPX)renderAppx();else renderSlide(S[i-1]);
  $('#count').textContent=i===0?'Trang đầu':i===GLOSS?'Từ điển':i===APPX?'Phụ lục':`Bước ${i}/40`;
  $('#crumb').textContent=i>=1&&i<=TOTAL?`Giai đoạn ${ROMAN.indexOf(S[i-1].part)+1}: ${PH[S[i-1].part][0]}`:'Xây tòa nhà chọc trời từ A đến Z';
  $('#prog').style.width=(i/LAST*100)+'%';$('#bPrev').disabled=i===0;$('#bNext').disabled=i===LAST;
  try{history.replaceState(null,'',i?'#s'+i:location.pathname+location.search)}catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
  document.querySelectorAll('#idx button').forEach(b=>b.classList.toggle('cur',+b.dataset.go===i));
}
$('#bPrev').onclick=()=>go(cur-1);$('#bNext').onclick=()=>go(cur+1);
const dlg=$('#dlg');$('#bIdx').onclick=()=>dlg.showModal();$('#dClose').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
$('#idx').innerHTML=`<button type="button" data-go="0"><span>—</span>Trang đầu: cách xem</button>`+ROMAN.map((r,k)=>`<h3>Giai đoạn ${k+1} · ${PH[r][0]}</h3>`+S.filter(s=>s.part===r).map(s=>`<button type="button" data-go="${s.n}"><span>${s.n}</span>${s.easy.title}</button>`).join('')).join('')
  +`<h3>Tra cứu</h3><button type="button" data-go="${GLOSS}"><span>A–Z</span>Từ điển xây dựng</button><button type="button" data-go="${APPX}"><span>PL</span>Phụ lục cho kỹ sư</button>`;
$('#idx').querySelectorAll('button').forEach(b=>b.onclick=()=>{dlg.close();go(+b.dataset.go)});
addEventListener('keydown',e=>{if(dlg.open||e.target.closest('input,textarea,summary'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key===' '&&anim&&cur>=1&&cur<=TOTAL&&!e.target.closest('button')){e.preventDefault();anim.toggle()}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(TOTAL)});
const fromHash=()=>{const m=/^#s(\d+)$/.exec(location.hash);return m?+m[1]:0};
addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)go(i)});
go(fromHash());

})();
</script>
